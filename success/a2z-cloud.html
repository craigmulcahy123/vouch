<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>How A2Z Cloud built verified trust with their Zoho clients — Vouch</title>
  <meta name="description" content="A2Z Cloud used Vouch to turn happy Zoho implementation clients into verified video testimonials. See how they achieved a 4.9 Vouch Score and 3x more enquiries." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230e0e0e'/><text y='.9em' font-size='70' x='50%' text-anchor='middle' dominant-baseline='middle' dy='0.1em' fill='%23c8a96e' font-family='serif' font-weight='bold'>V</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.4/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink:        #0e0e0e;
      --paper:      #f5f0e8;
      --cream:      #ede8dc;
      --gold:       #c8a96e;
      --gold-light: #e8d5a3;
      --gold-dim:   #8a6d3e;
      --muted:      #7a7060;
      --card:       #faf7f2;
      --border:     #ddd8cc;
      --shadow:     0 2px 16px rgba(14,14,14,0.08);
      --shadow-lg:  0 8px 40px rgba(14,14,14,0.14);
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }
    #root { min-height: 100vh; }
    .serif { font-family: 'Instrument Serif', serif; }
    em { font-style: italic; }

    /* ── Nav ── */
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 40px; border-bottom: 1px solid rgba(255,255,255,0.1);
      background: var(--ink); position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { font-family: 'Instrument Serif', serif; font-size: 1.5rem; letter-spacing: -0.02em; text-decoration: none; color: #fff; }
    .nav-logo span { color: var(--gold); font-style: italic; }
    .nav-links { display: flex; align-items: center; gap: 28px; }
    .nav-link { color: rgba(255,255,255,0.65); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.15s; }
    .nav-link:hover, .nav-link.active { color: #fff; }
    .nav-link.active { color: var(--gold); }
    .nav-actions { display: flex; gap: 10px; align-items: center; }
    .hamburger { display: none; background: none; border: none; cursor: pointer; padding: 4px 2px; flex-direction: column; gap: 5px; }
    .hamburger span { display: block; width: 22px; height: 2px; background: #fff; border-radius: 2px; }
    .mobile-menu { display: none; flex-direction: column; gap: 14px; padding: 16px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: var(--ink); }
    .mobile-menu.open { display: flex; }
    .mobile-menu-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    @media (max-width: 768px) { .nav { padding: 14px 20px; } .nav-links { display: none; } .nav-actions { display: none; } .hamburger { display: flex; } }

    /* ── Buttons ── */
    .btn {
      padding: 11px 24px; border-radius: 9px; border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.9rem;
      transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px;
      text-decoration: none; line-height: 1;
    }
    .btn-gold  { background: var(--gold); color: #fff; }
    .btn-gold:hover  { background: #b8993e; }
    .btn-outline-light { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,0.25); }
    .btn-outline-light:hover { border-color: #fff; }
    .btn-outline { background: transparent; color: var(--ink); border: 1.5px solid var(--border); }
    .btn-outline:hover { border-color: var(--ink); }
    .btn-ink { background: var(--ink); color: #fff; }
    .btn-ink:hover { background: #2a2a2a; }
    .btn-sm { padding: 8px 18px; font-size: 0.84rem; }
    .btn-lg { padding: 15px 32px; font-size: 1rem; }

    /* ── Hero ── */
    .hero {
      background: var(--ink); color: #fff;
      padding: 80px 40px 72px;
      text-align: center; position: relative; overflow: hidden;
    }
    .hero::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 0%, rgba(200,169,110,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-label {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(200,169,110,0.12); border: 1px solid rgba(200,169,110,0.25);
      border-radius: 99px; padding: 5px 16px; margin-bottom: 28px;
      font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold);
    }
    .hero h1 {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      line-height: 1.1; letter-spacing: -0.02em;
      margin-bottom: 20px; max-width: 820px; margin-left: auto; margin-right: auto;
    }
    .hero-sub {
      color: rgba(255,255,255,0.6); font-size: 1.05rem; margin-bottom: 48px;
    }
    .stat-badges {
      display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
    }
    .stat-badge {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; padding: 16px 28px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .stat-badge-value {
      font-family: 'Instrument Serif', serif; font-size: 2rem; color: var(--gold); line-height: 1;
    }
    .stat-badge-label { font-size: 0.78rem; color: rgba(255,255,255,0.5); font-weight: 500; }

    /* ── Story ── */
    .story-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
      background: var(--border); border-radius: 20px; overflow: hidden;
      max-width: 1040px; margin: 0 auto;
    }
    @media (max-width: 720px) { .story-grid { grid-template-columns: 1fr; } }
    .story-card {
      background: var(--card); padding: 40px 36px;
    }
    .story-card-label {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--gold); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
    }
    .story-card h3 {
      font-family: 'Instrument Serif', serif; font-size: 1.4rem; margin-bottom: 14px; line-height: 1.2;
    }
    .story-card p { color: var(--muted); font-size: 0.92rem; line-height: 1.7; }

    /* ── Section wrapper ── */
    .section { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
    .section-header { text-align: center; margin-bottom: 48px; }
    .section-label {
      display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--gold); margin-bottom: 14px;
    }
    .section-title { font-family: 'Instrument Serif', serif; font-size: clamp(1.8rem, 4vw, 2.8rem); line-height: 1.15; letter-spacing: -0.02em; }
    .section-sub { color: var(--muted); font-size: 0.95rem; margin-top: 10px; }

    /* ── Testimonial cards ── */
    .testimonials-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
    }
    @media (max-width: 900px) { .testimonials-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 580px) { .testimonials-grid { grid-template-columns: 1fr; } }
    .tcard {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      overflow: hidden; display: flex; flex-direction: column;
      box-shadow: var(--shadow); transition: box-shadow 0.2s;
    }
    .tcard:hover { box-shadow: var(--shadow-lg); }
    .tcard-thumb {
      aspect-ratio: 16/9; background: #1a1a1a; position: relative; cursor: pointer; overflow: hidden;
    }
    .tcard-thumb-bg {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2520 100%);
    }
    .play-btn {
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--gold); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, background 0.15s; box-shadow: 0 4px 20px rgba(200,169,110,0.4);
    }
    .play-btn:hover { transform: scale(1.1); background: #b8993e; }
    .play-icon { width: 0; height: 0; border-style: solid; border-width: 9px 0 9px 16px; border-color: transparent transparent transparent #fff; margin-left: 3px; }
    .tcard-verified {
      position: absolute; top: 10px; left: 10px;
      background: rgba(14,14,14,0.8); backdrop-filter: blur(6px);
      border: 1px solid rgba(200,169,110,0.3); border-radius: 99px;
      padding: 3px 10px; font-size: 0.67rem; font-weight: 600; color: var(--gold);
      display: flex; align-items: center; gap: 4px;
    }
    .tcard-body { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .tcard-stars { display: flex; gap: 3px; }
    .star { color: var(--gold); font-size: 0.85rem; }
    .tcard-quote { font-size: 0.88rem; line-height: 1.65; color: #333; flex: 1; }
    .tcard-meta { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
    .tcard-avatar {
      width: 38px; height: 38px; border-radius: 50%; background: var(--cream);
      border: 2px solid var(--border); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.88rem; color: var(--muted); flex-shrink: 0;
    }
    .tcard-name { font-weight: 600; font-size: 0.88rem; line-height: 1.2; }
    .tcard-company { font-size: 0.78rem; color: var(--muted); }
    .tcard-zoho { font-size: 0.72rem; color: var(--gold); font-weight: 600; margin-top: 2px; }

    /* ── Score showcase ── */
    .score-section {
      background: var(--ink); border-radius: 24px; padding: 60px 40px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center;
      max-width: 1040px; margin: 0 auto;
    }
    @media (max-width: 720px) { .score-section { grid-template-columns: 1fr; gap: 36px; } }
    .score-mockup {
      background: #161616; border: 1px solid #2a2a2a; border-radius: 18px;
      padding: 32px; text-align: center;
    }
    .score-company-logo {
      width: 56px; height: 56px; background: rgba(200,169,110,0.12); border: 1px solid rgba(200,169,110,0.2);
      border-radius: 14px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;
      font-family: 'Instrument Serif', serif; font-size: 1.4rem; color: var(--gold); font-weight: 700;
    }
    .score-company-name { color: #fff; font-weight: 600; font-size: 1rem; margin-bottom: 4px; }
    .score-company-sub { color: #666; font-size: 0.78rem; margin-bottom: 24px; }
    .score-divider { height: 1px; background: #2a2a2a; margin: 20px 0; }
    .score-value {
      font-family: 'Instrument Serif', serif; font-size: 5rem; color: var(--gold); line-height: 1;
      margin-bottom: 4px;
    }
    .score-out-of { font-size: 0.8rem; color: #555; margin-bottom: 16px; }
    .score-badge {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(200,169,110,0.1); border: 1px solid rgba(200,169,110,0.25);
      border-radius: 99px; padding: 6px 16px; margin-bottom: 20px;
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold);
    }
    .score-bar { background: #222; border-radius: 99px; height: 6px; margin-bottom: 6px; overflow: hidden; }
    .score-bar-fill { background: linear-gradient(90deg, var(--gold), #e8d5a3); height: 100%; border-radius: 99px; }
    .score-bar-label { display: flex; justify-content: space-between; font-size: 0.72rem; color: #555; margin-bottom: 10px; }
    .score-count { color: #888; font-size: 0.82rem; margin-top: 16px; }
    .score-cta-link {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 20px;
      color: var(--gold); font-size: 0.85rem; font-weight: 600; text-decoration: none; transition: gap 0.15s;
    }
    .score-cta-link:hover { gap: 10px; }

    .score-text { color: rgba(255,255,255,0.85); }
    .score-text h2 { font-family: 'Instrument Serif', serif; font-size: clamp(1.8rem, 3vw, 2.6rem); color: #fff; line-height: 1.2; margin-bottom: 20px; }
    .score-text p { color: rgba(255,255,255,0.6); font-size: 0.95rem; line-height: 1.7; margin-bottom: 16px; }
    .score-feature { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
    .score-feature-icon {
      width: 22px; height: 22px; border-radius: 50%; background: rgba(200,169,110,0.15);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
      font-size: 0.65rem; color: var(--gold);
    }
    .score-feature-text { font-size: 0.88rem; color: rgba(255,255,255,0.65); line-height: 1.5; }

    /* ── Badge section ── */
    .badge-section {
      background: var(--cream); border: 1px solid var(--border); border-radius: 24px;
      padding: 56px 40px; max-width: 1040px; margin: 0 auto; text-align: center;
    }
    .badge-mockup {
      display: inline-flex; align-items: center; gap: 12px;
      background: #fff; border: 1.5px solid var(--border); border-radius: 12px;
      padding: 12px 20px; box-shadow: var(--shadow); margin: 32px 0;
    }
    .badge-v {
      width: 36px; height: 36px; background: var(--ink); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Instrument Serif', serif; font-size: 1.2rem; color: var(--gold); font-style: italic;
    }
    .badge-label-wrap { text-align: left; }
    .badge-label-top { font-size: 0.72rem; font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: 0.06em; }
    .badge-label-score { font-family: 'Instrument Serif', serif; font-size: 1.2rem; color: var(--gold); line-height: 1; }
    .badge-label-verified { font-size: 0.65rem; color: var(--muted); }
    .badge-stars-inline { display: flex; gap: 2px; align-items: center; }

    /* ── Pull quote ── */
    .pullquote-section {
      background: var(--ink); padding: 72px 40px; text-align: center;
    }
    .pullquote-mark { font-family: 'Instrument Serif', serif; font-size: 6rem; color: var(--gold); line-height: 0.5; margin-bottom: 24px; opacity: 0.4; }
    .pullquote-text {
      font-family: 'Instrument Serif', serif; font-size: clamp(1.4rem, 3vw, 2.2rem);
      color: #fff; line-height: 1.45; max-width: 720px; margin: 0 auto 28px; font-style: italic;
    }
    .pullquote-attr { color: var(--gold); font-size: 0.9rem; font-weight: 600; }
    .pullquote-attr-sub { color: rgba(255,255,255,0.4); font-size: 0.82rem; margin-top: 4px; }

    /* ── CTA section ── */
    .cta-section {
      text-align: center; padding: 80px 24px;
    }
    .cta-section h2 {
      font-family: 'Instrument Serif', serif; font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 14px;
    }
    .cta-section p { color: var(--muted); font-size: 0.95rem; margin-bottom: 32px; }
    .cta-buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid var(--border); text-align: center; padding: 32px 24px 48px;
      color: var(--muted); font-size: 0.78rem;
    }
    .footer a { color: var(--muted); text-decoration: none; }
    .footer a:hover { color: var(--gold); }
    .footer-links { display: flex; gap: 20px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }

    /* ── Video modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-inner {
      background: var(--ink); border-radius: 18px; padding: 32px;
      max-width: 560px; width: 100%; text-align: center; position: relative;
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      background: #2a2a2a; border: none; color: #fff; width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
    }
    .modal-placeholder {
      aspect-ratio: 16/9; background: #161616; border-radius: 12px; margin-bottom: 20px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    }
    .modal-play-large {
      width: 72px; height: 72px; border-radius: 50%; background: var(--gold);
      display: flex; align-items: center; justify-content: center;
    }
    .modal-play-large .play-icon { border-width: 12px 0 12px 20px; margin-left: 4px; }
    .modal-demo-label { color: rgba(255,255,255,0.4); font-size: 0.82rem; }

    /* ── Spacing helpers ── */
    .py-16 { padding-top: 64px; padding-bottom: 64px; }
    .py-12 { padding-top: 48px; padding-bottom: 48px; }
    .mb-12 { margin-bottom: 48px; }
    .mb-8  { margin-bottom: 32px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState } = React;

  const TESTIMONIALS = [
    {
      id: 1,
      name: "Sarah Thornton",
      company: "Thornton Financial Group",
      initials: "ST",
      stars: 5,
      quote: "A2Z Cloud made our Zoho CRM implementation completely painless. Their team understood our workflows and configured everything exactly how we needed it. Genuinely the best IT partner we've worked with.",
      project: "Zoho CRM implementation",
    },
    {
      id: 2,
      name: "Marcus Webb",
      company: "Webb & Associates",
      initials: "MW",
      stars: 5,
      quote: "We'd been struggling with our old system for years. A2Z Cloud migrated everything to Zoho in under two weeks with zero downtime. Our sales team productivity went up almost immediately.",
      project: "Zoho Books + CRM migration",
    },
    {
      id: 3,
      name: "Priya Kapoor",
      company: "Kapoor Consulting",
      initials: "PK",
      stars: 5,
      quote: "The training sessions they ran for our team were incredible. Six months in and everyone is confident using Zoho every day. I can't recommend A2Z Cloud highly enough to other businesses.",
      project: "Zoho One deployment",
    },
  ];

  function Stars({ count }) {
    return (
      <div className="tcard-stars">
        {Array.from({ length: count }).map((_, i) => (
          <span key={i} className="star">★</span>
        ))}
      </div>
    );
  }

  function VideoModal({ testimonial, onClose }) {
    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal-inner" onClick={e => e.stopPropagation()}>
          <button className="modal-close" onClick={onClose}>✕</button>
          <div className="modal-placeholder">
            <div className="modal-play-large">
              <div className="play-icon" />
            </div>
            <span className="modal-demo-label">Demo testimonial — {testimonial.name}</span>
          </div>
          <div style={{ color: "#fff", fontWeight: 600, marginBottom: 4 }}>{testimonial.name}</div>
          <div style={{ color: "var(--muted)", fontSize: "0.82rem", marginBottom: 12 }}>{testimonial.company}</div>
          <div style={{ color: "rgba(255,255,255,0.6)", fontSize: "0.88rem", fontStyle: "italic", lineHeight: 1.6 }}>
            "{testimonial.quote}"
          </div>
        </div>
      </div>
    );
  }

  function TestimonialCard({ t, onPlay }) {
    return (
      <div className="tcard">
        <div className="tcard-thumb" onClick={() => onPlay(t)}>
          <div className="tcard-thumb-bg">
            <button className="play-btn" onClick={e => { e.stopPropagation(); onPlay(t); }}>
              <div className="play-icon" />
            </button>
          </div>
          <div className="tcard-verified">✓ Verified Zoho client</div>
        </div>
        <div className="tcard-body">
          <Stars count={t.stars} />
          <p className="tcard-quote">"{t.quote}"</p>
          <div className="tcard-meta">
            <div className="tcard-avatar">{t.initials}</div>
            <div>
              <div className="tcard-name">{t.name}</div>
              <div className="tcard-company">{t.company}</div>
              <div className="tcard-zoho">✓ Verified Zoho implementation client</div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  function ScoreBars() {
    const rows = [
      { label: "Communication",   pct: 98 },
      { label: "Expertise",       pct: 100 },
      { label: "Delivery speed",  pct: 95 },
      { label: "Value for money", pct: 96 },
    ];
    return (
      <div>
        {rows.map(r => (
          <div key={r.label}>
            <div className="score-bar-label">
              <span>{r.label}</span>
              <span style={{ color: "var(--gold)" }}>{(r.pct / 20).toFixed(1)}</span>
            </div>
            <div className="score-bar" style={{ marginBottom: 10 }}>
              <div className="score-bar-fill" style={{ width: `${r.pct}%` }} />
            </div>
          </div>
        ))}
      </div>
    );
  }

  function SuccessPage() {
    const [activeVideo, setActiveVideo] = useState(null);
    const [mobileOpen, setMobileOpen] = useState(false);

    return (
      <div style={{ minHeight: "100vh" }}>

        {/* ── Nav ── */}
        <nav className="nav">
          <a href="/" className="nav-logo">Vouch<span>✦</span></a>
          <div className="nav-links">
