// ── Video Playback Modal ──────────────────────────────────────────────────────
function VideoPlaybackModal({ testimonial, onClose }) {
  const processed    = testimonial.processedVideoURLs || {};
  const hasProcessed = Object.keys(processed).length > 0;

  // Build a unified URL map and ordered key list for the tab strip.
  // Priority: AI highlight → full raw Q MP4s → legacy format tabs → raw WebM fallback.
  const rawURLs = {};
  const keys    = [];

  // AI highlight tab (use landscape; portrait/square are alternate downloads)
  const highlightURL = processed.landscape?.url || processed.portrait?.url || processed.square?.url;
  if (highlightURL) {
    rawURLs["highlight"] = highlightURL;
    keys.push("highlight");
  }

  // Full raw Q MP4s produced by the Cloud Function
  ["q0","q1","q2","q3"].forEach(k => {
    if (processed[k]?.url) { rawURLs[k] = processed[k].url; keys.push(k); }
  });

  // Legacy: format tabs without separate Q files
  if (keys.length === 0) {
    ["landscape","portrait","square"].forEach(k => {
      if (processed[k]?.url) { rawURLs[k] = processed[k].url; keys.push(k); }
    });
  }

  // Last resort: original WebM files
  if (keys.length === 0) {
    const webmURLs = testimonial.videoURLs || {};
    Object.keys(webmURLs).sort((a, b) => Number(a) - Number(b)).forEach(k => {
      if (webmURLs[k]) { rawURLs[k] = webmURLs[k]; keys.push(k); }
    });
  }

  const prompts = testimonial.prompts || [];

  const [activeIdx, setActiveIdx] = useState(keys[0] ?? null);
  const [loading, setLoading]     = useState(false);
  const [tapToPlay, setTapToPlay] = useState(false);
  const [errored, setErrored]     = useState(false);
  const [errMsg, setErrMsg]       = useState("");
  const [displayURL, setDisplayURL] = useState(rawURLs[keys[0]] || "");

  const videoRef  = useRef(null);
  // Tracks which clip is "current" so a slow getDownloadURL for a stale
  // clip doesn't overwrite a newer selection after the user clicks a tab.
  const activeClipRef = useRef(null);
  // Prevents React Strict Mode's double-invoke from loading the first clip twice.
  const initRef = useRef(false);

  // Load the first clip once — imperatively, not driven by a state dependency.
  useEffect(() => {
    if (initRef.current) return;
    initRef.current = true;
    console.log("[vouch/watch] modal opened —", {
      client: testimonial.clientName,
      hasProcessed,
      keys,
      rawURLs,
      processedVideoURLs: processed,
      videoURLs: testimonial.videoURLs,
    });
    if (keys[0] != null) playClip(keys[0]);
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  // Attach diagnostic event listeners to the video element for the lifetime of the modal.
  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;
    const ts = () => new Date().toISOString();
    const onPlay    = () => console.log(`[vouch/watch] ▶ play     @ ${ts()} | currentTime: ${video.currentTime.toFixed(3)} | src: ${video.src?.slice(0, 80)}`);
    const onPause   = () => console.log(`[vouch/watch] ⏸ pause    @ ${ts()} | currentTime: ${video.currentTime.toFixed(3)}`);
    const onEnded   = () => console.log(`[vouch/watch] ⏹ ended    @ ${ts()} | currentTime: ${video.currentTime.toFixed(3)}`);
    const onError   = () => console.log(`[vouch/watch] ❌ error    @ ${ts()} | code: ${video.error?.code} | message: ${video.error?.message} | networkState: ${video.networkState} | readyState: ${video.readyState} | error obj:`, video.error);
    const onStalled = () => console.log(`[vouch/watch] ⚠ stalled  @ ${ts()} | currentTime: ${video.currentTime.toFixed(3)} | networkState: ${video.networkState}`);
    const onWaiting = () => console.log(`[vouch/watch] ⏳ waiting  @ ${ts()} | currentTime: ${video.currentTime.toFixed(3)} | readyState: ${video.readyState}`);
    const onEmptied = () => console.log(`[vouch/watch] 🗑 emptied  @ ${ts()} | currentTime: ${video.currentTime.toFixed(3)}`);
    const onSuspend = () => console.log(`[vouch/watch] 💤 suspend  @ ${ts()} | currentTime: ${video.currentTime.toFixed(3)} | networkState: ${video.networkState}`);
    video.addEventListener("play",    onPlay);
    video.addEventListener("pause",   onPause);
    video.addEventListener("ended",   onEnded);
    video.addEventListener("error",   onError);
    video.addEventListener("stalled", onStalled);
    video.addEventListener("waiting", onWaiting);
    video.addEventListener("emptied", onEmptied);
    video.addEventListener("suspend", onSuspend);
    return () => {
      video.removeEventListener("play",    onPlay);
      video.removeEventListener("pause",   onPause);
      video.removeEventListener("ended",   onEnded);
      video.removeEventListener("error",   onError);
      video.removeEventListener("stalled", onStalled);
      video.removeEventListener("waiting", onWaiting);
      video.removeEventListener("emptied", onEmptied);
      video.removeEventListener("suspend", onSuspend);
    };
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  // All video loading is imperative — no effect reacting to activeIdx changes.
  // This avoids the React cleanup / double-invoke cycle that was stopping playback.
  async function playClip(idx) {
    const video = videoRef.current;
    if (!video) return;

    // Mark this as the intended clip so a concurrent stale load can detect it lost.
    activeClipRef.current = idx;

    setActiveIdx(idx);
    setLoading(true);
    setErrored(false);
    setErrMsg("");
    setTapToPlay(false);

    // Stop whatever was playing before we touch src.
    video.pause();

    const storedURL = rawURLs[idx];
    if (!storedURL) {
      console.warn("[vouch/watch] no URL for key:", idx);
      setLoading(false);
      setErrored(true);
      setErrMsg("No video stored for this question.");
      return;
    }

    // Refresh the download URL so expired Firebase tokens are never a problem.
    let url = storedURL;
    try {
      console.log("[vouch/watch] calling getDownloadURL for key:", idx, "| storedURL:", storedURL.slice(0, 80) + "…");
      const ref = firebase.storage().refFromURL(storedURL);
      url = await ref.getDownloadURL();
      console.log("[vouch/watch] getDownloadURL returned for key:", idx, "→", url.slice(0, 80) + "…");
    } catch (e) {
      console.warn("[vouch/watch] URL refresh failed, using stored URL:", e.message);
    }

    // If the user clicked a different tab while we were awaiting, abandon this load.
    if (activeClipRef.current !== idx) {
      console.log("[vouch/watch] clip", idx, "superseded — abandoning load");
      return;
    }

    // iOS Safari cannot play .webm — show a helpful message instead of a broken player.
    if (isIOSDevice() && isWebmUrl(url)) {
      console.warn("[vouch/watch] iOS + .webm — showing compatibility notice");
      setDisplayURL(url);
      setLoading(false);
      setErrored(true);
      setErrMsg("ios-webm");
      return;
    }

    setDisplayURL(url);
    setLoading(false);

    // Set src and load synchronously, then call play().
    // The browser buffers internally; play() queues the request and starts
    // as soon as enough data is ready. No canplay listener needed.
    console.log("[vouch/watch] setting video.src →", url.slice(0, 80) + "…");
    video.src = url;
    console.log("[vouch/watch] calling video.load()");
    video.load();
    console.log("[vouch/watch] calling video.play()");
    video.play().catch(err => {
      console.warn("[vouch/watch] play() blocked:", err.name, "—", err.message);
      setTapToPlay(true);
    });
  }

  function handleTabClick(idx) {
    if (idx === activeIdx) return;
    playClip(idx);
  }

  function handleError() {
    const video = videoRef.current;
    const code  = video?.error?.code;
    const msg   = video?.error?.message || "Unknown media error";
    console.error("[vouch/watch] ❌ MediaError", code, ":", msg, "| src:", video?.src?.slice(0, 80));
    console.error("[vouch/watch] video.error object:", video?.error);
    console.error("[vouch/watch] video state — networkState:", video?.networkState, "| readyState:", video?.readyState, "| currentSrc:", video?.currentSrc?.slice(0, 80));
    setErrored(true);
    setErrMsg(`MediaError ${code}: ${msg}`);
    setTapToPlay(false);
  }

  function handleTap() {
    const video = videoRef.current;
    if (!video) return;
    setTapToPlay(false);
    video.play().catch(err => {
      console.warn("[vouch/watch] tap play() failed:", err.name, err.message);
      setTapToPlay(true);
    });
  }

  if (keys.length === 0) return null;

  return (
    <div className="video-modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="video-modal">
        <div className="video-modal-header">
          <div className="video-modal-title">
            {testimonial.clientName} — Video Responses
          </div>
          <button className="btn btn-outline btn-sm" onClick={onClose} style={{ border: "1px solid #333", color: "#888" }}>✕</button>
        </div>

        {keys.length > 1 && (
          <div className="video-clip-tabs">
            {keys.map(idx => {
              const label = idx === "highlight" ? "⚡ AI Highlight"
                : idx === "q0" ? "Q1" : idx === "q1" ? "Q2" : idx === "q2" ? "Q3" : idx === "q3" ? "Q4"
                : idx === "landscape" ? "16:9" : idx === "portrait" ? "9:16" : idx === "square" ? "1:1"
                : `Q${Number(idx) + 1}`;
              const qPromptIdx = /^q(\d)$/.test(idx) ? Number(idx[1]) : null;
              return (
                <button key={idx} className={`video-clip-tab ${activeIdx === idx ? "active" : ""}`}
                  onClick={() => handleTabClick(idx)}>
                  {label}
                  {qPromptIdx !== null && prompts[qPromptIdx] && (
                    <span style={{ display: "block", fontSize: "0.72rem", opacity: 0.7, maxWidth: 120, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                      {prompts[qPromptIdx]}
                    </span>
                  )}
                </button>
              );
            })}
          </div>
        )}

        {/* Video player */}
        <div style={{ position: "relative", borderRadius: 10, overflow: "hidden", background: "#000", minHeight: 180 }}>
          {/* Spinner while Firebase URL is being refreshed */}
          {loading && (
            <div style={{
              position: "absolute", inset: 0, display: "flex", alignItems: "center",
              justifyContent: "center", background: "#000", zIndex: 10,
            }}>
              <div style={{ width: 36, height: 36, border: "3px solid #333", borderTopColor: "var(--gold)", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />
            </div>
          )}

          {/* Single persistent video element — src is set imperatively in playClip(),
              never via JSX props, so React re-renders can't interfere with playback. */}
          <video
            ref={videoRef}
            controls
            playsInline
            preload="auto"
            onPlaying={() => setTapToPlay(false)}
            onError={handleError}
            style={{ width: "100%", display: "block" }}
          />

          {/* Tap-to-play overlay — shown when autoplay policy blocks auto-start */}
          {tapToPlay && !errored && (
            <div onClick={handleTap} style={{
              position: "absolute", inset: 0,
              display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
              background: "rgba(0,0,0,0.55)", cursor: "pointer", gap: 10,
            }}>
              <div style={{
                width: 64, height: 64, borderRadius: "50%",
                background: "rgba(200,169,110,0.9)",
                display: "flex", alignItems: "center", justifyContent: "center",
              }}>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
              </div>
              <span style={{ color: "#fff", fontSize: "0.9rem", fontWeight: 600 }}>Tap to play</span>
            </div>
          )}

          {/* Error state */}
          {errored && (
            <div style={{
              position: "absolute", inset: 0, display: "flex", flexDirection: "column",
              alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.85)", gap: 10, padding: "0 28px",
            }}>
              {errMsg === "ios-webm" ? (
                <>
                  <div style={{ fontSize: "2rem" }}>📱</div>
                  <div style={{ color: "#f0ece4", fontSize: "0.92rem", textAlign: "center", fontWeight: 600 }}>
                    Desktop recording — Safari not supported
                  </div>
                  <div style={{ color: "#888", fontSize: "0.8rem", textAlign: "center", lineHeight: 1.5 }}>
                    This video was recorded on desktop (WebM format). Safari on iOS can't play WebM. Open on a desktop browser or use the link below.
                  </div>
                  {displayURL && (
                    <a href={displayURL} target="_blank" rel="noopener noreferrer"
                      style={{ color: "#c8a96e", fontSize: "0.85rem", textDecoration: "underline", marginTop: 4 }}>
                      Open in new tab ↗
                    </a>
                  )}
                </>
              ) : (
                <>
                  <div style={{ fontSize: "2rem" }}>⚠️</div>
                  <div style={{ color: "#e07a7a", fontSize: "0.88rem", textAlign: "center" }}>Video could not be loaded.</div>
                  {errMsg && <div style={{ color: "#666", fontSize: "0.72rem", textAlign: "center" }}>{errMsg}</div>}
                  {displayURL && (
                    <a href={displayURL} target="_blank" rel="noopener noreferrer"
                      style={{ color: "#c8a96e", fontSize: "0.82rem", textDecoration: "underline", marginTop: 4 }}>
                      Open in new tab ↗
                    </a>
                  )}
                </>
              )}
            </div>
          )}
        </div>

        {activeIdx === "highlight" && testimonial.clipReason && (
          <div style={{ marginTop: 10, padding: "10px 14px", background: "#111", borderRadius: 8, border: "1px solid #222", fontSize: "0.82rem", color: "#888", lineHeight: 1.5 }}>
            <span style={{ color: "#c8a96e", fontWeight: 600 }}>⚡ AI selected this moment because: </span>
            {testimonial.clipReason}
          </div>
        )}
        {activeIdx !== null && /^q(\d)$/.test(activeIdx) && prompts[Number(activeIdx[1])] && (
          <div style={{ marginTop: 14, color: "#888", fontSize: "0.85rem", lineHeight: 1.5 }}>
            <span style={{ color: "var(--gold)", fontWeight: 600 }}>Q: </span>{prompts[Number(activeIdx[1])]}
          </div>
        )}
      </div>
    </div>
  );
}

function daysSince(ts) {
  return Math.floor((Date.now() - ts) / 86400000);
}

function InvitesKanban({ invites, db, userId, onReview }) {
  async function updateStatus(invite, newStatus) {
    if (!db || !userId) return;
    const now = Date.now();
    const patch = { status: newStatus };
    if (newStatus === "approved")  patch.approvedAt = now;
    if (newStatus === "delivered") patch.deliveredAt = now;
    await db.collection("users").doc(userId).collection("invites").doc(invite.id).update(patch);
    // When approving from pipeline, also approve the linked testimonial
    if (newStatus === "approved" && invite.id) {
      const tSnap = await db.collection("users").doc(userId).collection("testimonials")
        .where("inviteId", "==", invite.id).limit(1).get();
      if (!tSnap.empty) {
        await tSnap.docs[0].ref.update({ status: "approved" });
      }
    }
  }

  async function handleResend(invite) {
    try {
      await sendInviteEmail({
        toEmail: invite.toEmail,
        clientName: invite.clientName,
        campaign: { id: invite.campaignId, name: invite.campaignName, companyName: invite.companyName, prompts: [] },
        inviteId: invite.id,
        ownerEmail: userEmail,
      });
      alert(`Re-sent to ${invite.toEmail}`);
    } catch (e) {
      alert("Resend failed: " + e.message);
    }
  }

  // ── Stats ──
  const total = invites.length;
  const delivered = invites.filter(i => i.status === "delivered");
  const completionRate = total > 0 ? Math.round((delivered.length / total) * 100) : 0;
  const avgDays = delivered.length > 0
    ? Math.round(delivered.reduce((sum, i) => sum + ((i.deliveredAt || Date.now()) - i.invitedAt), 0) / delivered.length / 86400000)
    : null;
  const atRisk = invites.filter(i => i.status === "invited" || i.status === "opened")
    .reduce((sum, i) => sum + (i.planValue || 497), 0);
  const inPipeline = invites.filter(i => i.status !== "delivered").length;

  return (
    <div>
      {/* Summary stats */}
      <div className="pipeline-stats">
        <div className="pipeline-stat">
          <div className="pipeline-stat-num serif">{inPipeline}</div>
          <div className="pipeline-stat-label">In Pipeline</div>
        </div>
        <div className="pipeline-stat">
          <div className="pipeline-stat-num serif">{avgDays !== null ? `${avgDays}d` : "—"}</div>
          <div className="pipeline-stat-label">Avg Completion</div>
        </div>
        <div className="pipeline-stat">
          <div className="pipeline-stat-num serif">{completionRate}%</div>
          <div className="pipeline-stat-label">Completion Rate</div>
        </div>
        <div className="pipeline-stat">
          <div className="pipeline-stat-num serif" style={{ color: atRisk > 0 ? "#e05c5c" : "var(--ink)" }}>
            £{atRisk.toLocaleString()}
          </div>
          <div className="pipeline-stat-label">Revenue at Risk</div>
        </div>
      </div>

      {/* Kanban board */}
      {total === 0 ? (
        <div style={{ textAlign: "center", padding: "60px 20px", color: "var(--muted)", background: "var(--cream)", borderRadius: 14 }}>
          <div style={{ fontSize: "2rem", marginBottom: 12 }}>📬</div>
          <div style={{ fontFamily: "Instrument Serif, serif", fontSize: "1.3rem", marginBottom: 8 }}>No invites yet</div>
          <div style={{ fontSize: "0.88rem" }}>Send your first invite from the Campaigns tab to start tracking your pipeline.</div>
        </div>
      ) : (
        <div className="kanban-board">
          {PIPELINE_STAGES.map(stage => {
            const cards = invites.filter(i => i.status === stage.key);
            return (
              <div key={stage.key} className="kanban-col">
                <div className="kanban-col-header">
                  <div className="kanban-col-label" style={{ color: stage.color }}>{stage.label}</div>
                  <div className="kanban-col-count">{cards.length}</div>
                </div>
                {cards.length === 0 && (
                  <div style={{ fontSize: "0.78rem", color: "var(--border)", textAlign: "center", padding: "20px 0" }}>—</div>
                )}
                {cards.map(invite => {
                  const days = daysSince(invite.invitedAt);
                  const stale = stage.key === "invited" && days >= 3;
                  return (
                    <div key={invite.id} className={`kanban-card ${stage.key}`}>
                      <div className="kc-name">{invite.clientName}</div>
                      {invite.companyName && <div className="kc-company">{invite.companyName}</div>}
                      <div className="kc-campaign">{invite.campaignName}</div>
                      <div className="kc-days">{days === 0 ? "Today" : `${days}d ago`}</div>
                      <div className="kc-actions">
                        {stage.key === "delivered" && (
                          <span className="kc-badge-done">✓ Done</span>
                        )}
                        {stage.key === "invited" && stale && (
                          <button className="btn btn-outline btn-sm" style={{ fontSize: "0.75rem", padding: "4px 10px" }}
                            onClick={() => handleResend(invite)}>
                            ↩ Resend
                          </button>
                        )}
                        {stage.key === "recorded" && (
                          <button className="btn btn-gold btn-sm" style={{ fontSize: "0.75rem", padding: "4px 10px" }}
                            onClick={() => onReview(invite)}>
                            Review
                          </button>
                        )}
                        {(stage.key === "recorded" || stage.key === "opened") && (
                          <button className="btn btn-outline btn-sm" style={{ fontSize: "0.75rem", padding: "4px 10px" }}
                            onClick={() => updateStatus(invite, "approved")}>
                            Approve
                          </button>
                        )}
                        {stage.key === "approved" && (
                          <button className="btn btn-primary btn-sm" style={{ fontSize: "0.75rem", padding: "4px 10px" }}
                            onClick={() => updateStatus(invite, "delivered")}>
                            Mark Delivered
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── Profile Settings ─────────────────────────────────────────────────────────
function ProfileSettings({ db, userId, storage }) {
  const EMPTY = { businessName: "", industry: "", location: "", website: "", bio: "", linkedin: "", twitter: "", instagram: "", isPublic: true };
  const [fields, setFields]       = useState(EMPTY);
  const [logoUrl, setLogoUrl]     = useState(null);
  const [logoFile, setLogoFile]   = useState(null);
  const [logoPreview, setLogoPreview] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [saving, setSaving]       = useState(false);
  const [saved, setSaved]         = useState(false);
  const [error, setError]         = useState("");
  const fileRef = useRef(null);

  useEffect(() => {
    if (!db || !userId) return;
    db.collection("users").doc(userId).get().then(snap => {
      if (!snap.exists) return;
      const d = snap.data();
      const p = d.profile || {};
      setFields({
        businessName: p.businessName || d.companyName || "",
        industry:     p.industry || d.industry || "",
        location:     p.location || "",
        website:      p.website || "",
        bio:          p.bio || "",
        linkedin:     p.linkedin || "",
        twitter:      p.twitter || "",
        instagram:    p.instagram || "",
        isPublic:     p.isPublic !== false,
      });
      if (p.logoUrl) setLogoUrl(p.logoUrl);
    }).catch(console.error);
  }, [db, userId]);

  function set(key, val) { setFields(prev => ({ ...prev, [key]: val })); setSaved(false); }

  function handleLogoChange(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!["image/jpeg", "image/png"].includes(file.type)) { setError("Logo must be a JPG or PNG image."); return; }
    if (file.size > 2 * 1024 * 1024) { setError("Logo must be under 2 MB."); return; }
    setError(""); setLogoFile(file); setLogoPreview(URL.createObjectURL(file)); setSaved(false);
  }

  async function handleSave() {
    setSaving(true); setError(""); setSaved(false);
    try {
      let url = logoUrl;
      if (logoFile && storage) {
        setUploading(true);
        const ref = storage.ref(`logos/${userId}/logo.jpg`);
        const task = ref.put(logoFile, { contentType: logoFile.type });
        await new Promise((res, rej) => task.on("state_changed", null, rej, res));
        url = await task.snapshot.ref.getDownloadURL();
        setLogoUrl(url); setLogoFile(null); setUploading(false);
      }
      await db.collection("users").doc(userId).set({
        profile: { ...fields, ...(url ? { logoUrl: url } : {}) },
        companyName: fields.businessName || null,
      }, { merge: true });
      setSaved(true);
      setTimeout(() => setSaved(false), 3000);
    } catch (e) {
      setError("Save failed: " + e.message); setUploading(false);
    }
    setSaving(false);
  }

  const displayLogo = logoPreview || logoUrl;
  const profileUrl  = `https://vouchbusiness.com/profile/${userId}`;

  return (
    <div style={{ maxWidth: 600 }}>
      <div className="section-title serif" style={{ marginBottom: 4 }}>Profile Settings</div>
      <div style={{ color: "var(--muted)", fontSize: "0.88rem", marginBottom: 28 }}>
        Your public profile at{" "}
        <a href={profileUrl} target="_blank" rel="noopener" style={{ color: "var(--gold)" }}>{profileUrl}</a>
      </div>

      {error && (
        <div style={{ background: "#fef2f2", border: "1px solid #fca5a5", borderRadius: 8, padding: "10px 14px", marginBottom: 20, color: "#991b1b", fontSize: "0.85rem" }}>
          {error}
        </div>
      )}

      {/* Logo */}
      <div style={{ background: "var(--card)", border: "1px solid var(--border)", borderRadius: 14, padding: "24px 28px", marginBottom: 16 }}>
        <div style={{ fontSize: "0.72rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em", color: "var(--muted)", marginBottom: 14 }}>Logo</div>
        <div className="logo-upload-area" onClick={() => fileRef.current?.click()}>
          {displayLogo ? (
            <>
              <img src={displayLogo} alt="Logo" className="logo-preview" />
              <div style={{ fontSize: "0.82rem", color: "var(--muted)" }}>Click to replace</div>
            </>
          ) : (
            <>
              <div style={{ fontSize: "2rem", marginBottom: 8 }}>🖼</div>
              <div style={{ fontSize: "0.9rem", fontWeight: 600, marginBottom: 4 }}>Upload your logo</div>
              <div style={{ fontSize: "0.8rem", color: "var(--muted)" }}>JPG or PNG · Max 2 MB</div>
            </>
          )}
        </div>
        <input ref={fileRef} type="file" accept="image/jpeg,image/png" style={{ display: "none" }} onChange={handleLogoChange} />
      </div>

      {/* Business details */}
      <div style={{ background: "var(--card)", border: "1px solid var(--border)", borderRadius: 14, padding: "24px 28px", marginBottom: 16 }}>
        <div style={{ fontSize: "0.72rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em", color: "var(--muted)", marginBottom: 14 }}>Business Details</div>
        <div className="form-row">
          <div className="field">
            <label>Business name</label>
            <input value={fields.businessName} onChange={e => set("businessName", e.target.value)} placeholder="e.g. Acme Agency" />
          </div>
          <div className="field">
            <label>Industry / niche</label>
            <input value={fields.industry} onChange={e => set("industry", e.target.value)} placeholder="e.g. Digital Marketing" />
          </div>
        </div>
        <div className="form-row">
          <div className="field">
            <label>Location</label>
            <input value={fields.location} onChange={e => set("location", e.target.value)} placeholder="e.g. Dublin, Ireland" />
          </div>
          <div className="field">
            <label>Website URL</label>
            <input value={fields.website} onChange={e => set("website", e.target.value)} placeholder="https://yoursite.com" />
          </div>
        </div>
        <div className="field">
          <label>
            Short bio / description{" "}
            <span style={{ fontWeight: 400, color: "var(--muted)" }}>({200 - fields.bio.length} chars left)</span>
          </label>
          <textarea rows={3} maxLength={200}
            value={fields.bio} onChange={e => set("bio", e.target.value)}
            placeholder="Tell clients what you do in a sentence or two…" />
        </div>
      </div>

      {/* Social links */}
      <div style={{ background: "var(--card)", border: "1px solid var(--border)", borderRadius: 14, padding: "24px 28px", marginBottom: 16 }}>
        <div style={{ fontSize: "0.72rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em", color: "var(--muted)", marginBottom: 14 }}>Social Links</div>
        <div className="field" style={{ marginBottom: 12 }}>
          <label>LinkedIn</label>
          <input value={fields.linkedin} onChange={e => set("linkedin", e.target.value)} placeholder="https://linkedin.com/company/yourcompany" />
        </div>
        <div className="field" style={{ marginBottom: 12 }}>
          <label>Twitter / X</label>
          <input value={fields.twitter} onChange={e => set("twitter", e.target.value)} placeholder="https://twitter.com/yourhandle" />
        </div>
        <div className="field">
          <label>Instagram</label>
          <input value={fields.instagram} onChange={e => set("instagram", e.target.value)} placeholder="https://instagram.com/yourhandle" />
        </div>
      </div>

      {/* Visibility */}
      <div style={{ background: "var(--card)", border: "1px solid var(--border)", borderRadius: 14, padding: "24px 28px", marginBottom: 24 }}>
        <div style={{ fontSize: "0.72rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em", color: "var(--muted)", marginBottom: 14 }}>Visibility</div>
        <label className="toggle-wrap" onClick={() => set("isPublic", !fields.isPublic)}>
          <div className={`toggle-track${fields.isPublic ? " on" : ""}`}>
            <div className="toggle-knob" />
          </div>
          <span style={{ fontSize: "0.92rem" }}>Make my Vouch profile public</span>
        </label>
        <div style={{ fontSize: "0.8rem", color: "var(--muted)", marginTop: 8, paddingLeft: 56 }}>
          {fields.isPublic
            ? "Your profile is visible to anyone with the link."
            : "Your profile is hidden — only you can view it."}
        </div>
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
        <button className="btn btn-primary" onClick={handleSave} disabled={saving || uploading}>
          {uploading ? "Uploading logo…" : saving ? "Saving…" : "Save Profile"}
        </button>
        {saved && <span style={{ color: "#3a7a3a", fontSize: "0.88rem", fontWeight: 500 }}>✓ Profile saved</span>}
      </div>
    </div>
  );
}

// ── QuoteProcessingIndicator ──────────────────────────────────────────────────
// Shows a spinner while the Cloud Function generates the quote from the video
// transcript, then displays the finished quote once Firestore is updated.
function QuoteProcessingIndicator({ testimonialId, userId, db }) {
  const [resolvedQuote, setResolvedQuote] = useState(null);

  useEffect(() => {
    if (!db || !userId || !testimonialId) return;

    function check() {
      db.collection("users").doc(userId).collection("testimonials").doc(testimonialId).get()
        .then(snap => {
          if (!snap.exists) return;
          const q = snap.data().quote;
          if (q && q !== "Processing transcript...") setResolvedQuote(q);
        })
        .catch(() => {});
    }

    const timer = setInterval(check, 10000);
    return () => clearInterval(timer);
  }, [db, userId, testimonialId]);

  if (resolvedQuote) {
    return React.createElement("div", { className: "t-quote" }, `"${resolvedQuote}"`);
  }

  return React.createElement("div", {
    style: { marginTop: 6, fontSize: "0.85rem", color: "#888", display: "flex", alignItems: "center", gap: 6 }
  },
    React.createElement("span", {
      style: { display: "inline-block", width: 10, height: 10, borderRadius: "50%", border: "2px solid #c8a96e", borderTopColor: "transparent", animation: "spin 0.8s linear infinite", flexShrink: 0 }
    }),
    "Generating quote from transcript…"
  );
}

            { title: "One-Page PDF", desc: "A co-branded PDF you can send to prospects explaining Vouch and its benefits.", icon: "📄", action: "Download PDF" },

            { rank: 3, name: "D.K.", company: "Momentum Consulting",referrals: 24, tier: "💎 Platinum" },
            { rank: 4, name: "A.T.", company: "BrandForge",         referrals: 18, tier: "🥇 Gold" },

              <div style={{ fontWeight: 700, fontSize: "0.88rem", color: "var(--gold)" }}>{referrals} referrals</div>

          ))}
          <div style={{ padding: "12px 24px", fontSize: "0.78rem", color: "var(--muted)", textAlign: "center" }}>

}

// ── Dashboard ──────────────────────────────────────────────────────────────
function Dashboard({ onPreview, userId, userEmail, db, storage, onUpgrade }) {
  const [innerTab, setInnerTab] = useState("campaigns");

  // Plan state — loaded from Firestore users/{userId}.plan; defaults to "free"
  const [planKey, setPlanKey] = useState("free");
  const [planLoaded, setPlanLoaded] = useState(false);
  const plan = PLANS[planKey] || PLANS.free;

  // Partner state — loaded from same user doc
  const [isPartner, setIsPartner] = useState(false);
  const [partnerStats, setPartnerStats] = useState({ referralCount: 0, totalEarnings: 0, pendingPayout: 0, commissions: [] });

  // Load plan + partner status from Firestore on mount
  useEffect(() => {
    if (!db || !userId) return;
    const unsubPlan = db.collection("users").doc(userId)
      .onSnapshot(snap => {
        const data = snap.data();
        const stored = data?.plan;
        setPlanKey(PLANS[stored] ? stored : "free");
        setPlanLoaded(true);
        const partner = data?.partner === true;
        setIsPartner(partner);
        if (partner) {
          setPartnerStats({
            referralCount: data.referralCount || 0,
            totalEarnings: data.totalEarnings || 0,
            pendingPayout: data.pendingPayout || 0,
            commissions: data.commissions || [],
          });
        }
      }, err => {
        console.error("[vouch] plan listener error:", err.message);
        setPlanLoaded(true);
      });
    return () => unsubPlan();
  }, [db, userId]);

  // Write plan change to Firestore (testing mode + future Stripe webhook target)
  async function setUserPlan(key) {
    if (!PLANS[key] || !db || !userId) return;
    setPlanKey(key);
    try {
      await db.collection("users").doc(userId).set({ plan: key }, { merge: true });
    } catch (e) {
      console.error("[vouch] failed to save plan:", e.message);
    }
  }

  const [inviteTarget, setInviteTarget] = useState(null);
  const [playbackTarget, setPlaybackTarget] = useState(null);
  const [editTarget, setEditTarget] = useState(null);
  const [downloadDropdown, setDownloadDropdown] = useState(null);
  const [reprocessingIds, setReprocessingIds] = useState(new Set());

  const [campaigns, setCampaigns] = useState([]);
  const [testimonials, setTestimonials] = useState([]);
  const [invites, setInvites] = useState([]);
  const [dbError, setDbError] = useState(null);

  useEffect(() => {
    if (!db || !userId) return;

    // ── DIAGNOSTIC LOGGING ────────────────────────────────────────────────
    console.group("[vouch] Dashboard Firestore listeners starting");
    console.log("userId (dashboard owner):", userId);
    console.log("listening to: users/" + userId + "/campaigns");
    console.log("listening to: users/" + userId + "/testimonials");
    console.log("listening to: users/" + userId + "/invites");
    console.groupEnd();
    // ──────────────────────────────────────────────────────────────────────

    const unsubCampaigns = db.collection("users").doc(userId).collection("campaigns")
      .orderBy("createdAt", "desc")
      .onSnapshot(
        snap => {
          setDbError(null);
          setCampaigns(snap.docs.map(d => d.data()));
        },
        err => { console.error("[vouch] campaigns listener error:", err.code, err.message); setDbError(err.message); }
      );
    const unsubTestimonials = db.collection("users").doc(userId).collection("testimonials")
      .orderBy("createdAt", "desc")
      .onSnapshot(
        snap => {
          const docs = snap.docs.map(d => d.data());
          console.log("[vouch] testimonials snapshot — count:", docs.length,
            "| path: users/" + userId + "/testimonials");
          docs.forEach(t => {
            const urlKeys = Object.keys(t.videoURLs || {});
            console.log("[vouch]   testimonial", t.id, "| client:", t.clientName,
              "| status:", t.status,
              "| videoURLs keys:", urlKeys.length ? urlKeys : "(none)");
          });
          setTestimonials(docs);
        },
        err => console.error("[vouch] testimonials listener error:", err.code, err.message)
      );
    const unsubInvites = db.collection("users").doc(userId).collection("invites")
      .orderBy("invitedAt", "desc")
      .onSnapshot(
        snap => {
          console.log("[vouch] invites snapshot — count:", snap.docs.length,
            "| statuses:", snap.docs.map(d => d.data().status),
            "| ids:", snap.docs.map(d => d.id));
          setInvites(snap.docs.map(d => d.data()));
        },
        err => console.error("[vouch] invites listener error:", err.code, err.message)
      );
    return () => { unsubCampaigns(); unsubTestimonials(); unsubInvites(); };
  }, [db, userId]);
  const [showCreate, setShowCreate] = useState(false);

  // New campaign form
  const [form, setForm] = useState({ name: "", companyName: "", industry: "", context: "" });
  const [prompts, setPrompts] = useState([]);
  const [generating, setGenerating] = useState(false);
  const [copiedId, setCopiedId] = useState(null);
  const [campaignKebab, setCampaignKebab] = useState(null);
  const [saving, setSaving] = useState(false);
  const [saveError, setSaveError] = useState(null);

  async function handleGenerate() {
    if (!form.companyName || !form.industry) return;
    setGenerating(true);
    try {
      const p = await generatePrompts(form.companyName, form.industry, form.context);
      setPrompts(p);
    } catch (e) {
      alert("Failed to generate prompts: " + e.message);
    }
    setGenerating(false);
  }

  async function saveCampaign() {
    setSaveError(null);
    if (!db) { setSaveError("Database not ready — please wait a moment and try again."); return; }
    if (!userId) { setSaveError("Not signed in."); return; }
    setSaving(true);
    try {
      const id = Date.now().toString();
      const c = { id, ownerId: userId, ...form, prompts, createdAt: Date.now() };
      console.log("[saveCampaign] writing to Firestore:", c);
      await db.collection("users").doc(userId).collection("campaigns").doc(id).set(c);
      console.log("[saveCampaign] write succeeded");
      setForm({ name: "", companyName: "", industry: "", context: "" });
      setPrompts([]);
      setShowCreate(false);
    } catch (e) {
      console.error("[saveCampaign] write failed:", e);
      setSaveError(e.message || "Failed to save campaign. Check the console for details.");
    } finally {
      setSaving(false);
    }
  }

  function copyLink(campaignId) {
    const url = `https://vouchbusiness.com/record/${campaignId}?owner=${userId}`;
    navigator.clipboard.writeText(url).catch(() => {});
    setCopiedId(campaignId);
    setTimeout(() => setCopiedId(null), 2000);
  }

  function markDownloaded(testimonialId) {
    if (!db || !userId || !testimonialId) return;
    db.collection("users").doc(userId).collection("testimonials")
      .doc(testimonialId).update({ downloaded: true, downloadedAt: Date.now() })
      .catch(console.error);
  }

  async function downloadVideo(url, filename, testimonialId) {
    try {
      const res = await fetch(url);
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = objUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(objUrl);
      markDownloaded(testimonialId);
    } catch (e) {
      alert("Download failed. Try right-clicking the video in the Watch view and saving.");
    }
  }

  function downloadQuoteText(t) {
    const lines = [
      `Name: ${t.clientName || ""}`,
      t.clientCompany ? `Company: ${t.clientCompany}` : null,
      t.campaignName ? `Campaign: ${t.campaignName}` : null,
      t.rating ? `Rating: ${"★".repeat(t.rating)}${"☆".repeat(5 - t.rating)}` : null,
      "",
      t.quote || "(No AI quote generated yet)",
    ].filter(l => l !== null).join("\n");
    const blob = new Blob([lines], { type: "text/plain" });
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objUrl;
    a.download = `${(t.clientName || "testimonial").replace(/\s+/g, "-")}-quote.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(objUrl);
    markDownloaded(t.id);
  }

  return (
    <div className="dashboard">
      {inviteTarget && <InviteModal campaign={inviteTarget} db={db} userId={userId} ownerEmail={userEmail} onClose={() => setInviteTarget(null)} />}
      {playbackTarget && <VideoPlaybackModal testimonial={playbackTarget} onClose={() => setPlaybackTarget(null)} />}
      {editTarget && <VideoEditor testimonial={editTarget} onClose={() => setEditTarget(null)} />}
      {dbError && (
        <div style={{ margin: "0 0 20px", color: "#e05c5c", fontSize: "0.85rem", background: "#2a1010", border: "1px solid #5c2020", borderRadius: 8, padding: "12px 16px" }}>
          <strong>Firestore error:</strong> {dbError}
          {dbError.includes("index") && <span> — open the Firebase Console link in the browser console to create the required index.</span>}
        </div>
      )}
      {(() => {
        const approved = testimonials.filter(t => t.status === "approved");
        const approvedCount = approved.length;
        const vouchScore = approvedCount >= 3
          ? Math.round((approved.reduce((sum, t) => sum + (Number(t.rating) || 0), 0) / approvedCount) * 10) / 10
          : null;
        const profileUrl = `https://vouchbusiness.com/profile/${userId}`;
        const [scoreCopied, setScoreCopied] = React.useState(false);
        function shareScore() {
          navigator.clipboard.writeText(profileUrl).catch(() => {});
          setScoreCopied(true);
          setTimeout(() => setScoreCopied(false), 2000);
        }
        const pInvited   = invites.filter(i => i.status === "invited").length;
        const pOpened    = invites.filter(i => i.status === "opened").length;
        const pRecorded  = invites.filter(i => i.status === "recorded").length;
        const pApproved  = invites.filter(i => i.status === "approved").length;
        const pDelivered = invites.filter(i => i.status === "delivered").length;
        return (
          <>
            {/* ── Hero card ── */}
            <div className="hero-card">
              {/* Score column */}
              <div>
                <div className="hero-score-label">✦ Vouch Score</div>
                {vouchScore !== null ? (
                  <>
                    <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 4 }}>
                      <span className="hero-score-num">{vouchScore.toFixed(1)}</span>
                      <span style={{ fontSize: 26, color: "#B8956A", lineHeight: 1 }}>★</span>
                    </div>
                    <div className="hero-score-sub">from {approvedCount} verified testimonial{approvedCount !== 1 ? "s" : ""}</div>
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                      <button className="hero-score-btn" onClick={shareScore}>{scoreCopied ? "✓ Copied!" : "Copy link"}</button>
                      <button className="hero-score-btn" onClick={() => window.open(`https://vouchbusiness.com/profile/${userId}`, "_blank")}>View profile →</button>
                    </div>
                  </>
                ) : (
                  <>
                    <div style={{ fontFamily: "'Instrument Serif', serif", fontSize: 40, fontWeight: 500, color: "rgba(245,239,227,0.3)", lineHeight: 1, marginBottom: 6 }}>—</div>
                    <div className="hero-score-sub">Approve {Math.max(0, 3 - approvedCount)} more testimonial{3 - approvedCount !== 1 ? "s" : ""} to unlock</div>
                    <div style={{ display: "flex", gap: 4, marginTop: 10 }}>
                      {[0,1,2].map(i => (
                        <div key={i} style={{ height: 3, flex: 1, borderRadius: 2, background: i < approvedCount ? "#B8956A" : "rgba(245,239,227,0.12)" }} />
                      ))}
                    </div>
                  </>
                )}
              </div>
              {/* Stats columns */}
              {[
                { label: "Active Campaigns", value: campaigns.length },
                { label: "Received",         value: testimonials.length },
                { label: "Approved",         value: approvedCount },
              ].map(({ label, value }) => (
                <div key={label} className="hero-stat-col">
                  <div className="hero-stat-label">{label}</div>
                  <div className="hero-stat-num">{value}</div>
                </div>
              ))}
            </div>

            {/* ── Pipeline strip ── */}
            <div className="pipeline-strip">
              <div className="pipeline-header">
                <span className="pipeline-lbl">Pipeline</span>
                <button className="pipeline-link-btn" onClick={() => setInnerTab("invites")}>View all invites →</button>
              </div>
              <div className="pipeline-cols">
                {[
                  { stage: "Invited",   count: pInvited,   gold: false },
                  { stage: "Opened",    count: pOpened,    gold: false },
                  { stage: "Recorded",  count: pRecorded,  gold: false },
                  { stage: "Approved",  count: pApproved,  gold: false },
                  { stage: "Delivered", count: pDelivered, gold: true  },
                ].map(({ stage, count, gold }) => (
                  <div key={stage} className="pipeline-col">
                    <div className={`pipeline-num${gold ? " gold" : ""}`}>{count}</div>
                    <div className="pipeline-stage-label">{stage}</div>
                  </div>
                ))}
              </div>
            </div>
          </>
        );
      })()}

      <div className="tabs-inner">
        {[
          { key: "campaigns",    label: "Campaigns",     icon: <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg> },
          { key: "testimonials", label: "Testimonials",  icon: <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> },
          { key: "invites",      label: "Invites",       icon: <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> },
          { key: "billing",      label: "Plan & Billing",icon: <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> },
          { key: "profile",      label: "Profile",       icon: <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> },
          ...(isPartner ? [{ key: "partners", label: "Partners", icon: <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> }] : []),
        ].map(({ key, label, icon }) => (
          <button key={key} className={`tab-inner ${innerTab === key ? "active" : ""}`} onClick={() => setInnerTab(key)}>
            {icon}

              <span style={{ marginLeft: 2, background: "var(--gold)", color: "#fff", borderRadius: 20, fontSize: "0.65rem", fontWeight: 700, padding: "1px 6px" }}>
                {invites.filter(i => i.status === "recorded").length}
              </span>
            )}
          </button>
        ))}
      </div>

      {/* Limit banner — shown across campaigns + testimonials + invites tabs */}
      {innerTab !== "billing" && (() => {

        const monthlyCount = testimonials.filter(t => t.createdAt >= monthStart).length;

        const nearLimit = !atLimit && plan.limit < 9999 && monthlyCount >= Math.max(1, plan.limit - 1);

          <div style={{ background: "#2a1a00", border: "1px solid #a06020", borderRadius: 10, padding: "14px 18px", marginBottom: 20, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16, flexWrap: "wrap" }}>

              <div style={{ fontWeight: 600, color: "#f0a040", marginBottom: 3 }}>You've reached your {plan.name} plan limit</div>

function AuthScreen({ auth }) {
  const [mode, setMode] = useState("login"); // "login" | "signup" | "reset"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [resetSent, setResetSent] = useState(false);
  const [termsAccepted, setTermsAccepted] = useState(false);

  async function handleSubmit() {
    setError(""); setLoading(true);
    try {
      if (mode === "login") await signIn(auth, email, password);
      else if (mode === "signup") await signUp(auth, email, password);
      else {
        await sendPasswordReset(auth, email);
        setResetSent(true);
      }
    } catch (e) {
      setError(friendlyAuthError(e.code));
    }
    setLoading(false);
  }

  function switchMode(m) {
    setMode(m); setError(""); setResetSent(false); setTermsAccepted(false);
  }

  const isReset = mode === "reset";
  const isSignup = mode === "signup";

  return (
    <>
    <div className="auth-page">
      {/* Left panel — brand / testimonial */}
      <div className="auth-panel">
        <div className="auth-panel-bg" />
        <div className="auth-panel-logo">Vouch✦</div>
        <div className="auth-panel-quote">
          <div className="auth-panel-stars">★★★★★</div>
          <div className="auth-panel-q">
            "We went from chasing testimonials to having a consistent stream of polished video proof — in weeks."
          </div>
          <div className="auth-panel-attr">— James R., Founder at Clearpath Agency</div>
        </div>
      </div>

      {/* Right panel — form */}
      <div className="auth-form-side">
        <div className="auth-form-box">
          <div className="auth-title">
            {isReset ? "Reset password" : isSignup ? "Create account" : "Welcome back"}
          </div>
          <div className="auth-sub">
            {isReset
              ? "We'll email you a link to reset your password."
              : isSignup
              ? "Start collecting video testimonials that actually convert."
              : "Sign in to your Vouch dashboard."}
          </div>

          {error && <div className="auth-error">⚠ {error}</div>}
          {resetSent && <div className="auth-success">✓ Reset link sent — check your inbox.</div>}

          <div className="field" style={{ marginBottom: 14 }}>
            <label>Email</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)}
              placeholder="you@company.com"
              onKeyDown={e => e.key === "Enter" && !isReset && handleSubmit()} />
          </div>

          {!isReset && (
            <div className="field" style={{ marginBottom: isSignup ? 20 : 8 }}>
              <label>Password</label>
              <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                placeholder={isSignup ? "Min. 6 characters" : "••••••••"}
                onKeyDown={e => e.key === "Enter" && handleSubmit()} />
            </div>
          )}

          {mode === "login" && (
            <div className="auth-forgot">
              <button onClick={() => switchMode("reset")}>Forgot password?</button>
            </div>
          )}

          {isSignup && (
            <label className="auth-terms">
              <input type="checkbox" checked={termsAccepted} onChange={e => setTermsAccepted(e.target.checked)} />
              I agree to the{" "}<a href="/terms" target="_blank" rel="noopener">Terms of Service</a>{" "}and{" "}<a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>
            </label>
          )}

          <button className="btn btn-primary" style={{ width: "100%", justifyContent: "center", marginBottom: 8 }}
            disabled={loading || (!email) || (!isReset && !password) || (isSignup && !termsAccepted)}
            onClick={handleSubmit}>
            {loading ? "Please wait…" : isReset ? "Send reset link" : isSignup ? "Create account" : "Sign in"}
          </button>

          <div className="auth-switch">
            {isReset ? (
              <><span>Remembered it? </span><button onClick={() => switchMode("login")}>Back to sign in</button></>
            ) : isSignup ? (
              <><span>Already have an account? </span><button onClick={() => switchMode("login")}>Sign in</button></>
            ) : (
              <><span>Don't have an account? </span><button onClick={() => switchMode("signup")}>Sign up free</button></>
            )}
          </div>
        </div>
      </div>
    </div>
    <VouchFooter />
    </>
  );
}

function UserMenu({ user, auth }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const initials = user.email ? user.email[0].toUpperCase() : "?";

  useEffect(() => {
    function handler(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }

    return () => document.removeEventListener("mousedown", handler);

  return (
    <div className="user-menu" ref={ref}>
      <button className="user-btn" onClick={() => setOpen(v => !v)}>

        <span style={{ maxWidth: 140, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>

    </div>
  );
}

function fmtPrice(eurPrice, cur) {
  if (eurPrice === 0) return cur.symbol + "0";
  const raw = eurPrice * cur.rate * (cur.discount || 1);
  return cur.symbol + Math.round(raw);
}

function InAppPricing({ onGetStarted, activeUser }) {
  const [cur, setCur] = useState(CURRENCIES_MAP.EU);
  const [detected, setDetected] = useState(false);
  const [annual, setAnnual] = useState(false);
  const [checkoutLoading, setCheckoutLoading] = useState(null);

  useEffect(() => {
    fetch("https://ipapi.co/json/", { signal: AbortSignal.timeout(4000) })
      .then(r => r.json())
      .then(d => {
        const code = EU_CODES.includes(d.country_code) ? "EU" : d.country_code;
        setCur(CURRENCIES_MAP[code] || CURRENCIES_MAP.EU);
        setDetected(true);
      }).catch(() => setDetected(true));
  }, []);

  useEffect(() => {
    const els = document.querySelectorAll('[data-reveal]');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('revealed'); obs.unobserve(e.target); }
      });
    }, { threshold: 0.12 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);

  async function handlePlanClick(plan) {
    if (plan.monthlyEur === 0 || plan.id === 'enterprise') { onGetStarted(); return; }
    if (!activeUser) { onGetStarted(); return; }
    setCheckoutLoading(plan.id);
    try {
      const resp = await fetch('/api/create-checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          planKey: plan.id,
          billingPeriod: annual ? 'annual' : 'monthly',
          userId: activeUser.uid,
          userEmail: activeUser.email || '',
        }),
      });
      const data = await resp.json();
      if (data.url) {
        window.location.href = data.url;
      } else {
        console.error('[checkout] no URL returned:', data);
        setCheckoutLoading(null);
      }
    } catch (err) {
      console.error('[checkout] error:', err);
      setCheckoutLoading(null);
    }
  }

  return (

        <button className="btn btn-outline btn-sm" onClick={onGetStarted}>Sign in</button>
      </nav>

      {/* Hero */}
      <div style={{ textAlign: "center", padding: "64px 24px 48px" }}>
        <div style={{ fontFamily: "Instrument Serif, serif", fontSize: "clamp(2.2rem, 6vw, 3.6rem)", lineHeight: 1.1, marginBottom: 14, letterSpacing: "-0.02em" }}>
          The trust platform for<br /><em style={{ color: "var(--gold)", fontStyle: "italic" }}>modern businesses</em>
        </div>
        <div style={{ color: "var(--muted)", fontSize: "1.05rem", maxWidth: 420, margin: "0 auto 32px", lineHeight: 1.6 }}>
          Record today. Polished video ready today.
        </div>

        {/* Monthly / Annual toggle */}

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 12 }}>

      <div className="hiw-section">

              Your client clicks the link and answers the questions on camera from any device. The guided prompts make it natural and easy — no script, no awkward silences.
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 4 }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--gold)", display: "inline-block", flexShrink: 0 }} />
              <span style={{ fontSize: "0.82rem", color: "var(--muted)" }}>Works on any phone, tablet or laptop</span>

}

function App() {
  const { user, auth, storage, db, loading } = useAuth();
  const [demoMode, setDemoMode] = useState(false);
  const [view, setView] = useState("pricing"); // start on pricing
  const [previewCampaign, setPreviewCampaign] = useState(null);
  const [upgradedBanner, setUpgradedBanner] = useState(false);

  // Redirect to dashboard when returning from Stripe Checkout success URL
  const _upgradedParam = typeof window !== 'undefined' && new URLSearchParams(window.location.search).get('upgraded') === 'true';
  useEffect(() => {
    if (user && _upgradedParam) {
      setView("dashboard");
      setUpgradedBanner(true);
      window.history.replaceState({}, '', '/');
    }
  }, [user]);

  // Save referredBy to new user's Firestore doc if a vouchRef is in localStorage
  useEffect(() => {
    if (!user || !db || user.isAnonymous) return;
    const ref = localStorage.getItem('vouchRef');
    if (!ref || ref === user.uid) return;
    db.collection("users").doc(user.uid).get().then(snap => {
      if (!snap.exists || !snap.data()?.referredBy) {
        db.collection("users").doc(user.uid).set({ referredBy: ref }, { merge: true });
      }
      localStorage.removeItem('vouchRef');
    }).catch(e => console.error("[vouch] referral save failed:", e.message));
  }, [user, db]);

  // Public recording route — must be declared before any conditional returns
  const recordCampaignId = window.location.pathname.match(/^\/record\/([^/]+)/)?.[1] || null;
  const [recordCampaign, setRecordCampaign] = useState(undefined); // undefined = loading, null = not found
  const [anonAuthReady, setAnonAuthReady] = useState(false);

  // Step 1: Sign in anonymously so Firestore security rules (request.auth != null) are satisfied
  // for the public recording page. Must complete before campaign fetch.
  useEffect(() => {
    if (!recordCampaignId || !auth) return;
    const currentUser = auth.currentUser;
    if (currentUser) {
      console.log("[vouch/record] auth: already signed in as", currentUser.uid, "(anon:", currentUser.isAnonymous, ")");
      setAnonAuthReady(true);
      return;
    }
    console.log("[vouch/record] signing in anonymously…");
    auth.signInAnonymously()
      .then(cred => console.log("[vouch/record] ✅ anonymous auth success, uid:", cred.user.uid))
      .catch(e => console.warn("[vouch/record] ❌ anonymous auth failed:", e.code, e.message))
      .finally(() => setAnonAuthReady(true));
  }, [recordCampaignId, auth]);

  // Step 2: Load campaign only after auth is settled (anonymous or real user token is in place)
  useEffect(() => {
    if (!recordCampaignId || !db || !anonAuthReady) return;
    const ownerParam = new URLSearchParams(window.location.search).get("owner");
    console.log("[vouch/record] loading campaign:", recordCampaignId, "| ?owner=", ownerParam);

    function loadViaCollectionGroup() {
      console.log("[vouch/record] trying collectionGroup query on campaigns.id ==", recordCampaignId);
      return db.collectionGroup("campaigns")
        .where("id", "==", recordCampaignId)
        .limit(1)
        .get()
        .then(snap => {
          console.log("[vouch/record] collectionGroup result — empty:", snap.empty);
          if (snap.empty) { setRecordCampaign(null); return; }
          const doc = snap.docs[0];
          const data = doc.data();
          const pathOwnerId = doc.ref.parent?.parent?.id;
          const resolved = { ...data, ownerId: data.ownerId || pathOwnerId || null };
          console.log("[vouch/record] ✅ campaign loaded via collectionGroup:", resolved.id, "| ownerId:", resolved.ownerId, "| prompts:", resolved.prompts?.length);
          setRecordCampaign(resolved);
        });
    }

    if (ownerParam) {
      console.log("[vouch/record] trying direct path: users/" + ownerParam + "/campaigns/" + recordCampaignId);
      db.collection("users").doc(ownerParam).collection("campaigns").doc(recordCampaignId)
        .get()
        .then(doc => {
          console.log("[vouch/record] direct path result — exists:", doc.exists);
          if (doc.exists) {
            const resolved = { ...doc.data(), ownerId: ownerParam };
            console.log("[vouch/record] ✅ campaign loaded via direct path | prompts:", resolved.prompts?.length);
            setRecordCampaign(resolved);
          } else {
            console.log("[vouch/record] direct path missed — falling back to collectionGroup");
            return loadViaCollectionGroup();
          }
        })
        .catch(e => {
          console.warn("[vouch/record] direct path error:", e.code, e.message, "— falling back to collectionGroup");
          return loadViaCollectionGroup().catch(e2 => {
            console.error("[vouch/record] ❌ collectionGroup fallback also failed:", e2.code, e2.message);
            setRecordCampaign(null);
          });
        });
    } else {
      loadViaCollectionGroup().catch(e => {
        console.error("[vouch/record] ❌ collectionGroup failed:", e.code, e.message);
        setRecordCampaign(null);
      });
    }
  }, [recordCampaignId, db, anonAuthReady]);

  if (recordCampaignId) {
    if (recordCampaign === undefined) {
      return (
        <>
          <style>{style}</style>
          <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#0a0a0a" }}>
            <div className="ai-spinner" style={{ borderTopColor: "#c8a96e", borderColor: "#333" }} />
          </div>
        </>
      );
    }
    if (recordCampaign === null) {
      return (
        <>
          <style>{style}</style>
          <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", background: "#0a0a0a", color: "#fff", padding: "40px 20px", textAlign: "center" }}>
            <div style={{ fontSize: "2.5rem", marginBottom: 16 }}>🔗</div>
            <div style={{ fontFamily: "Instrument Serif, serif", fontSize: "1.6rem", marginBottom: 12 }}>Link not found</div>
            <div style={{ color: "#666", fontSize: "0.95rem", maxWidth: 380, lineHeight: 1.6 }}>
              This recording link may be invalid or expired. Please contact the sender to get a new link.
            </div>
          </div>
        </>
      );
    }
    return (
      <>
        <style>{style}</style>
        <ClientPage campaign={recordCampaign} onBack={null} storage={storage} userId={null} db={db} />
      </>
    );
  }

  const activeUser = demoMode ? DEMO_USER : user;

  function handlePreview(campaign) {
    setPreviewCampaign(campaign);
    setView("client");
  }

  // Loading state
  if (loading && !demoMode) {
    return (
      <>
        <style>{style}</style>
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "var(--paper)" }}>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontFamily: "Instrument Serif, serif", fontSize: "1.8rem", color: "var(--gold)", fontStyle: "italic", marginBottom: 24 }}>Vouch✦</div>
            <div className="ai-spinner" style={{ margin: "0 auto 24px", borderTopColor: "#c8a96e", borderColor: "#ddd8cc" }} />
            <div style={{ color: "var(--muted)", fontSize: "0.85rem", marginBottom: 20 }}>Connecting…</div>
            <button className="btn btn-gold" onClick={() => setDemoMode(true)}>Try Demo Instead →</button>
          </div>
        </div>
      </>
    );
  }

  // Pricing page (unauthenticated landing)
  if (!activeUser && view === "pricing") {
    return (
      <>
        <style>{style}</style>
        <InAppPricing onGetStarted={() => setView("auth")} activeUser={null} />
        <div style={{ position: "fixed", bottom: 20, right: 20, zIndex: 50 }}>
          <button className="btn btn-gold btn-sm" onClick={() => setDemoMode(true)}>✦ Try Demo</button>
        </div>
      </>
    );
  }

  // Auth screen
  if (!activeUser) {
    return (
      <>
        <style>{style}</style>
        <div style={{ position: "relative" }}>
          <AuthScreen auth={auth} />
          <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", zIndex: 50, display: "flex", gap: 10 }}>
            <button className="btn btn-outline" style={{ background: "var(--paper)", fontSize: "0.82rem" }} onClick={() => setView("pricing")}>← Pricing</button>
            <button className="btn btn-outline" style={{ background: "var(--paper)", fontSize: "0.82rem" }} onClick={() => setDemoMode(true)}>✦ Skip — try demo</button>
          </div>
        </div>
      </>
    );
  }

  // Signed in — show app
  return (
    <>
      <style>{style}</style>
      <div className="app">
        {view === "pricing" ? (
          <>
            <div style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 100, background: "var(--paper)", borderBottom: "1px solid var(--border)", padding: "12px 20px" }}>
              <button className="btn btn-outline btn-sm" onClick={() => setView("dashboard")}>← Back to Dashboard</button>
            </div>
            <div style={{ paddingTop: 56 }}>
              <InAppPricing onGetStarted={() => setView("dashboard")} activeUser={demoMode ? null : activeUser} />
            </div>
          </>
        ) : view === "client" ? (
          <ClientPage campaign={previewCampaign || DEMO_CAMPAIGN} onBack={() => { setView("dashboard"); setPreviewCampaign(null); }} storage={storage} userId={activeUser.uid} db={db} />
        ) : (
          <>
            <nav className="nav">
              <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
                <button className="nav-logo serif" style={{ background: "none", border: "none", cursor: "pointer", padding: 0 }} onClick={() => setView("dashboard")}>Vouch<span>✦</span></button>
                <div className="nav-tabs">
                  <button className={`nav-tab ${view === "dashboard" ? "active" : ""}`} onClick={() => setView("dashboard")}>Dashboard</button>
                  <button className="nav-tab" onClick={() => handlePreview(null)}>Client View</button>
                </div>
              </div>
              {demoMode ? (
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: "0.75rem", color: "var(--muted)", background: "var(--cream)", padding: "4px 10px", borderRadius: 20 }}>Demo mode</span>
                  <button className="btn btn-outline btn-sm" onClick={() => { setDemoMode(false); setView("auth"); }}>Sign in</button>
                </div>
              ) : (
                <UserMenu user={activeUser} auth={auth} />
              )}
            </nav>
            {upgradedBanner && (
              <div style={{ margin: "16px 20px 0", padding: "13px 18px", background: "#f0fdf4", border: "1px solid #86efac", borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
                <span style={{ color: "#166534", fontSize: "0.9rem", fontWeight: 500 }}>✓ Plan upgraded successfully — your new features are now active.</span>
                <button onClick={() => setUpgradedBanner(false)} style={{ background: "none", border: "none", cursor: "pointer", color: "#166534", fontSize: "1.2rem", lineHeight: 1, flexShrink: 0, padding: 0 }}>×</button>
              </div>
            )}
            <Dashboard onPreview={handlePreview} userId={activeUser.uid} userEmail={activeUser.email} db={db} storage={storage} onUpgrade={() => setView("pricing")} />
            <VouchFooter />
          </>
        )}
      </div>
    </>
  );
}

// ── Cookie consent banner ─────────────────────────────────────────────────────
function CookieBanner() {
  const COOKIE_KEY = "vouch_cookie_consent";
  const [visible, setVisible] = useState(() => {
    try { return !localStorage.getItem(COOKIE_KEY); } catch { return false; }
  });

  function accept() {
    try { localStorage.setItem(COOKIE_KEY, "accepted"); } catch {}
    setVisible(false);
  }
  function decline() {
    try { localStorage.setItem(COOKIE_KEY, "declined"); } catch {}
    setVisible(false);
  }

  if (!visible) return null;

  return (
    <div style={{
      position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 9000,
      background: "#111", borderTop: "1px solid #2a2a2a",
      padding: "16px 24px", display: "flex", alignItems: "center",
      justifyContent: "space-between", gap: 16, flexWrap: "wrap",
      boxShadow: "0 -8px 32px rgba(0,0,0,0.5)",
    }}>
      <p style={{ margin: 0, fontSize: "0.83rem", color: "#aaa", lineHeight: 1.5, flex: 1, minWidth: 220 }}>
        We use essential cookies to keep you signed in.{" "}
        <a href="/privacy" style={{ color: "#c8a96e", textDecoration: "none" }}>Privacy Policy</a>
        {" · "}
        <a href="/gdpr" style={{ color: "#c8a96e", textDecoration: "none" }}>GDPR</a>
      </p>
      <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
        <button onClick={decline} style={{
          background: "transparent", border: "1px solid #333", color: "#666",
          borderRadius: 8, padding: "7px 16px", fontSize: "0.82rem", cursor: "pointer",
        }}>
          Decline
        </button>
        <button onClick={accept} style={{
          background: "#c8a96e", border: "none", color: "#fff",
          borderRadius: 8, padding: "7px 16px", fontSize: "0.82rem",
          fontWeight: 600, cursor: "pointer",
        }}>
          Accept
        </button>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <>
        {React.createElement(App)}
        {React.createElement(CookieBanner)}
      </>
    );
  </script>
</body>
