// ── Lazy Firebase loader ──────────────────────────────────────────────────────
// Loads Firebase from CDN so no bundler/npm needed in this artifact context.
let _auth = null;
let _storage = null;
let _db = null;
let _fbReady = false;
let _fbCallbacks = [];

function onFirebaseReady(cb) {
  if (_fbReady) { cb(_auth, _storage, _db); return; }
  _fbCallbacks.push(cb);
}

function initFirebase() {
  if (typeof window.__firebaseLoading !== "undefined") return;
  window.__firebaseLoading = true;

  function load(src) {
    return new Promise(res => {
      const s = document.createElement("script");
      s.src = src; s.onload = res;
      document.head.appendChild(s);
    });
  }

  Promise.all([
    load("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"),
    load("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"),
    load("https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"),
    load("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"),
  ]).then(() => {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    _auth = firebase.auth();
    _storage = firebase.storage();
    _db = firebase.firestore();
    window._firebaseAuth = _auth; // exposed for diagnostic logging only
    _fbReady = true;
    _fbCallbacks.forEach(cb => cb(_auth, _storage, _db));
    _fbCallbacks = [];
  });
}

// ── Auth helpers ──────────────────────────────────────────────────────────────
function useAuth() {
  const [user, setUser] = useState(undefined); // undefined = loading
  const [auth, setAuth] = useState(null);
  const [storage, setStorage] = useState(null);
  const [db, setDb] = useState(null);

  useEffect(() => {
    initFirebase();
    onFirebaseReady((a, s, d) => {
      setAuth(a);
      setStorage(s);
      setDb(d);
      a.onAuthStateChanged(u => setUser(u || null));
    });
  }, []);

  return { user, auth, storage, db, loading: user === undefined };
}

function isIOSDevice() {
  return /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

// Returns true if the URL points to a .webm file
// Firebase Storage URLs encode the path, so we decode before checking.
function isWebmUrl(url) {
  if (!url) return false;
  try { return decodeURIComponent(url).includes(".webm"); } catch { return url.includes(".webm"); }
}

// Pick the best recording MIME type the current browser supports.
// Returns { mimeType, ext } — mimeType may be "" (browser default).
function pickRecordingFormat() {
  const candidates = [
    { mime: "video/mp4;codecs=avc1", ext: "mp4" },
    { mime: "video/mp4",             ext: "mp4" },
    { mime: "video/webm;codecs=vp9", ext: "webm" },
    { mime: "video/webm",            ext: "webm" },
  ];
  for (const c of candidates) {
    if (MediaRecorder.isTypeSupported(c.mime)) {
      console.log("[vouch/record] selected format:", c.mime);
      return c;
    }
  }
  console.log("[vouch/record] no preferred format supported — using browser default");
  return { mime: "", ext: "webm" }; // fallback; actual type set from mr.mimeType at stop
}

// ── Firebase Storage — upload video blobs ────────────────────────────────────
// videoBlobs: { [promptIndex]: Blob }
// onProgress: (promptIndex, pct) => void
// Returns: { [promptIndex]: downloadURL }
async function uploadVideos({ storage, userId, campaignId, videoBlobs, onProgress }) {
  if (!storage) throw new Error("Firebase Storage not initialised");
  const timestamp = Date.now();
  const entries = Object.entries(videoBlobs);

  const urls = {};
  await Promise.all(
    entries.map(([idx, blob]) =>
      new Promise((resolve, reject) => {
        // Derive content type and extension from the blob itself so iOS mp4
        // recordings are stored as .mp4, not .webm
        const mime = blob.type || "video/webm";
        const ext  = mime.includes("mp4") ? "mp4" : "webm";
        const path = `testimonials/${userId}/${campaignId}/${timestamp}/q${idx}.${ext}`;
        const ref  = storage.ref(path);
        const task = ref.put(blob, { contentType: mime });

        console.log("[vouch/upload] uploading q" + idx, "| mime:", mime, "| ext:", ext, "| path:", path);

        task.on(
          "state_changed",
          snap => {
            const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
            onProgress(Number(idx), pct);
          },
          reject,
          async () => {
            urls[idx] = await task.snapshot.ref.getDownloadURL();
            resolve();
          }
        );
      })
    )
  );
  return urls;
}

  .btn-outline:hover { border-color: var(--ink); }
  .btn-sm { padding: 7px 14px; font-size: 0.82rem; }
  .btn-rust { background: var(--rust); color: #fff; }

  .prompts-box {
    background: var(--cream); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px 24px; margin-top: 16px;
  }
  .prompt-item {
    display: flex; align-items: flex-start; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .prompt-item:last-child { border-bottom: none; }
  .prompt-num {
    width: 24px; height: 24px; border-radius: 50%; background: var(--gold);
    color: #fff; font-size: 0.75rem; font-weight: 700; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
  }
  .prompt-text { font-size: 0.9rem; line-height: 1.5; flex: 1; }
  .prompt-text input {
    width: 100%; border: none; background: transparent; font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem; color: var(--ink); outline: none; padding: 0;
  }

  .link-box {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    background: var(--cream); border: 1px solid var(--border); border-radius: 10px;
    margin-top: 16px;
  }
  .link-url { font-size: 0.85rem; color: var(--muted); flex: 1; font-family: monospace; }
  
  /* Testimonials list */
  .testimonials-grid { display: grid; gap: 16px; }
  .testimonial-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 24px 28px; display: grid; grid-template-columns: 1fr auto; gap: 16px;
    align-items: start;
  }
  .t-name { font-weight: 600; margin-bottom: 4px; }
  .t-company { color: var(--muted); font-size: 0.82rem; margin-bottom: 12px; }
  .t-quote { font-family: 'Instrument Serif', serif; font-size: 1.05rem; font-style: italic; line-height: 1.5; color: #333; }
  .t-stars { color: var(--gold); font-size: 1rem; margin-bottom: 8px; }
  .badge {
    padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .badge-new { background: #e8f4e8; color: var(--sage); }
  .badge-approved { background: #e8f0e8; color: #3a5a3a; }
  .badge-pending { background: #f4ede8; color: var(--rust); }
  .badge-processing { background: #1a1a2e; color: #7eb8f7; border: 1px solid #3a5a8a; }
  .badge-processed  { background: #1a2e1a; color: #6dbf8a; border: 1px solid #3a6a3a; }
  .badge-failed     { background: #2e1a1a; color: #e07a7a; border: 1px solid #6a3a3a; }

  .loading-dots::after {
    content: ''; animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ── Client Recording Page ── */
  .client-page {
    min-height: 100vh; background: var(--ink); color: #fff;
    display: flex; flex-direction: column; align-items: center;
    padding: 60px 24px;
  }
  .client-logo { font-family: 'Instrument Serif', serif; font-size: 1.3rem; color: var(--gold); margin-bottom: 48px; font-style: italic; }
  .client-card {
    background: #1a1a1a; border: 1px solid #333; border-radius: 20px;
    padding: 40px; max-width: 640px; width: 100%;
  }
  .client-step { color: var(--gold); font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
  .client-title { font-family: 'Instrument Serif', serif; font-size: 2rem; line-height: 1.2; margin-bottom: 8px; }
  .client-sub { color: #888; font-size: 0.9rem; margin-bottom: 32px; line-height: 1.6; }

  .prompt-card {
    background: #111; border: 1px solid #2a2a2a; border-radius: 12px;
    padding: 20px 24px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: flex-start; gap: 14px;
  }
  .prompt-card:hover { border-color: var(--gold); }
  .prompt-card.selected { border-color: var(--gold); background: #1c1810; }
  .prompt-q { font-size: 0.95rem; line-height: 1.5; }

  .video-area {
    background: #111; border: 1px solid #2a2a2a; border-radius: 14px;
    aspect-ratio: 16/9; width: 100%; display: flex; align-items: center;
    justify-content: center; overflow: hidden; position: relative; margin-bottom: 20px;
  }
  .video-area video { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; }
  .video-placeholder { text-align: center; color: #555; }
  .video-icon { font-size: 2.5rem; margin-bottom: 8px; }
  .video-hint { font-size: 0.85rem; }

  .rec-controls { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; }
  .rec-btn {
    width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
    font-size: 1.3rem; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .rec-btn-record { background: var(--rust); color: #fff; }
  .rec-btn-record:hover { transform: scale(1.08); }
  .rec-btn-stop { background: #444; color: #fff; }
  .rec-btn-stop:hover { background: #555; }
  .rec-indicator { display: flex; align-items: center; gap: 8px; color: var(--rust); font-size: 0.82rem; font-weight: 600; }
  .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rust); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  .text-response-area {
    background: #111; border: 1px solid #2a2a2a; border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .text-response-area textarea {
    width: 100%; background: transparent; border: none; outline: none;
    color: #fff; font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
    line-height: 1.6; resize: none; min-height: 120px;
  }
  .text-response-area textarea::placeholder { color: #444; }

  .stars-row { display: flex; gap: 8px; margin-bottom: 24px; justify-content: center; }
  .star-btn { font-size: 1.8rem; cursor: pointer; transition: transform 0.1s, color 0.1s; background: none; border: none; color: rgba(255,255,255,0.3); }
  .star-btn.filled { color: #c8a96e; }
  .star-btn:hover { transform: scale(1.2); }

  @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .success-celebrate { font-size: 3.5rem; margin-bottom: 20px; display: inline-block; animation: pop 0.45s cubic-bezier(0.175,0.885,0.32,1.275) both; }
  .success-title { font-family: 'Instrument Serif', serif; font-size: 1.9rem; margin-bottom: 10px; color: #f0ece4; }
  .success-sub { color: #888; font-size: 0.92rem; margin-bottom: 28px; }
  .success-quote-card { background: #0e0e0e; border: 1px solid #2a2a2a; border-left: 3px solid #c8a96e; border-radius: 12px; padding: 20px 22px; text-align: left; margin-bottom: 32px; }
  .success-quote-label { color: #c8a96e; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
  .success-quote-text { font-family: 'Instrument Serif', serif; font-size: 1.08rem; font-style: italic; color: #ddd; line-height: 1.65; }
  .success-step { display: flex; align-items: flex-start; gap: 14px; padding: 12px 0; border-bottom: 1px solid #1c1c1c; text-align: left; }
  .success-step:last-child { border-bottom: none; }
  .success-step-icon { font-size: 1.15rem; flex-shrink: 0; margin-top: 1px; }
  .success-step-label { font-size: 0.87rem; font-weight: 600; color: #e0dbd0; margin-bottom: 2px; }
  .success-step-desc { font-size: 0.8rem; color: #666; line-height: 1.45; }
  .success-divider { height: 1px; background: #1c1c1c; margin: 28px 0; }
  .success-conversion { background: linear-gradient(135deg, #1a1610 0%, #130f0a 100%); border: 1px solid rgba(200,169,110,0.25); border-radius: 16px; padding: 32px 24px; text-align: center; margin-bottom: 20px; }
  .success-conversion-heading { font-family: 'Instrument Serif', serif; font-size: 1.5rem; color: #f0ece4; margin-bottom: 10px; line-height: 1.3; }
  .success-conversion-sub { font-size: 0.88rem; color: #888; margin-bottom: 24px; line-height: 1.6; }
  .success-cta-btn { display: inline-block; background: #c8a96e; color: #0e0e0e; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 700; padding: 14px 28px; border-radius: 10px; text-decoration: none; margin-bottom: 14px; transition: opacity 0.15s; }
  .success-cta-btn:hover { opacity: 0.88; }
  .success-cta-microcopy { font-size: 0.75rem; color: #555; }
  .success-footer { font-size: 0.78rem; color: #444; text-align: center; margin-top: 20px; }
  .success-footer a { color: #c8a96e; text-decoration: none; }

  .step-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 32px; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; background: #333; transition: background 0.2s; }
  .step-dot.active { background: var(--gold); }

  /* ── Per-question recording screen ── */
  .q-progress-wrap { margin-bottom: 28px; }
  .q-progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .q-progress-label { color: var(--gold); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
  .q-progress-frac { color: #555; font-size: 0.75rem; font-weight: 600; }
  .q-progress-track { width: 100%; height: 3px; background: #2a2a2a; border-radius: 99px; overflow: hidden; }
  .q-progress-fill { height: 100%; background: var(--gold); border-radius: 99px; transition: width 0.4s cubic-bezier(0.16,1,0.3,1); }

  .q-text {
    font-family: 'Instrument Serif', serif; font-size: 1.55rem; line-height: 1.3;
    margin-bottom: 10px; color: #fff;
  }
  .q-micro {
    color: #666; font-size: 0.84rem; line-height: 1.5; margin-bottom: 24px;
    display: flex; align-items: center; gap: 8px;
  }
  .q-micro.success { color: #5cb87a; }
  .q-micro.retry   { color: #c8a96e; }

  /* Question text overlay on live video */
  .q-video-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    padding: 32px 20px 16px;
    border-radius: 0 0 14px 14px;
    pointer-events: none;
  }
  .q-video-overlay-text {
    color: #fff; font-size: 0.88rem; line-height: 1.45; font-weight: 500;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }

  /* Big record button with pulse ring */
  .rec-ring-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    margin-bottom: 8px;
  }
  .rec-btn-big {
    width: 68px; height: 68px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--rust); color: #fff; font-size: 1.4rem;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s; position: relative;
  }
  .rec-btn-big:hover { transform: scale(1.06); }
  .rec-btn-big::before {
    content: ''; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid rgba(184,92,56,0.35); animation: recPulse 1.8s ease-out infinite;
  }
  @keyframes recPulse {
    0%   { transform: scale(1);   opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  .rec-btn-big-label { color: #666; font-size: 0.78rem; letter-spacing: 0.04em; }

  /* Live recording controls */
  .rec-live-row {
    display: flex; align-items: center; justify-content: space-between;
    background: #111; border-radius: 10px; padding: 10px 16px; margin-bottom: 8px;
  }

  /* Review action buttons */
  .q-review-actions {
    display: flex; gap: 10px; margin-bottom: 16px;
  }
  .q-review-actions .btn { flex: 1; justify-content: center; font-size: 0.88rem; }

  /* Countdown overlay */
  .q-countdown-overlay {
    position: absolute; inset: 0; border-radius: 14px;
    background: rgba(0,0,0,0.72); display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10;
  }
  .q-countdown-num {
    font-family: 'Instrument Serif', serif; font-size: 7rem; color: #fff;
    line-height: 1; animation: countPop 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .q-countdown-label { color: rgba(255,255,255,0.55); font-size: 0.82rem; margin-top: 8px; letter-spacing: 0.08em; }
  @keyframes countPop {
    0%   { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1);   opacity: 1; }
  }

  /* Talking point hints */
  .q-hints { margin: 0 0 20px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .q-hint {
    display: flex; align-items: flex-start; gap: 8px;
    color: #666; font-size: 0.82rem; line-height: 1.45;
  }
  .q-hint-bullet { color: var(--gold); flex-shrink: 0; margin-top: 1px; }
  .q-hints-skeleton {
    display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px;
  }
  .q-hints-skeleton-line {
    height: 10px; background: #1e1e1e; border-radius: 99px;
    animation: shimmer 1.4s ease-in-out infinite alternate;
  }
  @keyframes shimmer { from { opacity: 0.4; } to { opacity: 0.9; } }

  /* Text fallback divider */
  .q-or-divider {
    text-align: center; color: #3a3a3a; font-size: 0.78rem;
    margin: 16px 0; position: relative;
  }
  .q-or-divider::before, .q-or-divider::after {
    content: ''; position: absolute; top: 50%; width: 40%; height: 1px;
    background: #2a2a2a;
  }
  .q-or-divider::before { left: 0; }
  .q-or-divider::after  { right: 0; }

  /* Time estimate badge */
  .time-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 99px;
    padding: 4px 12px; font-size: 0.75rem; color: #888;
    margin-bottom: 20px;
  }

  /* Recording timer */
  .rec-timer {
    font-variant-numeric: tabular-nums; font-size: 0.95rem;
    font-weight: 700; color: #fff; letter-spacing: 0.03em;
  }
  .rec-timer.warn { color: #e09b5c; }
  .rec-aim { color: #555; font-size: 0.75rem; text-align: center; margin-top: 6px; }

  /* Resume banner */
  .resume-banner {
    background: #0f1a0f; border: 1px solid #2a4a2a; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 20px; display: flex;
    align-items: center; justify-content: space-between; gap: 12px;
  }
  .resume-banner-text { font-size: 0.85rem; color: #8fcf8f; line-height: 1.4; }
  .resume-banner-text strong { display: block; color: #a8e0a8; margin-bottom: 2px; }
  .resume-banner-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .success-steps-label { font-size: 0.72rem; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; text-align: left; }

  /* Camera test checklist */
  .cam-checklist { display: flex; flex-direction: column; gap: 10px; }
  .cam-check-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 10px; cursor: pointer;
    border: 1.5px solid #2a2a2a; background: #0d0d0d;
    transition: border-color 0.18s, background 0.18s;
    user-select: none;
  }
  .cam-check-item.checked { border-color: #c8a96e55; background: #1a1508; }
  .cam-check-item input[type="checkbox"] { display: none; }
  .cam-check-box {
    width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #3a3a3a;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; color: #c8a96e; font-weight: 700; flex-shrink: 0;
    background: transparent; transition: border-color 0.18s, background 0.18s;
  }
  .cam-check-item.checked .cam-check-box { background: #c8a96e22; border-color: #c8a96e; }
  .cam-check-label { font-size: 0.88rem; color: #aaa; transition: color 0.18s; }
  .cam-check-item.checked .cam-check-label { color: #ddd; }

  /* AI loading */
  .ai-generating {
    display: flex; align-items: center; gap: 10px; color: var(--gold);
    font-size: 0.88rem; padding: 16px 0;
  }
  .ai-spinner {
    width: 16px; height: 16px; border: 2px solid #333; border-top-color: var(--gold);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
  .empty-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; color: var(--ink); }

  .tabs-inner { display: flex; gap: 4px; margin-bottom: 24px; }
  .tab-inner {
    padding: 7px 14px; border-radius: 8px; border: 1px solid transparent; background: transparent;
    font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500;
    color: #6B6259; cursor: pointer; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tab-inner.active { background: #fff; color: #1A1612; font-weight: 600; border-color: rgba(26,22,18,0.08); }

  /* ── Invite Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(14,14,14,0.55); backdrop-filter: blur(4px);
    z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 40px; max-width: 520px; width: 100%; box-shadow: var(--shadow-lg);
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn { from { opacity:0; transform: translateY(12px) scale(0.97); } to { opacity:1; transform: none; } }
  .modal-title { font-family: 'Instrument Serif', serif; font-size: 1.7rem; margin-bottom: 6px; }
  .modal-sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 28px; line-height: 1.5; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 28px; }

  /* Email preview */
  .email-preview {
    border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden;
    margin-top: 20px; font-size: 0.85rem;
  }
  .email-preview-header {
    background: var(--cream); padding: 12px 18px; border-bottom: 1px solid var(--border);
    color: var(--muted); font-size: 0.78rem; display: flex; gap: 16px;
  }
  .email-preview-body { padding: 20px 24px; background: #fff; }

  .send-status {
    display: flex; align-items: center; gap: 10px; padding: 14px 18px;
    border-radius: 10px; font-size: 0.88rem; font-weight: 500; margin-top: 16px;
  }
  .send-status.success { background: #e8f4e8; color: var(--sage); }
  .send-status.error { background: #f4e8e8; color: var(--rust); }

  /* Invites list on campaign card */
  .invites-chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
    background: var(--cream); border-radius: 20px; font-size: 0.75rem; color: var(--muted);
    margin-right: 6px; margin-top: 6px;
  }

  /* ── Auth Screen ── */
  .auth-page {
    min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr;
    background: var(--paper);
  }
  @media (max-width: 800px) { .auth-page { grid-template-columns: 1fr; } .auth-panel { display: none; } }

  .auth-panel {
    background: var(--ink); display: flex; flex-direction: column;
    justify-content: space-between; padding: 48px 52px; overflow: hidden; position: relative;
  }
  .auth-panel-bg {
    position: absolute; inset: 0; opacity: 0.07;
    background: repeating-linear-gradient(45deg, var(--gold) 0, var(--gold) 1px, transparent 0, transparent 50%);
    background-size: 24px 24px;
  }
  .auth-panel-logo { font-family: 'Instrument Serif', serif; font-size: 1.6rem; color: var(--gold); font-style: italic; position: relative; }
  .auth-panel-quote { position: relative; }
  .auth-panel-q { font-family: 'Instrument Serif', serif; font-size: 1.9rem; color: #fff; line-height: 1.3; margin-bottom: 20px; }
  .auth-panel-attr { color: #666; font-size: 0.85rem; }
  .auth-panel-stars { color: var(--gold); font-size: 1rem; margin-bottom: 8px; }

  .auth-form-side {
    display: flex; align-items: center; justify-content: center; padding: 48px 40px;
  }
  .auth-form-box { width: 100%; max-width: 400px; }
  .auth-title { font-family: 'Instrument Serif', serif; font-size: 2.2rem; margin-bottom: 6px; line-height: 1.1; }
  .auth-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 32px; }
  .auth-divider { text-align: center; color: var(--muted); font-size: 0.8rem; margin: 20px 0; position: relative; }
  .auth-divider::before, .auth-divider::after {
    content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border);
  }
  .auth-divider::before { left: 0; } .auth-divider::after { right: 0; }
  .auth-switch { text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--muted); }
  .auth-switch button { background: none; border: none; color: var(--gold); font-weight: 600; cursor: pointer; font-size: 0.88rem; }
  .auth-switch button:hover { text-decoration: underline; }

// ── AI helpers ────────────────────────────────────────────────────────────────
async function callClaude(action, params) {
  const res = await fetch("/api/claude", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, ...params }),
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error || "AI request failed");
  }
  const { text } = await res.json();
  return text;
}

async function generatePrompts(businessName, industry, context) {
  const res = await fetch("/api/generate-prompts", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ businessName, industry, context }),
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error || "Failed to generate prompts");
  }
  const { prompts } = await res.json();
  return prompts;
}

async function analyzeTestimonial(answers, prompts) {
  return await callClaude("analyzeTestimonial", { answers, prompts });
}

async function sendInviteEmail({ toEmail, clientName, campaign, inviteId, ownerEmail }) {

    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ toEmail, clientName, campaign, inviteId, ownerEmail }),
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error || "Failed to send email");
  }
  return res.json();
}

    console.log("[vouch/invite] InviteModal mounted — userId:", userId, "| db:", !!db,
      "| campaign.id:", campaign?.id, "| campaign.ownerId:", campaign?.ownerId,
      "| inviteId (pre-generated):", inviteId);
    if (!userId) console.warn("[vouch/invite] ⚠ userId is null/undefined — Firestore write will be skipped!");
  }, []);

  async function handleSend() {
    if (!clientName || !toEmail) return;
    setStatus("sending");
    const now = Date.now();

    console.group("[vouch/invite] handleSend");
    console.log("inviteId        :", inviteId);
    console.log("userId          :", userId, " | db:", !!db);
    console.log("campaign.id     :", campaign?.id, "| campaign.ownerId:", campaign?.ownerId);
    console.log("recordingLink   :", recordingLink);
    console.log("Firestore path  :", `users/${userId}/invites/${inviteId}`);
    console.groupEnd();

    // 1. Write invite to Firestore FIRST — this is the source of truth for the pipeline.
    //    If email delivery fails the record still exists and the owner can resend.
    if (db && userId) {
      const inviteDoc = {
        id: inviteId,
        clientName,
        clientEmail: toEmail,
        toEmail,
        campaignId: campaign.id,
        campaignName: campaign.name || "",
        companyName: campaign.companyName || "",
        ownerId: userId,
        status: "invited",
        sentAt: now,
        invitedAt: now,
        openedAt: null,
        recordedAt: null,
        approvedAt: null,
        deliveredAt: null,
        planValue: 497,
      };
      try {
        await db.collection("users").doc(userId).collection("invites").doc(inviteId).set(inviteDoc);
        console.log("[vouch/invite] ✅ Firestore write SUCCESS → users/" + userId + "/invites/" + inviteId);
      } catch (e) {
        console.error("[vouch/invite] ❌ Firestore write FAILED:", e.code, e.message);
        setErrorMsg("Failed to save invite: " + e.message);
        setStatus("error");
        return;
      }
    } else {
      console.warn("[vouch/invite] ⚠ Firestore write SKIPPED — db:", !!db, "| userId:", userId);
    }

    // 2. Send the email (includes ?inviteId=...&owner=... in the recording link)
    console.log("[vouch/invite] sending email to", toEmail, "with inviteId:", inviteId);
    try {
      await sendInviteEmail({ toEmail, clientName, campaign, inviteId, ownerEmail });
      console.log("[vouch/invite] ✅ email sent");
      setStatus("success");
    } catch (e) {
      console.warn("[vouch/invite] ⚠ email failed (invite already saved):", e.message);
      // Invite is saved in Firestore — owner can resend from the pipeline.
      setErrorMsg(e.message);
      setStatus("email_error");
    }
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">Invite a Client</div>
        <div className="modal-sub">
          Send a branded email with the recording link and questions preview for <strong>{campaign.name}</strong>.
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div className="field">
            <label>Client's First Name</label>
            <input value={clientName} onChange={e => setClientName(e.target.value)} placeholder="e.g. Sarah" />
          </div>
          <div className="field">
            <label>Client's Email</label>
            <input type="email" value={toEmail} onChange={e => setToEmail(e.target.value)} placeholder="sarah@example.com" />
          </div>
        </div>

        {/* Email preview toggle */}
        <button className="btn btn-outline btn-sm" style={{ marginTop: 16 }}
          onClick={() => setShowPreview(v => !v)}>
          {showPreview ? "Hide" : "Preview"} email
        </button>

        {showPreview && (
          <div className="email-preview" style={{ marginTop: 16 }}>
            <div className="email-preview-header">
              <span><strong>To:</strong> {toEmail || "client@example.com"}</span>
              <span><strong>From:</strong> {campaign.companyName} via Vouch</span>
            </div>
            <div className="email-preview-body">
              <p style={{ fontWeight: 700, marginBottom: 4, color: "#0e0e0e" }}>
                Hi {clientName || "there"}, share your <em>honest experience</em> with us
              </p>
              <p style={{ color: "#666", fontSize: "0.85rem", marginBottom: 12, lineHeight: 1.5 }}>
                {campaign.companyName} would love to hear about your experience. It takes just a few minutes.
              </p>
              <p style={{ fontSize: "0.75rem", fontWeight: 600, color: "#aaa", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8 }}>You'll be asked about</p>
              {campaign.prompts.map((p, i) => (
                <div key={i} style={{ display: "flex", gap: 10, marginBottom: 8, alignItems: "flex-start" }}>
                  <span style={{ background: "#c8a96e", color: "#fff", borderRadius: "50%", width: 20, height: 20, fontSize: 10, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 2 }}>{i+1}</span>
                  <span style={{ fontSize: "0.85rem", color: "#333", lineHeight: 1.4 }}>{p}</span>
                </div>
              ))}
              <div style={{ marginTop: 16, padding: "10px 20px", background: "#0e0e0e", borderRadius: 8, display: "inline-block", color: "#fff", fontSize: "0.85rem", fontWeight: 600 }}>
                Record My Testimonial →
              </div>
            </div>
          </div>
        )}

        {status === "success" && (
          <div className="send-status success">✓ Invite saved and email sent to {toEmail}!</div>
        )}
        {status === "email_error" && (
          <div className="send-status" style={{ background: "#fef9e7", border: "1px solid #f0d060", borderRadius: 10, padding: "12px 16px", color: "#7a6010", fontSize: "0.85rem", marginTop: 16 }}>
            ⚠ Invite saved to pipeline, but email delivery failed ({errorMsg}). You can resend from the Invites tab.
          </div>
        )}
        {status === "error" && (
          <div className="send-status error">✕ {errorMsg}</div>
        )}

        <div className="modal-footer">
          <button className="btn btn-outline" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary"
            disabled={!clientName || !toEmail || status === "sending" || status === "success" || status === "email_error"}
            onClick={handleSend}>
            {status === "sending" ? "Saving…" : status === "success" ? "✓ Sent!" : status === "email_error" ? "✓ Saved" : "Send Invite ✉"}
          </button>
        </div>
      </div>
    </div>
  );
}

function StarRating({ value, onChange }) {
  const [hover, setHover] = useState(0);
  return (
    <div className="stars-row">
      {[1,2,3,4,5].map(s => (
        <button key={s} className={`star-btn${s <= (hover || value) ? " filled" : ""}`}
          onMouseEnter={() => setHover(s)}
          onMouseLeave={() => setHover(0)}
          onClick={() => onChange(s)}>
          {s <= (hover || value) ? "★" : "☆"}
        </button>
      ))}
    </div>
  );
}

// ── Client Recording Page ──────────────────────────────────────────────────
function ClientPage({ campaign, onBack, storage, userId, db }) {
  const prompts    = campaign?.prompts || [];
  // step: 0=name, 1=camtest, 2..N+1=questions, N+2=rating, N+3=done
  const ratingStep = prompts.length + 2;
  const doneStep   = prompts.length + 3;
  const [step, setStep] = useState(0);
  const qIdx = step - 2; // 0-based question index, valid when step >= 2

  // Name / company — stored in state but inputs are UNCONTROLLED refs
  // so typing never triggers a re-render (fixes mobile keyboard dismissal)
  const [name, setName]       = useState("");
  const [company, setCompany] = useState("");
  const nameRef               = useRef(null);
  const companyRef            = useRef(null);

  // Camera test
  const [camTestChecks, setCamTestChecks] = useState([false, false, false]);

  // Per-question recording
  const [recordPhase, setRecordPhase]     = useState("idle"); // idle | recording | reviewing
  const [isRerecording, setIsRerecording] = useState(false);
  const [countdown, setCountdown]         = useState(null);   // 3 | 2 | 1 | 0 | null
  const [recSecs, setRecSecs]             = useState(0);

  // Talking points
  const [talkingPoints, setTalkingPoints] = useState({}); // { [qIdx]: string[] | null | undefined }

  // Answers / video
  const [answers, setAnswers]             = useState({});
  const [videoURLs, setVideoURLs]         = useState({});
  const [videoBlobs, setVideoBlobs]       = useState({});
  const [liveStream, setLiveStream]       = useState(null);
  const [cameraAvailable, setCameraAvailable] = useState(null);

  // Rating & submit
  const [rating, setRating]               = useState(0);
  const [submitBlocked, setSubmitBlocked] = useState(false); // true when user clicks Submit with no answers
  const [submitting, setSubmitting]       = useState(false);
  const [submitPhase, setSubmitPhase]     = useState(""); // uploading | analyzing
  const [uploadProgress, setUploadProgress] = useState({});
  const [generatedQuote, setGeneratedQuote] = useState("");

  // localStorage resume
  const lsKey = campaign?.id ? `vouch_${campaign.id}` : null;
  const [showResumeBanner, setShowResumeBanner] = useState(false);
  const [savedProgress, setSavedProgress]       = useState(null);

  // Refs
  const videoRef         = useRef(null);
  const camTestVideoRef  = useRef(null);
  const mediaRecorderRef = useRef(null);
  const chunksRef        = useRef([]);
  const streamRef        = useRef(null);
  const camTestStreamRef = useRef(null);

  // Invite / owner
  const inviteId = new URLSearchParams(window.location.search).get("inviteId");
  const ownerId  = campaign?.ownerId;

  // ── Effects ──────────────────────────────────────────────────────────────

  // Mark invite as opened
  useEffect(() => {
    console.log("[vouch/record] opened-check — inviteId:", inviteId, "| ownerId:", ownerId, "| db:", !!db);
    if (!inviteId || !ownerId || !db) {
      if (!inviteId) console.log("[vouch/record] no ?inviteId= in URL — opened update skipped (direct link, not invite email)");
      return;
    }
    const path = `users/${ownerId}/invites/${inviteId}`;
    console.log("[vouch/record] marking invite opened →", path);
    db.collection("users").doc(ownerId).collection("invites").doc(inviteId)
      .update({ status: "opened", openedAt: Date.now() })
      .then(() => console.log("[vouch/record] ✅ invite marked opened"))
      .catch(e => console.error("[vouch/record] ❌ opened update failed:", e.code, e.message,
        e.code === "permission-denied" ? "\n  → Add to Firestore rules: match /users/{uid}/invites/{id} { allow update: if request.auth != null; }" : ""));
  }, [inviteId, ownerId, db]);

  // Load saved progress from localStorage
  useEffect(() => {
    if (!lsKey) return;
    try {
      const saved = JSON.parse(localStorage.getItem(lsKey) || "null");
      if (saved && saved.step >= 2 && saved.name) { setSavedProgress(saved); setShowResumeBanner(true); }
    } catch {}
  }, []);

  // Auto-save progress on question steps
  useEffect(() => {
    if (!lsKey || step < 2) return;
    try { localStorage.setItem(lsKey, JSON.stringify({ name, company, step, answers })); } catch {}
  }, [step, name, company, answers]);

  // Step 1: camera test — open preview stream
  useEffect(() => {
    if (step !== 1) {
      if (camTestStreamRef.current) {
        camTestStreamRef.current.getTracks().forEach(t => t.stop());
        camTestStreamRef.current = null;
      }
      return;
    }
    if (!navigator.mediaDevices?.getUserMedia) { setCameraAvailable(false); setStep(2); return; }
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then(stream => {
        setCameraAvailable(true);
        camTestStreamRef.current = stream;
        if (camTestVideoRef.current) {
          camTestVideoRef.current.srcObject = stream;
          camTestVideoRef.current.play().catch(() => {});
        }
      })
      .catch(() => { setCameraAvailable(false); setStep(2); });
    return () => {
      if (camTestStreamRef.current) {
        camTestStreamRef.current.getTracks().forEach(t => t.stop());
        camTestStreamRef.current = null;
      }
    };
  }, [step]);

  // Steps 2..N+1: reset state when entering a question page.
  // No auto-open: getUserMedia must be called from a user gesture on iOS Safari.
  // The "Tap to start camera" button calls openCamera() from its click handler.
  useEffect(() => {
    if (step < 2 || step > prompts.length + 1) return;
    setRecordPhase("idle");
    setIsRerecording(false);
    setCountdown(null);
    setRecSecs(0);
    if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
    setLiveStream(null);
    setCameraAvailable(null); // reset so placeholder shows correctly
  }, [step]);

  // Wire live stream to video element.
  // Must also depend on recordPhase: going from idle→recording changes the JSX key
  // when reviewPhase differs, but idle→recording shares the same "live" key slot, so
  // we need this to re-fire any time recordPhase flips while liveStream is active.
  useEffect(() => {
    if (!videoRef.current || !liveStream || recordPhase === "reviewing") return;
    videoRef.current.srcObject = liveStream;
    videoRef.current.play().catch(() => {});
  }, [liveStream, recordPhase]);

  // Fetch talking points for all questions once on mount
  useEffect(() => {
    if (!prompts.length) return;
    prompts.forEach((question, i) => {
      fetch("/api/claude", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "talkingPoints", question }) })
        .then(r => r.json())
        .then(data => {
          try {
            const pts = JSON.parse(data.text);
            setTalkingPoints(prev => ({ ...prev, [i]: Array.isArray(pts) ? pts : null }));
          } catch { setTalkingPoints(prev => ({ ...prev, [i]: null })); }
        })
        .catch(() => setTalkingPoints(prev => ({ ...prev, [i]: null })));
    });
  }, []);

  // 3-2-1 countdown → startRecording
  useEffect(() => {
    if (countdown === null) return;
    if (countdown === 0) { setCountdown(null); startRecording(); return; }
    const t = setTimeout(() => setCountdown(c => c - 1), 1000);
    return () => clearTimeout(t);
  }, [countdown]);

  // Recording timer
  useEffect(() => {
    if (recordPhase !== "recording") return;
    setRecSecs(0);
    const t = setInterval(() => setRecSecs(s => s + 1), 1000);
    return () => clearInterval(t);
  }, [recordPhase]);

  // ── Handlers ──────────────────────────────────────────────────────────────

  // Read uncontrolled input values from refs on submit — no re-render during typing
  function handleNameContinue() {
    const n = (nameRef.current?.value || "").trim();
    if (!n) return;
    setName(n);
    setCompany((companyRef.current?.value || "").trim());
    setCamTestChecks([false, false, false]);
    setStep(1);
  }

  async function startRecording() {
    const capturedIdx = qIdx;
    try {
      setRecordPhase("recording");
      let stream = streamRef.current; // reuse auto-opened preview stream
      if (!stream) {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        streamRef.current = stream;
        setCameraAvailable(true);
        setLiveStream(stream);
      }
      const fmt = pickRecordingFormat();
      const mr  = fmt.mime ? new MediaRecorder(stream, { mimeType: fmt.mime }) : new MediaRecorder(stream);
      mediaRecorderRef.current = mr;
      chunksRef.current = [];
      mr.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      mr.onstop = () => {
        // Use the authoritative mimeType from the recorder instance
        const actualMime = mr.mimeType || fmt.mime || "video/webm";
        const blob = new Blob(chunksRef.current, { type: actualMime });
        console.log("[vouch/record] recording stopped — mime:", actualMime, "| size:", blob.size);
        const url  = URL.createObjectURL(blob);
        setVideoURLs(prev  => ({ ...prev, [capturedIdx]: url }));
        setVideoBlobs(prev => ({ ...prev, [capturedIdx]: blob }));
        stream.getTracks().forEach(t => t.stop());
        streamRef.current = null;
        setLiveStream(null);
        setRecordPhase("reviewing");
        if (videoRef.current) {
          videoRef.current.srcObject = null;
          videoRef.current.src       = url;
          videoRef.current.muted     = false;
          videoRef.current.controls  = true;
          videoRef.current.load();
          videoRef.current.play().catch(() => {});
        }
      };
      mr.start();
    } catch {
      setRecordPhase("idle");
      setCameraAvailable(false);
    }
  }

  function stopRecording() { mediaRecorderRef.current?.stop(); }

  function reRecord() {
    setIsRerecording(true);
    setRecordPhase("idle");
    openCamera();
  }

  // Called from button click handlers so iOS Safari treats it as a user gesture
  function openCamera() {
    if (!navigator.mediaDevices?.getUserMedia) { setCameraAvailable(false); return; }
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then(stream => {
        streamRef.current = stream;
        setCameraAvailable(true);
        setLiveStream(stream);
        // Set srcObject immediately — don't wait for the React effect cycle.
        // This is the most reliable path on iOS where play() must happen in the
        // same microtask as the user gesture that triggered getUserMedia.
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          videoRef.current.play().catch(() => {});
        }
      })
      .catch(() => setCameraAvailable(false));
  }

  function advanceQuestion() {
    if (qIdx >= prompts.length - 1) setStep(ratingStep);
    else setStep(s => s + 1);
  }

  async function handleSubmit() {
    setSubmitting(true);

    // ── DIAGNOSTIC LOGGING ──────────────────────────────────────────────────
    console.group("[vouch] handleSubmit");
    console.log("campaign.id     :", campaign?.id);
    console.log("campaign.ownerId:", campaign?.ownerId);
    console.log("ownerId (derived):", ownerId);
    console.log("userId (prop)   :", userId);
    console.log("db available    :", !!db);
    console.log("auth.currentUser:", window._firebaseAuth?.currentUser?.uid, "(anon:", window._firebaseAuth?.currentUser?.isAnonymous, ")");
    console.log("rating          :", rating);
    console.log("answers         :", answers);
    console.groupEnd();
    // ────────────────────────────────────────────────────────────────────────

    const hasVideos = Object.keys(videoBlobs).length > 0;
    let firebaseURLs = {};
    const storageUserId = ownerId || userId;
    if (hasVideos && storage && storageUserId) {
      setSubmitPhase("uploading");
      try {
        firebaseURLs = await uploadVideos({
          storage, userId: storageUserId,
          campaignId: campaign?.id || "demo",
          videoBlobs,
          onProgress: (idx, pct) => setUploadProgress(prev => ({ ...prev, [idx]: pct })),
        });
      } catch (e) { console.error("[vouch] video upload failed:", e); }
    }
    setSubmitPhase("analyzing");
    const hasTypedAnswers = Object.values(answers).some(v => typeof v === "string" && v.trim().length > 0);
    let quote;
    if (hasVideos && !hasTypedAnswers) {
      quote = "Processing transcript...";
    } else {
      quote = await analyzeTestimonial(answers, prompts);
    }
    setGeneratedQuote(quote);
    if (db && ownerId) {
      const tid = Date.now().toString();
      const fsPath = `users/${ownerId}/testimonials/${tid}`;
      const testimonialData = {
        id: tid, clientName: name, clientCompany: company, rating, answers,
        videoURLs: firebaseURLs, quote,
        campaignId: campaign.id, campaignName: campaign.name || "",
        status: "new", createdAt: Date.now(), inviteId: inviteId || null,
      };
      console.log("[vouch] writing testimonial to Firestore path:", fsPath);
      console.log("[vouch] testimonial data:", testimonialData);
      try {
        await db.collection("users").doc(ownerId).collection("testimonials").doc(tid).set(testimonialData);
        console.log("[vouch] ✅ testimonial write SUCCESS →", fsPath);
      } catch (e) {
        console.error("[vouch] ❌ testimonial write FAILED");
        console.error("  error.code   :", e.code);
        console.error("  error.message:", e.message);
        console.error("  If code is 'permission-denied', update Firestore security rules:");
        console.error("  match /users/{uid}/testimonials/{tid} { allow write: if request.auth != null; }");
      }
    } else {
      console.warn("[vouch] ⚠ testimonial write SKIPPED — db:", !!db, "| ownerId:", ownerId);
      if (!ownerId) console.warn("  → campaign.ownerId is missing. Campaign object:", campaign);
    }
    if (inviteId && ownerId && db) {
      const recPath = `users/${ownerId}/invites/${inviteId}`;
      console.log("[vouch/record] marking invite recorded →", recPath);
      db.collection("users").doc(ownerId).collection("invites").doc(inviteId)
        .update({ status: "recorded", recordedAt: Date.now() })
        .then(() => console.log("[vouch/record] ✅ invite marked recorded"))
        .catch(e => console.error("[vouch/record] ❌ recorded update failed:", e.code, e.message));
    } else {
      console.log("[vouch/record] invite recorded update skipped — inviteId:", inviteId, "| ownerId:", ownerId);
    }
    if (lsKey) try { localStorage.removeItem(lsKey); } catch {}
    setSubmitting(false);
    setSubmitPhase("");
    setStep(doneStep);
  }

  function fmtSecs(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

  const isQuestion = step >= 2 && step <= prompts.length + 1;
  const topPad = onBack ? 52 : 0;

  // Dashboard preview bar (fixed at top when previewing from dashboard)
  const previewBar = onBack ? (
    <div style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 200, background: "rgba(10,10,10,0.92)", backdropFilter: "blur(8px)", borderBottom: "1px solid #222", padding: "10px 20px", display: "flex", alignItems: "center", gap: 16 }}>
      <button className="btn btn-outline btn-sm" style={{ color: "#aaa", borderColor: "#444" }} onClick={onBack}>← Dashboard</button>
      <span style={{ fontSize: "0.78rem", color: "#555" }}>Preview mode</span>
    </div>
  ) : null;

  // Shared wrapper style for centered card steps (name, camera, rating, done)
  const centeredStep = { minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: `${topPad + 40}px 20px 40px` };

  return (
    <div style={{ background: "#0a0a0a", minHeight: "100vh", color: "#fff" }}>

      {/* ── Step 0: Name entry ────────────────────────────────────────────── */}
      {step === 0 && (
        <div style={centeredStep}>
          {previewBar}
          <button className="client-logo" style={{ background: "none", border: "none", cursor: onBack ? "pointer" : "default" }} onClick={onBack || undefined}>✦ Vouch</button>
          <div className="client-card">
            {showResumeBanner && (
              <div className="resume-banner">
                <div className="resume-banner-text">
                  <strong>Welcome back!</strong> Continue where you left off?
                </div>
                <div className="resume-banner-actions">
                  <button className="btn btn-sm btn-outline" style={{ color: "#8fcf8f", borderColor: "#2a4a2a", fontSize: "0.78rem" }}
                    onClick={() => { setName(savedProgress.name||""); setCompany(savedProgress.company||""); setAnswers(savedProgress.answers||{}); setStep(savedProgress.step||2); setShowResumeBanner(false); }}>
                    Resume
                  </button>
                  <button className="btn btn-sm btn-outline" style={{ color: "#555", borderColor: "#222", fontSize: "0.78rem" }}
                    onClick={() => { setShowResumeBanner(false); if (lsKey) try { localStorage.removeItem(lsKey); } catch {} }}>
                    Start over
                  </button>
                </div>
              </div>
            )}
            <div className="time-badge">⏱ Takes about 5 minutes</div>
            <div className="client-step">Let's get started</div>
            <div className="client-title">Share your experience</div>
            <div className="client-sub">
              {campaign?.companyName ? `${campaign.companyName} would love to hear from you.` : "We'd love to hear about your experience."} It only takes a few minutes.
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 14, marginBottom: 24 }}>
              <div className="field">
                <label style={{ color: "#888" }}>Your first name</label>
                {/* Uncontrolled input — defaultValue only sets initial value, no re-render on keypress */}
                <input
                  ref={nameRef}
                  defaultValue={name}
                  placeholder="Jane"
                  autoComplete="given-name"
                  style={{ background: "#111", border: "1.5px solid #333", color: "#fff", borderRadius: 9, padding: "13px 14px", fontFamily: "DM Sans, sans-serif", fontSize: "1rem", outline: "none", width: "100%" }}

            {/* Reviewing: re-record or advance */}
            {recordPhase === "reviewing" && (

                <button className="btn btn-gold" onClick={advanceQuestion}>

            {/* Text fallback */}
            {recordPhase !== "recording" && countdown === null && (

                <div className="q-or-divider" style={{ margin: "12px 0 10px" }}>

                  placeholder="Type your answer here…"
                  value={answers[qIdx] || ""}

                />
                {answers[qIdx] && recordPhase !== "reviewing" && (
                  <button className="btn btn-gold" style={{ width: "100%", justifyContent: "center", marginTop: 10 }}
                    onClick={advanceQuestion}>
                    {qIdx >= prompts.length - 1 ? "Continue to rating →" : "Next question →"}
                  </button>
                )}
              </>
            )}
          </div>
        </div>
      )}

      {/* ── Step N+2: Star rating ─────────────────────────────────────────── */}
      {step === ratingStep && (
        <div style={centeredStep}>
          {previewBar}
          <button className="client-logo" style={{ background: "none", border: "none", cursor: onBack ? "pointer" : "default" }} onClick={onBack || undefined}>✦ Vouch</button>
          <div className="client-card">
            <button className="btn btn-outline btn-sm" style={{ color: "#666", borderColor: "#333", marginBottom: 20 }}
              onClick={() => setStep(prompts.length + 1)}>← Back</button>
            <div className="client-step">Final Step</div>
            <div className="client-title" style={{ textAlign: "center", marginBottom: 8 }}>How was your experience?</div>
            <div className="client-sub" style={{ textAlign: "center", marginBottom: 28 }}>

            </div>
            <StarRating value={rating} onChange={setRating} />
            {submitting ? (
              <div style={{ textAlign: "center", padding: "20px 0" }}>
                {submitPhase === "uploading" && Object.keys(videoBlobs).length > 0 && (
                  <div className="upload-progress">
                    <div style={{ color: "#888", fontSize: "0.78rem", marginBottom: 12, textAlign: "center", textTransform: "uppercase", letterSpacing: "0.06em" }}>Uploading videos…</div>
                    {Object.keys(videoBlobs).map(idx => (
                      <div key={idx} className="upload-row">
                        <div className="upload-label">Q{Number(idx) + 1}</div>
                        <div className="progress-track"><div className="progress-fill" style={{ width: `${uploadProgress[idx] || 0}%` }} /></div>
                        <div className="progress-pct">{uploadProgress[idx] || 0}%</div>
                      </div>
                    ))}
                  </div>
                )}
                {submitPhase === "analyzing" && (
                  <div className="ai-generating" style={{ justifyContent: "center", color: "#888" }}>
                    <div className="ai-spinner" style={{ borderTopColor: "var(--gold)", borderColor: "#333" }} />

                  </div>
                )}
              </div>
            ) : (() => {
                const hasAnswer = Object.values(videoBlobs).some(Boolean) ||
                  Object.values(answers).some(v => typeof v === "string" && v.trim().length > 0);
                return (
                  <>
                    <button className="btn btn-gold"
                      style={{ width: "100%", justifyContent: "center", marginTop: 8, fontSize: "1rem", padding: "14px 24px" }}

                      onClick={() => {
                        if (!hasAnswer) { setSubmitBlocked(true); return; }
                        setSubmitBlocked(false);
                        handleSubmit();

                      Submit Testimonial ✦
                    </button>
                    {submitBlocked && !hasAnswer && (
                      <p style={{ marginTop: 10, color: "#e05c5c", fontSize: "0.83rem", textAlign: "center" }}>
                        Please answer at least one question before submitting.
                      </p>
                    )}
                  </>

              })()}
          </div>
        </div>
      )}

      {/* ── Step N+3: Success ─────────────────────────────────────────────── */}
      {step === doneStep && (
        <div style={centeredStep}>
          {previewBar}
          <button className="client-logo" style={{ background: "none", border: "none", cursor: onBack ? "pointer" : "default" }} onClick={onBack || undefined}>✦ Vouch</button>
          <div className="client-card" style={{ textAlign: "center" }}>

            {/* Celebration */}
            <div><span className="success-celebrate">🎉</span></div>

            {generatedQuote && (
              <div className="success-quote-card">

                <div className="success-quote-text">"{generatedQuote}"</div>

            {/* What happens next */}
            <div style={{ marginBottom: 28 }}>
              <div className="success-steps-label">What happens next</div>

                { icon: "👀", label: "We review your testimonial", desc: "Our team checks everything looks great." },
                { icon: "🎬", label: "We produce a polished video", desc: "Your recording gets professionally processed." },
                { icon: "🚀", label: `${campaign?.companyName || "Your story"} shares your story`, desc: "Your testimonial helps others make great decisions." },
              ].map(({ icon, label, desc }, i) => (
                <div key={i} className="success-step">
                  <div className="success-step-icon">{icon}</div>
                  <div>
                    <div className="success-step-label">{label}</div>
                    <div className="success-step-desc">{desc}</div>

            {/* Divider */}
            <div className="success-divider" />

            {/* Conversion CTA */}
            <div className="success-conversion">
              <div className="success-conversion-heading">Want your own video testimonials?</div>
              <div className="success-conversion-sub">Join thousands of businesses using Vouch to build trust and win more clients.</div>
              <a href="https://vouchbusiness.com" target="_blank" rel="noopener noreferrer" className="success-cta-btn">
                Get my free Vouch profile →
              </a>
              <div className="success-cta-microcopy">Free forever &nbsp;·&nbsp; No credit card required &nbsp;·&nbsp; Setup in 2 minutes</div>
            </div>

            {/* Footer */}
            <div className="success-footer">
              Powered by <a href="https://vouchbusiness.com" target="_blank" rel="noopener noreferrer">Vouch</a> — the trust platform for modern businesses
            </div>

            {onBack && (
              <button className="btn btn-outline" style={{ color: "#666", borderColor: "#333", marginTop: 20 }} onClick={onBack}>
                ← Back to app
              </button>
            )}
          </div>
        </div>
      )}

      <VouchFooter dark />
    </div>
  );
}

// ── AI: suggest clip ranges from quote ───────────────────────────────────────
async function suggestClips(quote, prompts) {
  const text = await callClaude("suggestClips", { quote, prompts });
  return JSON.parse(text.replace(/```json|```/g, "").trim());
}

// ── Video Editor ──────────────────────────────────────────────────────────────
const BRAND_COLORS = ["#c8a96e", "#e05c5c", "#5c9be0", "#5cb87a", "#9b5ce0", "#e08c5c"];

function VideoEditor({ testimonial, onClose }) {
  const quote = testimonial.quote || "";
  const prompts = testimonial.prompts || [];
  const videoURLs = testimonial.videoURLs || {};
  const firstVideoKey = Object.keys(videoURLs)[0];

  // ── State ──
  const [brand, setBrand] = useState({
    name: testimonial.clientName || "",
    company: testimonial.clientCompany || "",
    color: "#c8a96e",
    showLogo: true,
  });

  // Captions: split quote into ~5-word chunks with fake timestamps
  const [captions, setCaptions] = useState(() => {
    const words = quote.split(" ");
    const chunks = [];
    for (let i = 0; i < words.length; i += 6) {
      chunks.push({
        id: i,
        text: words.slice(i, i + 6).join(" "),
        start: i * 0.6,
      });
    }
    return chunks;
  });
  const [activeCaption, setActiveCaption] = useState(null);

  const [clips, setClips] = useState(null);
  const [loadingClips, setLoadingClips] = useState(false);
  const [activeClip, setActiveClip] = useState(null);
  const [exporting, setExporting] = useState(false);
  const [exportDone, setExportDone] = useState(false);

  // Canvas / video refs
  const canvasRef = useRef(null);
  const videoRef = useRef(null);
  const rafRef = useRef(null);
  const [playing, setPlaying] = useState(false);

  // ── Canvas renderer ──
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    canvas.width = 1080; canvas.height = 1920;

    function draw() {
      const video = videoRef.current;
      ctx.clearRect(0, 0, 1080, 1920);

      // Background
      ctx.fillStyle = "#0e0e0e";
      ctx.fillRect(0, 0, 1080, 1920);

      // Video frame (centre, letterboxed)
      if (video && video.readyState >= 2) {
        const vw = video.videoWidth || 1920;
        const vh = video.videoHeight || 1080;
        const scale = Math.min(1080 / vw, 1350 / vh);
        const dw = vw * scale; const dh = vh * scale;
        const dx = (1080 - dw) / 2; const dy = (1920 - dh) / 2 - 100;
        ctx.drawImage(video, dx, dy, dw, dh);
      } else {
        // Placeholder gradient
        const grad = ctx.createLinearGradient(0, 0, 0, 1350);
        grad.addColorStop(0, "#1a1a1a");
        grad.addColorStop(1, "#0e0e0e");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1080, 1350);
        ctx.fillStyle = "#2a2a2a";
        ctx.font = "bold 48px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🎥 Video Preview", 540, 660);
        ctx.font = "32px sans-serif";
        ctx.fillStyle = "#444";
        ctx.fillText("Connect Firebase Storage to see live video", 540, 720);
      }

      // Bottom branding bar
      const barY = 1480;
      ctx.fillStyle = "rgba(0,0,0,0.75)";
      ctx.fillRect(0, barY, 1080, 440);

      // Accent line
      ctx.fillStyle = brand.color;
      ctx.fillRect(0, barY, 1080, 6);

      // Active caption text
      const currentTime = video ? video.currentTime : 0;
      const activeCap = captions.find((c, i) => {
        const next = captions[i + 1];
        return currentTime >= c.start && (!next || currentTime < next.start);
      }) || captions[0];

      if (activeCap) {
        ctx.font = "bold 72px 'DM Sans', sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.8)";
        ctx.shadowBlur = 20;
        // Word wrap
        const words = activeCap.text.split(" ");
        let line = ""; const lines = []; const maxW = 900;
        for (const w of words) {
          const test = line ? line + " " + w : w;
          if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
          else line = test;
        }
        if (line) lines.push(line);
        lines.forEach((l, i) => ctx.fillText(l, 540, barY + 90 + i * 90));
        ctx.shadowBlur = 0;
      }

      // Name + company
      ctx.font = "bold 44px 'DM Sans', sans-serif";
      ctx.fillStyle = brand.color;
      ctx.textAlign = "left";
      ctx.fillText(brand.name, 60, barY + 300);
      ctx.font = "36px 'DM Sans', sans-serif";
      ctx.fillStyle = "#aaa";
      ctx.fillText(brand.company, 60, barY + 355);

      // Vouch watermark
      if (brand.showLogo) {
        ctx.font = "italic bold 34px serif";
        ctx.fillStyle = brand.color;
        ctx.textAlign = "right";
        ctx.fillText("Vouch✦", 1020, barY + 340);
      }

      rafRef.current = requestAnimationFrame(draw);
    }

    rafRef.current = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(rafRef.current);
  }, [brand, captions]);

  // ── Playback ──
  function togglePlay() {
    const v = videoRef.current;
    if (!v || !v.src) return;
    if (v.paused) { v.play(); setPlaying(true); }
    else { v.pause(); setPlaying(false); }
  }

  // ── Load AI clips ──
  async function loadClips() {
    setLoadingClips(true);
    try {
      const c = await suggestClips(quote, prompts);
      setClips(c);
      setActiveClip(0);
    } catch {
      setClips([
        { title: "The Key Result", desc: "Highlight the strongest outcome they mentioned", emoji: "🎯" },
        { title: "Before & After", desc: "Capture the contrast between their challenge and solution", emoji: "✨" },
        { title: "The Recommendation", desc: "Their direct endorsement for the camera", emoji: "🌟" },
      ]);
      setActiveClip(0);
    }
    setLoadingClips(false);
  }

  useEffect(() => { loadClips(); }, []);

  // ── Export (MediaRecorder on canvas) ──
  async function handleExport() {
    setExporting(true);
    const canvas = canvasRef.current;
    const video = videoRef.current;
    try {
      const stream = canvas.captureStream(30);
      const chunks = [];
      const mr = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp9" });
      mr.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      mr.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `${testimonial.clientName || "testimonial"}-vouch.webm`;
        a.click();
        URL.revokeObjectURL(url);
        setExporting(false);
        setExportDone(true);
        setTimeout(() => setExportDone(false), 3000);
      };
      mr.start();
      if (video && video.src) { video.currentTime = 0; video.play(); }
      // Record for video duration or 10s max
      const duration = (video && video.duration && isFinite(video.duration)) ? Math.min(video.duration * 1000, 30000) : 8000;
      setTimeout(() => { mr.stop(); if (video) { video.pause(); } }, duration);
    } catch {
      setExporting(false);
      alert("Export failed — your browser may not support canvas recording.");
    }
  }

  return (
    <div className="editor-overlay">
      {/* Hidden video element for canvas rendering */}
      {firstVideoKey && videoURLs[firstVideoKey] && (
        <video ref={videoRef} src={videoURLs[firstVideoKey]} crossOrigin="anonymous"
          style={{ display: "none" }} onEnded={() => setPlaying(false)} />
      )}

      {/* Nav */}
      <div className="editor-nav">

            {playing ? "⏸ Pause" : "▶ Play"}

      </div>

      <div className="editor-body">
        {/* Main column */}
        <div className="editor-main">

          {/* Canvas preview */}
          <div style={{ display: "flex", justifyContent: "center" }}>

            {loadingClips ? (

            ) : (

                {(clips || []).map((c, i) => (

                    onClick={() => setActiveClip(i)}>

            {clips && activeClip !== null && clips[activeClip] && (

            <div className="caption-list">

                    onClick={e => e.stopPropagation()}

                <div style={{ position: "absolute", top: 3, left: brand.showLogo ? 18 : 3, width: 14, height: 14, background: "#fff", borderRadius: "50%", transition: "left 0.2s" }} />
              </div>

          <div className="editor-sidebar-section" style={{ flex: 1 }}>

          <button className="export-btn" onClick={handleExport} disabled={exporting}>

  );
