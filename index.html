// ── Lazy Firebase loader ──────────────────────────────────────────────────────
// Loads Firebase from CDN so no bundler/npm needed in this artifact context.
let _auth = null;
let _storage = null;
let _db = null;
let _fbReady = false;
let _fbCallbacks = [];

function onFirebaseReady(cb) {
  if (_fbReady) { cb(_auth, _storage, _db); return; }
  _fbCallbacks.push(cb);
}

function initFirebase() {
  if (typeof window.__firebaseLoading !== "undefined") return;
  window.__firebaseLoading = true;

  function load(src) {
    return new Promise(res => {
      const s = document.createElement("script");
      s.src = src; s.onload = res;
      document.head.appendChild(s);
    });
  }

  Promise.all([
    load("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"),
    load("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"),
    load("https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"),
    load("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"),
  ]).then(() => {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    _auth = firebase.auth();
    _storage = firebase.storage();
    _db = firebase.firestore();
    _fbReady = true;
    _fbCallbacks.forEach(cb => cb(_auth, _storage, _db));
    _fbCallbacks = [];
  });
}

// ── Auth helpers ──────────────────────────────────────────────────────────────
function useAuth() {
  const [user, setUser] = useState(undefined); // undefined = loading
  const [auth, setAuth] = useState(null);
  const [storage, setStorage] = useState(null);
  const [db, setDb] = useState(null);

  useEffect(() => {
    initFirebase();
    onFirebaseReady((a, s, d) => {
      setAuth(a);
      setStorage(s);
      setDb(d);
      a.onAuthStateChanged(u => setUser(u || null));
    });
  }, []);

  return { user, auth, storage, db, loading: user === undefined };
}

async function signUp(auth, email, password) {
  return auth.createUserWithEmailAndPassword(email, password);
}

async function signIn(auth, email, password) {
  return auth.signInWithEmailAndPassword(email, password);

async function sendPasswordReset(auth, email) {
  return auth.sendPasswordResetEmail(email);

async function signOut(auth) {
  return auth.signOut();
}

// ── Firebase error → human message ───────────────────────────────────────────
function friendlyAuthError(code) {
  const map = {
    "auth/email-already-in-use": "An account with this email already exists.",
    "auth/invalid-email": "Please enter a valid email address.",
    "auth/weak-password": "Password must be at least 6 characters.",
    "auth/user-not-found": "No account found with this email.",
    "auth/wrong-password": "Incorrect password. Try again.",
    "auth/too-many-requests": "Too many attempts. Please wait a moment and try again.",
    "auth/invalid-credential": "Email or password is incorrect.",
  };
  return map[code] || "Something went wrong. Please try again.";
}

// ── Firebase Storage — upload video blobs ────────────────────────────────────
// videoBlobs: { [promptIndex]: Blob }
// onProgress: (promptIndex, pct) => void
// Returns: { [promptIndex]: downloadURL }
async function uploadVideos({ storage, userId, campaignId, videoBlobs, onProgress }) {
  if (!storage) throw new Error("Firebase Storage not initialised");
  const timestamp = Date.now();
  const entries = Object.entries(videoBlobs);

  const urls = {};
  await Promise.all(
    entries.map(([idx, blob]) =>
      new Promise((resolve, reject) => {
        const path = `testimonials/${userId}/${campaignId}/${timestamp}/q${idx}.webm`;
        const ref = storage.ref(path);
        const task = ref.put(blob, { contentType: "video/webm" });

        task.on(
          "state_changed",
          snap => {
            const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
            onProgress(Number(idx), pct);
          },
          reject,
          async () => {
            urls[idx] = await task.snapshot.ref.getDownloadURL();
            resolve();
          }
        );
      })
    )
  );
  return urls;
}

  .success-sub { color: #888; font-size: 0.9rem; }

  .step-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 32px; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; background: #333; transition: background 0.2s; }
  .step-dot.active { background: var(--gold); }

  /* ── Per-question recording screen ── */
  .q-progress-wrap { margin-bottom: 28px; }
  .q-progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .q-progress-label { color: var(--gold); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
  .q-progress-frac { color: #555; font-size: 0.75rem; font-weight: 600; }
  .q-progress-track { width: 100%; height: 3px; background: #2a2a2a; border-radius: 99px; overflow: hidden; }
  .q-progress-fill { height: 100%; background: var(--gold); border-radius: 99px; transition: width 0.4s cubic-bezier(0.16,1,0.3,1); }

  .q-text {
    font-family: 'Instrument Serif', serif; font-size: 1.55rem; line-height: 1.3;
    margin-bottom: 10px; color: #fff;
  }
  .q-micro {
    color: #666; font-size: 0.84rem; line-height: 1.5; margin-bottom: 24px;
    display: flex; align-items: center; gap: 8px;
  }
  .q-micro.success { color: #5cb87a; }
  .q-micro.retry   { color: #c8a96e; }

  /* Question text overlay on live video */
  .q-video-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    padding: 32px 20px 16px;
    border-radius: 0 0 14px 14px;
    pointer-events: none;
  }
  .q-video-overlay-text {
    color: #fff; font-size: 0.88rem; line-height: 1.45; font-weight: 500;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }

  /* Big record button with pulse ring */
  .rec-ring-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    margin-bottom: 8px;
  }
  .rec-btn-big {
    width: 68px; height: 68px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--rust); color: #fff; font-size: 1.4rem;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s; position: relative;
  }
  .rec-btn-big:hover { transform: scale(1.06); }
  .rec-btn-big::before {
    content: ''; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid rgba(184,92,56,0.35); animation: recPulse 1.8s ease-out infinite;
  }
  @keyframes recPulse {
    0%   { transform: scale(1);   opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  .rec-btn-big-label { color: #666; font-size: 0.78rem; letter-spacing: 0.04em; }

  /* Live recording controls */
  .rec-live-row {
    display: flex; align-items: center; justify-content: space-between;
    background: #111; border-radius: 10px; padding: 10px 16px; margin-bottom: 8px;
  }

  /* Review action buttons */
  .q-review-actions {
    display: flex; gap: 10px; margin-bottom: 16px;
  }
  .q-review-actions .btn { flex: 1; justify-content: center; font-size: 0.88rem; }

  /* Countdown overlay */
  .q-countdown-overlay {
    position: absolute; inset: 0; border-radius: 14px;
    background: rgba(0,0,0,0.72); display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10;
  }
  .q-countdown-num {
    font-family: 'Instrument Serif', serif; font-size: 7rem; color: #fff;
    line-height: 1; animation: countPop 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .q-countdown-label { color: rgba(255,255,255,0.55); font-size: 0.82rem; margin-top: 8px; letter-spacing: 0.08em; }
  @keyframes countPop {
    0%   { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1);   opacity: 1; }
  }

  /* Talking point hints */
  .q-hints { margin: 0 0 20px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .q-hint {
    display: flex; align-items: flex-start; gap: 8px;
    color: #666; font-size: 0.82rem; line-height: 1.45;
  }
  .q-hint-bullet { color: var(--gold); flex-shrink: 0; margin-top: 1px; }
  .q-hints-skeleton {
    display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px;
  }
  .q-hints-skeleton-line {
    height: 10px; background: #1e1e1e; border-radius: 99px;
    animation: shimmer 1.4s ease-in-out infinite alternate;
  }
  @keyframes shimmer { from { opacity: 0.4; } to { opacity: 0.9; } }

  /* Text fallback divider */
  .q-or-divider {
    text-align: center; color: #3a3a3a; font-size: 0.78rem;
    margin: 16px 0; position: relative;
  }
  .q-or-divider::before, .q-or-divider::after {
    content: ''; position: absolute; top: 50%; width: 40%; height: 1px;
    background: #2a2a2a;
  }
  .q-or-divider::before { left: 0; }
  .q-or-divider::after  { right: 0; }

  /* Time estimate badge */
  .time-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 99px;
    padding: 4px 12px; font-size: 0.75rem; color: #888;
    margin-bottom: 20px;
  }

  /* Recording timer */
  .rec-timer {
    font-variant-numeric: tabular-nums; font-size: 0.95rem;
    font-weight: 700; color: #fff; letter-spacing: 0.03em;
  }
  .rec-timer.warn { color: #e09b5c; }
  .rec-aim { color: #555; font-size: 0.75rem; text-align: center; margin-top: 6px; }

  /* Resume banner */
  .resume-banner {
    background: #0f1a0f; border: 1px solid #2a4a2a; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 20px; display: flex;
    align-items: center; justify-content: space-between; gap: 12px;
  }
  .resume-banner-text { font-size: 0.85rem; color: #8fcf8f; line-height: 1.4; }
  .resume-banner-text strong { display: block; color: #a8e0a8; margin-bottom: 2px; }
  .resume-banner-actions { display: flex; gap: 8px; flex-shrink: 0; }

  /* What happens next */
  .whats-next { margin-top: 24px; padding-top: 20px; border-top: 1px solid #1e1e1e; }
  .whats-next-title { font-size: 0.75rem; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px; }
  .whats-next-steps { display: flex; flex-direction: column; gap: 10px; }
  .whats-next-step { display: flex; align-items: flex-start; gap: 12px; }
  .whats-next-num {
    width: 22px; height: 22px; border-radius: 50%; background: #1e1e1e;
    border: 1px solid #2a2a2a; display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 700; color: #c8a96e; flex-shrink: 0; margin-top: 1px;
  }
  .whats-next-text { font-size: 0.84rem; color: #777; line-height: 1.45; }

  /* Camera test checklist */
  .cam-checklist { display: flex; flex-direction: column; gap: 10px; }
  .cam-check-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 10px; cursor: pointer;
    border: 1.5px solid #2a2a2a; background: #0d0d0d;
    transition: border-color 0.18s, background 0.18s;
    user-select: none;
  }
  .cam-check-item.checked { border-color: #c8a96e55; background: #1a1508; }
  .cam-check-item input[type="checkbox"] { display: none; }
  .cam-check-box {
    width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #3a3a3a;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; color: #c8a96e; font-weight: 700; flex-shrink: 0;
    background: transparent; transition: border-color 0.18s, background 0.18s;
  }
  .cam-check-item.checked .cam-check-box { background: #c8a96e22; border-color: #c8a96e; }
  .cam-check-label { font-size: 0.88rem; color: #aaa; transition: color 0.18s; }
  .cam-check-item.checked .cam-check-label { color: #ddd; }

  /* AI loading */
  .ai-generating {
    display: flex; align-items: center; gap: 10px; color: var(--gold);
    font-size: 0.88rem; padding: 16px 0;
  }
  .ai-spinner {
    width: 16px; height: 16px; border: 2px solid #333; border-top-color: var(--gold);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
  .empty-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; color: var(--ink); }

  .tabs-inner { display: flex; gap: 4px; margin-bottom: 24px; }
  .tab-inner {
    padding: 8px 18px; border-radius: 8px; border: none; background: transparent;
    font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500;
    color: var(--muted); cursor: pointer; transition: all 0.2s;
  }
  .tab-inner.active { background: var(--cream); color: var(--ink); font-weight: 600; }

  /* ── Invite Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(14,14,14,0.55); backdrop-filter: blur(4px);
    z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 40px; max-width: 520px; width: 100%; box-shadow: var(--shadow-lg);
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn { from { opacity:0; transform: translateY(12px) scale(0.97); } to { opacity:1; transform: none; } }
  .modal-title { font-family: 'Instrument Serif', serif; font-size: 1.7rem; margin-bottom: 6px; }
  .modal-sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 28px; line-height: 1.5; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 28px; }

  /* Email preview */
  .email-preview {
    border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden;
    margin-top: 20px; font-size: 0.85rem;
  }
  .email-preview-header {
    background: var(--cream); padding: 12px 18px; border-bottom: 1px solid var(--border);
    color: var(--muted); font-size: 0.78rem; display: flex; gap: 16px;
  }
  .email-preview-body { padding: 20px 24px; background: #fff; }

  .send-status {
    display: flex; align-items: center; gap: 10px; padding: 14px 18px;
    border-radius: 10px; font-size: 0.88rem; font-weight: 500; margin-top: 16px;
  }
  .send-status.success { background: #e8f4e8; color: var(--sage); }
  .send-status.error { background: #f4e8e8; color: var(--rust); }

  /* Invites list on campaign card */
  .invites-chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
    background: var(--cream); border-radius: 20px; font-size: 0.75rem; color: var(--muted);
    margin-right: 6px; margin-top: 6px;
  }

  /* ── Auth Screen ── */
  .auth-page {
    min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr;
    background: var(--paper);
  }
  @media (max-width: 800px) { .auth-page { grid-template-columns: 1fr; } .auth-panel { display: none; } }

  .auth-panel {
    background: var(--ink); display: flex; flex-direction: column;
    justify-content: space-between; padding: 48px 52px; overflow: hidden; position: relative;
  }
  .auth-panel-bg {
    position: absolute; inset: 0; opacity: 0.07;
    background: repeating-linear-gradient(45deg, var(--gold) 0, var(--gold) 1px, transparent 0, transparent 50%);
    background-size: 24px 24px;
  }
  .auth-panel-logo { font-family: 'Instrument Serif', serif; font-size: 1.6rem; color: var(--gold); font-style: italic; position: relative; }
  .auth-panel-quote { position: relative; }
  .auth-panel-q { font-family: 'Instrument Serif', serif; font-size: 1.9rem; color: #fff; line-height: 1.3; margin-bottom: 20px; }
  .auth-panel-attr { color: #666; font-size: 0.85rem; }
  .auth-panel-stars { color: var(--gold); font-size: 1rem; margin-bottom: 8px; }

  .auth-form-side {
    display: flex; align-items: center; justify-content: center; padding: 48px 40px;
  }
  .auth-form-box { width: 100%; max-width: 400px; }
  .auth-title { font-family: 'Instrument Serif', serif; font-size: 2.2rem; margin-bottom: 6px; line-height: 1.1; }
  .auth-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 32px; }
  .auth-divider { text-align: center; color: var(--muted); font-size: 0.8rem; margin: 20px 0; position: relative; }
  .auth-divider::before, .auth-divider::after {
    content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border);
  }
  .auth-divider::before { left: 0; } .auth-divider::after { right: 0; }
  .auth-switch { text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--muted); }
  .auth-switch button { background: none; border: none; color: var(--gold); font-weight: 600; cursor: pointer; font-size: 0.88rem; }
  .auth-switch button:hover { text-decoration: underline; }
  .auth-error { background: #fdf0ee; border: 1px solid #f5c6bb; border-radius: 9px; padding: 12px 16px; color: var(--rust); font-size: 0.85rem; margin-bottom: 16px; }
  .auth-forgot { text-align: right; margin-top: -8px; margin-bottom: 16px; }
  .auth-forgot button { background: none; border: none; color: var(--muted); font-size: 0.8rem; cursor: pointer; }
  .auth-forgot button:hover { color: var(--gold); }
  .auth-success { background: #eef4ee; border: 1px solid #b8d4b8; border-radius: 9px; padding: 12px 16px; color: var(--sage); font-size: 0.85rem; margin-bottom: 16px; }

  /* User menu in nav */
  .user-menu { position: relative; }
  .user-btn {
    display: flex; align-items: center; gap: 8px; padding: 7px 14px;
    border-radius: 9px; border: 1.5px solid var(--border); background: transparent;
    cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
    color: var(--ink); transition: all 0.2s;
  }
  .user-btn:hover { border-color: var(--ink); }
  .user-avatar {
    width: 26px; height: 26px; border-radius: 50%; background: var(--gold);
    color: #fff; font-size: 0.72rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .user-dropdown {
    position: absolute; right: 0; top: calc(100% + 8px); background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 8px;
    min-width: 200px; box-shadow: var(--shadow-lg); z-index: 200;
    animation: modalIn 0.15s ease;
  }
  .user-dropdown-email { padding: 8px 12px; font-size: 0.78rem; color: var(--muted); border-bottom: 1px solid var(--border); margin-bottom: 6px; }
  .user-dropdown-item {
    width: 100%; text-align: left; padding: 9px 12px; border-radius: 7px;
    border: none; background: transparent; font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem; color: var(--ink); cursor: pointer; transition: background 0.15s;
  }
  .user-dropdown-item:hover { background: var(--cream); }
  .user-dropdown-item.danger { color: var(--rust); }

  @media (max-width: 700px) {
    .nav { padding: 14px 20px; }
    .dashboard { padding: 28px 20px; }
    .form-row { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: 1fr; }
    .dash-title { font-size: 2rem; }
  }

  /* ── Kanban / Invites pipeline ── */
  .kanban-board {
    display: grid;
    grid-template-columns: repeat(5, minmax(200px, 1fr));
    gap: 12px; align-items: start; overflow-x: auto;
    padding-bottom: 8px;
  }
  .kanban-col {
    background: var(--cream); border-radius: 14px; padding: 14px;
    min-width: 190px;
  }
  .kanban-col-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .kanban-col-label {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted);
  }
  .kanban-col-count {
    font-size: 0.72rem; font-weight: 600; padding: 2px 8px;
    border-radius: 20px; background: var(--border); color: var(--muted);
  }
  .kanban-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; margin-bottom: 10px;
    border-left-width: 3px; position: relative;
  }
  .kanban-card:last-child { margin-bottom: 0; }
  .kanban-card.invited  { border-left-color: #aaa; }
  .kanban-card.opened   { border-left-color: #5c9be0; }
  .kanban-card.recorded { border-left-color: var(--gold); }
  .kanban-card.approved { border-left-color: #5cb87a; }
  .kanban-card.delivered { border-left-color: var(--ink); background: var(--ink); border-color: var(--ink); }
  .kanban-card.delivered .kc-name,
  .kanban-card.delivered .kc-campaign,
  .kanban-card.delivered .kc-days { color: #aaa; }
  .kanban-card.delivered .kc-company { color: #666; }
  .kc-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 2px; }
  .kc-company { font-size: 0.78rem; color: var(--muted); }
  .kc-campaign {
    font-size: 0.75rem; color: var(--muted); margin-top: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kc-days { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
  .kc-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .kc-badge-done {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.72rem; font-weight: 700; color: #fff;
    background: #2a2a2a; padding: 3px 10px; border-radius: 20px;
  }
  .pipeline-stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 12px; margin-bottom: 24px;
  }
  .pipeline-stat {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 20px;
  }
  .pipeline-stat-num {
    font-family: 'Instrument Serif', serif; font-size: 2rem; line-height: 1;
    margin-bottom: 4px;
  }
  .pipeline-stat-label {
    font-size: 0.75rem; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .pipeline-empty {
    text-align: center; padding: 60px 20px; color: var(--muted);
    grid-column: 1 / -1;
  }
  @media (max-width: 900px) {
    .pipeline-stats { grid-template-columns: repeat(2, 1fr); }
    .kanban-board { grid-template-columns: repeat(5, 200px); }
  }

  /* ── Scroll reveal ── */
  [data-reveal] {
    opacity: 0;
    transform: translateY(36px);
    transition: opacity 0.65s cubic-bezier(0.16,1,0.3,1), transform 0.65s cubic-bezier(0.16,1,0.3,1);
  }
  [data-reveal].revealed { opacity: 1; transform: translateY(0); }
  [data-reveal].d1 { transition-delay: 0.1s; }
  [data-reveal].d2 { transition-delay: 0.2s; }
  [data-reveal].d3 { transition-delay: 0.3s; }

  /* ── How It Works ── */
  .hiw-section {
    max-width: 880px; margin: 0 auto; padding: 80px 24px 60px;
  }
  .hiw-label {
    display: inline-block; padding: 5px 16px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--cream);
    font-size: 0.75rem; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 20px;
  }
  .hiw-heading {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 64px;
  }
  .hiw-step {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 48px; align-items: center; margin-bottom: 72px;
  }
  .hiw-step:last-child { margin-bottom: 0; }
  .hiw-step.reverse { direction: rtl; }
  .hiw-step.reverse > * { direction: ltr; }
  .hiw-step-num-col {
    display: flex; align-items: center; justify-content: center;
  }
  .hiw-num {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(6rem, 14vw, 10rem);
    line-height: 1; color: var(--cream); letter-spacing: -0.04em;
    user-select: none; position: relative;
  }
  .hiw-num::after {
    content: attr(data-num);
    position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--gold) 0%, #e8c97a 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0.18;
  }
  .hiw-step-content { display: flex; flex-direction: column; gap: 16px; }
  .hiw-icon {
    width: 52px; height: 52px; border-radius: 14px;
    background: #fdf6e8; border: 1px solid #ede0c4;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; flex-shrink: 0;
  }
  .hiw-step-title {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(1.4rem, 3vw, 1.9rem); line-height: 1.2;
  }
  .hiw-step-desc {
    color: var(--muted); font-size: 1rem; line-height: 1.7; max-width: 380px;
  }
  .hiw-divider {
    width: 1px; height: 48px; background: var(--border);
    margin: 0 auto 72px; display: block;
  }

  /* ── Demo video placeholder ── */
  .demo-section {
    max-width: 760px; margin: 0 auto; padding: 0 24px 80px;
  }
  .demo-card {
    position: relative; border-radius: 20px; overflow: hidden;
    background: var(--ink); aspect-ratio: 16/9;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: 1px solid #1e1e1e;
    box-shadow: 0 24px 64px rgba(14,14,14,0.18);
  }
  .demo-card::before {

// ── AI helpers ────────────────────────────────────────────────────────────────
async function callClaude(action, params) {
  const res = await fetch("/api/claude", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, ...params }),
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error || "AI request failed");
  }
  const { text } = await res.json();
  return text;
}

async function generatePrompts(businessName, industry, context) {
  const res = await fetch("/api/generate-prompts", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ businessName, industry, context }),
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error || "Failed to generate prompts");
  }
  const { prompts } = await res.json();
  return prompts;
}

async function analyzeTestimonial(answers, prompts) {

}

function InviteModal({ campaign, db, userId, onClose }) {
  const [clientName, setClientName] = useState("");
  const [toEmail, setToEmail] = useState("");
  const [status, setStatus] = useState(null); // null | "sending" | "success" | "error"
  const [errorMsg, setErrorMsg] = useState("");
  const [showPreview, setShowPreview] = useState(false);

  const recordingLink = `${window.location.origin}/record/${campaign.id}`;

  async function handleSend() {
    if (!clientName || !toEmail) return;
    setStatus("sending");
    const inviteId = Date.now().toString();
    try {
      await sendInviteEmail({ toEmail, clientName, campaign, inviteId });
      // Save invite record to Firestore
      if (db && userId) {
        await db.collection("users").doc(userId).collection("invites").doc(inviteId).set({
          id: inviteId,
          clientName,
          toEmail,
          campaignId: campaign.id,
          campaignName: campaign.name || "",
          companyName: campaign.companyName || "",

          invitedAt: Date.now(),

          approvedAt: null,

        <button className="btn btn-outline btn-sm" style={{ marginTop: 16 }}

          {showPreview ? "Hide" : "Preview"} email

        {showPreview && (
          <div className="email-preview" style={{ marginTop: 16 }}>
            <div className="email-preview-header">

              <p style={{ color: "#666", fontSize: "0.85rem", marginBottom: 12, lineHeight: 1.5 }}>

              </p>
              <p style={{ fontSize: "0.75rem", fontWeight: 600, color: "#aaa", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8 }}>You'll be asked about</p>
              {campaign.prompts.map((p, i) => (
                <div key={i} style={{ display: "flex", gap: 10, marginBottom: 8, alignItems: "flex-start" }}>
                  <span style={{ background: "#c8a96e", color: "#fff", borderRadius: "50%", width: 20, height: 20, fontSize: 10, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 2 }}>{i+1}</span>
                  <span style={{ fontSize: "0.85rem", color: "#333", lineHeight: 1.4 }}>{p}</span>

// ── Client Recording Page ──────────────────────────────────────────────────
function ClientPage({ campaign, onBack, storage, userId, db }) {
  const prompts    = campaign?.prompts || [];
  // step: 0=name, 1=camtest, 2..N+1=questions, N+2=rating, N+3=done
  const ratingStep = prompts.length + 2;
  const doneStep   = prompts.length + 3;
  const [step, setStep] = useState(0);
  const qIdx = step - 2; // 0-based question index, valid when step >= 2

  // Name / company — stored in state but inputs are UNCONTROLLED refs
  // so typing never triggers a re-render (fixes mobile keyboard dismissal)
  const [name, setName]       = useState("");
  const [company, setCompany] = useState("");
  const nameRef               = useRef(null);
  const companyRef            = useRef(null);

  // Camera test
  const [camTestChecks, setCamTestChecks] = useState([false, false, false]);

  // Per-question recording
  const [recordPhase, setRecordPhase]     = useState("idle"); // idle | recording | reviewing
  const [isRerecording, setIsRerecording] = useState(false);
  const [countdown, setCountdown]         = useState(null);   // 3 | 2 | 1 | 0 | null
  const [recSecs, setRecSecs]             = useState(0);

  // Talking points
  const [talkingPoints, setTalkingPoints] = useState({}); // { [qIdx]: string[] | null | undefined }

  // Answers / video
  const [answers, setAnswers]             = useState({});
  const [videoURLs, setVideoURLs]         = useState({});
  const [videoBlobs, setVideoBlobs]       = useState({});
  const [liveStream, setLiveStream]       = useState(null);
  const [cameraAvailable, setCameraAvailable] = useState(null);

  // Rating & submit
  const [rating, setRating]               = useState(0);
  const [submitting, setSubmitting]       = useState(false);
  const [submitPhase, setSubmitPhase]     = useState(""); // uploading | analyzing
  const [uploadProgress, setUploadProgress] = useState({});
  const [generatedQuote, setGeneratedQuote] = useState("");

  // localStorage resume
  const lsKey = campaign?.id ? `vouch_${campaign.id}` : null;
  const [showResumeBanner, setShowResumeBanner] = useState(false);
  const [savedProgress, setSavedProgress]       = useState(null);

  // Refs
  const videoRef         = useRef(null);
  const camTestVideoRef  = useRef(null);
  const mediaRecorderRef = useRef(null);
  const chunksRef        = useRef([]);
  const streamRef        = useRef(null);
  const camTestStreamRef = useRef(null);

  // Invite / owner
  const inviteId = new URLSearchParams(window.location.search).get("inviteId");
  const ownerId  = campaign?.ownerId;

  // ── Effects ──────────────────────────────────────────────────────────────

  // Mark invite as opened
  useEffect(() => {
    if (!inviteId || !ownerId || !db) return;
    db.collection("users").doc(ownerId).collection("invites").doc(inviteId)
      .update({ status: "opened", openedAt: Date.now() }).catch(() => {});
  }, [inviteId, ownerId, db]);

  // Load saved progress from localStorage
  useEffect(() => {
    if (!lsKey) return;
    try {
      const saved = JSON.parse(localStorage.getItem(lsKey) || "null");
      if (saved && saved.step >= 2 && saved.name) { setSavedProgress(saved); setShowResumeBanner(true); }
    } catch {}
  }, []);

  // Auto-save progress on question steps
  useEffect(() => {
    if (!lsKey || step < 2) return;
    try { localStorage.setItem(lsKey, JSON.stringify({ name, company, step, answers })); } catch {}
  }, [step, name, company, answers]);

  // Step 1: camera test — open preview stream
  useEffect(() => {
    if (step !== 1) {
      if (camTestStreamRef.current) {
        camTestStreamRef.current.getTracks().forEach(t => t.stop());
        camTestStreamRef.current = null;
      }
      return;
    }
    if (!navigator.mediaDevices?.getUserMedia) { setCameraAvailable(false); setStep(2); return; }
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then(stream => {
        setCameraAvailable(true);
        camTestStreamRef.current = stream;
        if (camTestVideoRef.current) {
          camTestVideoRef.current.srcObject = stream;
          camTestVideoRef.current.play().catch(() => {});
        }
      })
      .catch(() => { setCameraAvailable(false); setStep(2); });
    return () => {
      if (camTestStreamRef.current) {
        camTestStreamRef.current.getTracks().forEach(t => t.stop());
        camTestStreamRef.current = null;
      }
    };
  }, [step]);

  // Steps 2..N+1: reset + auto-open camera preview on each question
  useEffect(() => {
    if (step < 2 || step > prompts.length + 1) return;
    setRecordPhase("idle");
    setIsRerecording(false);
    setCountdown(null);
    setRecSecs(0);
    if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
    setLiveStream(null);
    if (navigator.mediaDevices?.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => { setCameraAvailable(true); streamRef.current = stream; setLiveStream(stream); })
        .catch(() => setCameraAvailable(false));
    }
  }, [step]);

  // Wire live stream to video element
  useEffect(() => {
    if (!videoRef.current || !liveStream) return;
    videoRef.current.srcObject = liveStream;
    videoRef.current.play().catch(() => {});
  }, [liveStream]);

  // Fetch talking points for all questions once on mount
  useEffect(() => {
    if (!prompts.length) return;
    prompts.forEach((question, i) => {
      fetch("/api/claude", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "talkingPoints", question }) })
        .then(r => r.json())
        .then(data => {
          try {
            const pts = JSON.parse(data.text);
            setTalkingPoints(prev => ({ ...prev, [i]: Array.isArray(pts) ? pts : null }));
          } catch { setTalkingPoints(prev => ({ ...prev, [i]: null })); }
        })
        .catch(() => setTalkingPoints(prev => ({ ...prev, [i]: null })));
    });
  }, []);

  // 3-2-1 countdown → startRecording
  useEffect(() => {
    if (countdown === null) return;
    if (countdown === 0) { setCountdown(null); startRecording(); return; }
    const t = setTimeout(() => setCountdown(c => c - 1), 1000);
    return () => clearTimeout(t);
  }, [countdown]);

  // Recording timer
  useEffect(() => {
    if (recordPhase !== "recording") return;
    setRecSecs(0);
    const t = setInterval(() => setRecSecs(s => s + 1), 1000);
    return () => clearInterval(t);
  }, [recordPhase]);

  // ── Handlers ──────────────────────────────────────────────────────────────

  // Read uncontrolled input values from refs on submit — no re-render during typing
  function handleNameContinue() {
    const n = (nameRef.current?.value || "").trim();
    if (!n) return;
    setName(n);
    setCompany((companyRef.current?.value || "").trim());
    setCamTestChecks([false, false, false]);
    setStep(1);
  }

  async function startRecording() {
    const capturedIdx = qIdx;
    try {
      setRecordPhase("recording");
      let stream = streamRef.current; // reuse auto-opened preview stream
      if (!stream) {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        streamRef.current = stream;
        setCameraAvailable(true);
        setLiveStream(stream);
      }
      const mr = new MediaRecorder(stream);
      mediaRecorderRef.current = mr;
      chunksRef.current = [];
      mr.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      mr.onstop = () => {
        const blob = new Blob(chunksRef.current, { type: "video/webm" });
        const url  = URL.createObjectURL(blob);
        setVideoURLs(prev  => ({ ...prev, [capturedIdx]: url }));
        setVideoBlobs(prev => ({ ...prev, [capturedIdx]: blob }));
        stream.getTracks().forEach(t => t.stop());
        streamRef.current = null;
        setLiveStream(null);
        setRecordPhase("reviewing");
        if (videoRef.current) {
          videoRef.current.srcObject = null;
          videoRef.current.src       = url;
          videoRef.current.muted     = false;
          videoRef.current.controls  = true;
          videoRef.current.load();
          videoRef.current.play().catch(() => {});
        }
      };
      mr.start();
    } catch {
      setRecordPhase("idle");
      setCameraAvailable(false);
    }
  }

  function stopRecording() { mediaRecorderRef.current?.stop(); }

  function reRecord() {
    setIsRerecording(true);
    setRecordPhase("idle");
    if (navigator.mediaDevices?.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => { setCameraAvailable(true); streamRef.current = stream; setLiveStream(stream); })
        .catch(() => setCameraAvailable(false));
    }
  }

  function advanceQuestion() {
    if (qIdx >= prompts.length - 1) setStep(ratingStep);
    else setStep(s => s + 1);
  }

  async function handleSubmit() {
    setSubmitting(true);
    const hasVideos = Object.keys(videoBlobs).length > 0;
    let firebaseURLs = {};
    const storageUserId = ownerId || userId;
    if (hasVideos && storage && storageUserId) {
      setSubmitPhase("uploading");
      try {
        firebaseURLs = await uploadVideos({
          storage, userId: storageUserId,
          campaignId: campaign?.id || "demo",
          videoBlobs,
          onProgress: (idx, pct) => setUploadProgress(prev => ({ ...prev, [idx]: pct })),
        });
      } catch (e) { console.error("Upload failed:", e); }
    }
    setSubmitPhase("analyzing");
    const quote = await analyzeTestimonial(answers, prompts);
    setGeneratedQuote(quote);
    if (db && ownerId) {
      const tid = Date.now().toString();
      try {
        await db.collection("users").doc(ownerId).collection("testimonials").doc(tid).set({
          id: tid, clientName: name, clientCompany: company, rating, answers,
          videoURLs: firebaseURLs, quote,
          campaignId: campaign.id, campaignName: campaign.name || "",
          status: "new", createdAt: Date.now(), inviteId: inviteId || null,
        });
      } catch (e) { console.error("Failed to save testimonial:", e); }
    }
    if (inviteId && ownerId && db) {
      db.collection("users").doc(ownerId).collection("invites").doc(inviteId)
        .update({ status: "recorded", recordedAt: Date.now() }).catch(() => {});
    }
    if (lsKey) try { localStorage.removeItem(lsKey); } catch {}
    setSubmitting(false);
    setSubmitPhase("");
    setStep(doneStep);
  }

  function fmtSecs(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

  const isQuestion = step >= 2 && step <= prompts.length + 1;
  const topPad = onBack ? 52 : 0;

  // Dashboard preview bar (fixed at top when previewing from dashboard)
  const previewBar = onBack ? (
    <div style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 200, background: "rgba(10,10,10,0.92)", backdropFilter: "blur(8px)", borderBottom: "1px solid #222", padding: "10px 20px", display: "flex", alignItems: "center", gap: 16 }}>

  return (

      {/* ── Step 0: Name entry ────────────────────────────────────────────── */}

          <div className="client-logo">✦ Vouch</div>

            {showResumeBanner && (

            </div>

                )}
              </div>
            )}

            {/* 3-2-1 countdown overlay */}
            {countdown !== null && (
              <div className="q-countdown-overlay">

            )}

            {/* Question text at bottom of video during recording */}
            {recordPhase === "recording" && (
              <div className="q-video-overlay">
                <div className="q-video-overlay-text">{prompts[qIdx]}</div>
              </div>
            )}

            {/* Review badge */}
            {recordPhase === "reviewing" && (
              <div className="cp-review-badge">✓ Watch your answer, then decide</div>
            )}
          </div>

          {/* Bottom controls */}
          <div className="cp-bottom">

            {/* Idle: big record button */}
            {recordPhase === "idle" && countdown === null && cameraAvailable !== false && (
              <div className="cp-record-row">
                <button className="rec-btn-big" onClick={() => setCountdown(3)} aria-label="Start recording">⏺</button>
                <div>
                  <div style={{ color: "#fff", fontWeight: 600, fontSize: "0.92rem", marginBottom: 2 }}>
                    {isRerecording ? "Record again" : "Tap to record"}
                  </div>
                  <div style={{ color: "#555", fontSize: "0.75rem" }}>Aim for 30–60 seconds</div>
                </div>
              </div>
            )}

            {/* Recording: timer + stop button */}
            {recordPhase === "recording" && (
              <div className="cp-recording-row">
                <div className="rec-indicator"><div className="rec-dot" /> Live</div>
                <div style={{ textAlign: "center" }}>
                  <div className={`rec-timer${recSecs >= 90 ? " warn" : ""}`}>{fmtSecs(recSecs)}</div>

            {/* Reviewing: re-record or advance */}
            {recordPhase === "reviewing" && (
              <div className="q-review-actions">
                <button className="btn btn-outline" style={{ color: "#aaa", borderColor: "#333" }} onClick={reRecord}>↩ Re-record</button>
                <button className="btn btn-gold" onClick={advanceQuestion}>
                  {qIdx >= prompts.length - 1 ? "Looks good →" : "Next question →"}
                </button>
              </div>
            )}

            {/* Text fallback */}
            {recordPhase !== "recording" && countdown === null && (
              <>
                <div className="q-or-divider" style={{ margin: "12px 0 10px" }}>
                  {cameraAvailable === false ? "Type your answer" : "or type your answer"}
                </div>
                <textarea
                  style={{ width: "100%", background: "#111", border: `1.5px solid ${answers[qIdx] ? "#c8a96e55" : "#222"}`, color: "#fff", borderRadius: 10, padding: "12px 14px", fontFamily: "DM Sans, sans-serif", fontSize: "0.88rem", resize: "vertical", minHeight: 76, outline: "none", transition: "border-color 0.2s", boxSizing: "border-box" }}
                  placeholder="Type your answer here…"
                  value={answers[qIdx] || ""}
                  onChange={e => setAnswers(prev => ({ ...prev, [qIdx]: e.target.value }))}
                />
                {answers[qIdx] && recordPhase !== "reviewing" && (
                  <button className="btn btn-gold" style={{ width: "100%", justifyContent: "center", marginTop: 10 }}
                    onClick={advanceQuestion}>
                    {qIdx >= prompts.length - 1 ? "Continue to rating →" : "Next question →"}
                  </button>
                )}
              </>
            )}
          </div>
        </div>
      )}

      {/* ── Step N+2: Star rating ─────────────────────────────────────────── */}
      {step === ratingStep && (
        <div style={centeredStep}>
          {previewBar}
          <div className="client-logo">✦ Vouch</div>
          <div className="client-card">
            <button className="btn btn-outline btn-sm" style={{ color: "#666", borderColor: "#333", marginBottom: 20 }}
              onClick={() => setStep(prompts.length + 1)}>← Back</button>
            <div className="client-step">Final Step</div>
            <div className="client-title" style={{ textAlign: "center", marginBottom: 8 }}>How was your experience?</div>
            <div className="client-sub" style={{ textAlign: "center", marginBottom: 28 }}>
              Your honest rating helps others make great decisions.
            </div>
            <StarRating value={rating} onChange={setRating} />
            {submitting ? (
              <div style={{ textAlign: "center", padding: "20px 0" }}>
                {submitPhase === "uploading" && Object.keys(videoBlobs).length > 0 && (
                  <div className="upload-progress">
                    <div style={{ color: "#888", fontSize: "0.78rem", marginBottom: 12, textAlign: "center", textTransform: "uppercase", letterSpacing: "0.06em" }}>Uploading videos…</div>
                    {Object.keys(videoBlobs).map(idx => (
                      <div key={idx} className="upload-row">
                        <div className="upload-label">Q{Number(idx) + 1}</div>
                        <div className="progress-track"><div className="progress-fill" style={{ width: `${uploadProgress[idx] || 0}%` }} /></div>
                        <div className="progress-pct">{uploadProgress[idx] || 0}%</div>

                    ))}

                )}
                {submitPhase === "analyzing" && (
                  <div className="ai-generating" style={{ justifyContent: "center", color: "#888" }}>
                    <div className="ai-spinner" style={{ borderTopColor: "var(--gold)", borderColor: "#333" }} />

                )}
              </div>
            ) : (
              <button className="btn btn-gold"
                style={{ width: "100%", justifyContent: "center", marginTop: 8, fontSize: "1rem", padding: "14px 24px" }}
                disabled={!rating}
                onClick={handleSubmit}>
                Submit Testimonial ✦
              </button>
            )}
          </div>
        </div>
      )}

      {/* ── Step N+3: Success ─────────────────────────────────────────────── */}
      {step === doneStep && (
        <div style={centeredStep}>
          {previewBar}
          <div className="client-logo">✦ Vouch</div>
          <div className="client-card" style={{ textAlign: "center" }}>
            <div style={{ fontSize: "3rem", marginBottom: 16 }}>🌟</div>
            <div className="client-title">Thank you, {name || "friend"}!</div>
            <div className="client-sub" style={{ marginBottom: 24 }}>
              Your testimonial has been submitted and is being reviewed.
            </div>
            {generatedQuote && (
              <div style={{ background: "#111", border: "1px solid #2a2a2a", borderRadius: 12, padding: 20, textAlign: "left", marginBottom: 24 }}>
                <div style={{ color: "#666", fontSize: "0.72rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 10 }}>Your testimonial preview</div>
                <div style={{ fontFamily: "Instrument Serif, serif", fontSize: "1.05rem", fontStyle: "italic", color: "#ddd", lineHeight: 1.6 }}>"{generatedQuote}"</div>
              </div>
            )}
            <div className="whats-next">
              <div className="whats-next-title">What happens now?</div>
              <div className="whats-next-steps">
                {[
                  "We review your testimonial",
                  "We produce a polished video",
                  `${campaign?.companyName || "Your story"} gets shared — and you might be famous!`,
                ].map((text, i) => (
                  <div key={i} className="whats-next-step">
                    <div className="whats-next-num">{i + 1}</div>
                    <div className="whats-next-text">{text}</div>
                  </div>
                ))}
              </div>
            </div>
            {onBack && (
              <button className="btn btn-outline" style={{ color: "#666", borderColor: "#333", marginTop: 24 }} onClick={onBack}>
                ← Back to app
              </button>
            )}
          </div>
        </div>
      )}

    </div>
  );
}

// ── AI: suggest clip ranges from quote ───────────────────────────────────────
async function suggestClips(quote, prompts) {
  const text = await callClaude("suggestClips", { quote, prompts });
  return JSON.parse(text.replace(/```json|```/g, "").trim());
}

// ── Video Editor ──────────────────────────────────────────────────────────────
const BRAND_COLORS = ["#c8a96e", "#e05c5c", "#5c9be0", "#5cb87a", "#9b5ce0", "#e08c5c"];

function VideoEditor({ testimonial, onClose }) {
  const quote = testimonial.quote || "";
  const prompts = testimonial.prompts || [];
  const videoURLs = testimonial.videoURLs || {};
  const firstVideoKey = Object.keys(videoURLs)[0];

  // ── State ──
  const [brand, setBrand] = useState({
    name: testimonial.clientName || "",
    company: testimonial.clientCompany || "",
    color: "#c8a96e",
    showLogo: true,
  });

  // Captions: split quote into ~5-word chunks with fake timestamps
  const [captions, setCaptions] = useState(() => {
    const words = quote.split(" ");
    const chunks = [];
    for (let i = 0; i < words.length; i += 6) {
      chunks.push({
        id: i,
        text: words.slice(i, i + 6).join(" "),
        start: i * 0.6,
      });
    }
    return chunks;
  });
  const [activeCaption, setActiveCaption] = useState(null);

  const [clips, setClips] = useState(null);
  const [loadingClips, setLoadingClips] = useState(false);
  const [activeClip, setActiveClip] = useState(null);
  const [exporting, setExporting] = useState(false);
  const [exportDone, setExportDone] = useState(false);

  // Canvas / video refs
  const canvasRef = useRef(null);
  const videoRef = useRef(null);
  const rafRef = useRef(null);
  const [playing, setPlaying] = useState(false);

  // ── Canvas renderer ──
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    canvas.width = 1080; canvas.height = 1920;

    function draw() {
      const video = videoRef.current;
      ctx.clearRect(0, 0, 1080, 1920);

      // Background
      ctx.fillStyle = "#0e0e0e";
      ctx.fillRect(0, 0, 1080, 1920);

      // Video frame (centre, letterboxed)
      if (video && video.readyState >= 2) {
        const vw = video.videoWidth || 1920;
        const vh = video.videoHeight || 1080;
        const scale = Math.min(1080 / vw, 1350 / vh);
        const dw = vw * scale; const dh = vh * scale;
        const dx = (1080 - dw) / 2; const dy = (1920 - dh) / 2 - 100;
        ctx.drawImage(video, dx, dy, dw, dh);
      } else {
        // Placeholder gradient
        const grad = ctx.createLinearGradient(0, 0, 0, 1350);
        grad.addColorStop(0, "#1a1a1a");
        grad.addColorStop(1, "#0e0e0e");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1080, 1350);
        ctx.fillStyle = "#2a2a2a";
        ctx.font = "bold 48px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🎥 Video Preview", 540, 660);
        ctx.font = "32px sans-serif";
        ctx.fillStyle = "#444";
        ctx.fillText("Connect Firebase Storage to see live video", 540, 720);
      }

      // Bottom branding bar
      const barY = 1480;
      ctx.fillStyle = "rgba(0,0,0,0.75)";
      ctx.fillRect(0, barY, 1080, 440);

      // Accent line
      ctx.fillStyle = brand.color;
      ctx.fillRect(0, barY, 1080, 6);

      // Active caption text
      const currentTime = video ? video.currentTime : 0;
      const activeCap = captions.find((c, i) => {
        const next = captions[i + 1];
        return currentTime >= c.start && (!next || currentTime < next.start);
      }) || captions[0];

      if (activeCap) {
        ctx.font = "bold 72px 'DM Sans', sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.8)";
        ctx.shadowBlur = 20;
        // Word wrap
        const words = activeCap.text.split(" ");
        let line = ""; const lines = []; const maxW = 900;
        for (const w of words) {
          const test = line ? line + " " + w : w;
          if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
          else line = test;
        }
        if (line) lines.push(line);
        lines.forEach((l, i) => ctx.fillText(l, 540, barY + 90 + i * 90));
        ctx.shadowBlur = 0;
      }

      // Name + company
      ctx.font = "bold 44px 'DM Sans', sans-serif";
      ctx.fillStyle = brand.color;
      ctx.textAlign = "left";
      ctx.fillText(brand.name, 60, barY + 300);
      ctx.font = "36px 'DM Sans', sans-serif";
      ctx.fillStyle = "#aaa";
      ctx.fillText(brand.company, 60, barY + 355);

      // Vouch watermark
      if (brand.showLogo) {
        ctx.font = "italic bold 34px serif";
        ctx.fillStyle = brand.color;
        ctx.textAlign = "right";
        ctx.fillText("Vouch✦", 1020, barY + 340);
      }

      rafRef.current = requestAnimationFrame(draw);
    }

    rafRef.current = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(rafRef.current);
  }, [brand, captions]);

  // ── Playback ──
  function togglePlay() {
    const v = videoRef.current;
    if (!v || !v.src) return;
    if (v.paused) { v.play(); setPlaying(true); }
    else { v.pause(); setPlaying(false); }
  }

  // ── Load AI clips ──
  async function loadClips() {
    setLoadingClips(true);
    try {
      const c = await suggestClips(quote, prompts);
      setClips(c);
      setActiveClip(0);
    } catch {
      setClips([
        { title: "The Key Result", desc: "Highlight the strongest outcome they mentioned", emoji: "🎯" },
        { title: "Before & After", desc: "Capture the contrast between their challenge and solution", emoji: "✨" },
        { title: "The Recommendation", desc: "Their direct endorsement for the camera", emoji: "🌟" },
      ]);
      setActiveClip(0);
    }
    setLoadingClips(false);
  }

  useEffect(() => { loadClips(); }, []);

  // ── Export (MediaRecorder on canvas) ──
  async function handleExport() {
    setExporting(true);
    const canvas = canvasRef.current;
    const video = videoRef.current;
    try {
      const stream = canvas.captureStream(30);
      const chunks = [];
      const mr = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp9" });
      mr.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      mr.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `${testimonial.clientName || "testimonial"}-vouch.webm`;
        a.click();
        URL.revokeObjectURL(url);
        setExporting(false);
        setExportDone(true);
        setTimeout(() => setExportDone(false), 3000);
      };
      mr.start();
      if (video && video.src) { video.currentTime = 0; video.play(); }
      // Record for video duration or 10s max
      const duration = (video && video.duration && isFinite(video.duration)) ? Math.min(video.duration * 1000, 30000) : 8000;
      setTimeout(() => { mr.stop(); if (video) { video.pause(); } }, duration);
    } catch {
      setExporting(false);
      alert("Export failed — your browser may not support canvas recording.");
    }
  }

  return (
    <div className="editor-overlay">
      {/* Hidden video element for canvas rendering */}
      {firstVideoKey && videoURLs[firstVideoKey] && (
        <video ref={videoRef} src={videoURLs[firstVideoKey]} crossOrigin="anonymous"
          style={{ display: "none" }} onEnded={() => setPlaying(false)} />
      )}

      {/* Nav */}
      <div className="editor-nav">
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <button className="btn btn-outline btn-sm" style={{ color: "#888", borderColor: "#333" }} onClick={onClose}>← Back</button>
          <div className="editor-title">Editing — {testimonial.clientName}</div>
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <button className="btn btn-outline btn-sm" style={{ color: "#888", borderColor: "#333" }} onClick={togglePlay}>
            {playing ? "⏸ Pause" : "▶ Play"}
          </button>
        </div>
      </div>

      <div className="editor-body">
        {/* Main column */}
        <div className="editor-main">

          {/* Canvas preview */}
          <div style={{ display: "flex", justifyContent: "center" }}>
            <div className="canvas-wrap" style={{ width: "min(100%, 240px)" }}>
              <canvas ref={canvasRef} />
            </div>
          </div>

          {/* Social clips */}
          <div>
            <div style={{ color: "#555", fontSize: "0.72rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 12 }}>
              AI Social Clips
            </div>
            {loadingClips ? (
              <div className="ai-generating" style={{ color: "#555" }}>
                <div className="ai-spinner" style={{ borderColor: "#2a2a2a", borderTopColor: "#c8a96e" }} />

              </div>
            ) : (
              <div className="clip-strip">
                {(clips || []).map((c, i) => (
                  <button key={i} className={`clip-pill ${activeClip === i ? "active" : ""}`}
                    onClick={() => setActiveClip(i)}>
                    {c.emoji} {c.title}

              </div>
            )}
            {clips && activeClip !== null && clips[activeClip] && (
              <div style={{ marginTop: 12, padding: "12px 16px", background: "#111", border: "1px solid #1e1e1e", borderRadius: 8, color: "#888", fontSize: "0.85rem", lineHeight: 1.5 }}>

          {/* Captions */}
          <div>

            <div className="caption-list">

// ── Invites Kanban ────────────────────────────────────────────────────────────
const PIPELINE_STAGES = [
  { key: "invited",   label: "Invited",   color: "#aaa" },
  { key: "opened",    label: "Opened",    color: "#5c9be0" },
  { key: "recorded",  label: "Recorded",  color: "#c8a96e" },
  { key: "approved",  label: "Approved",  color: "#5cb87a" },
  { key: "delivered", label: "Delivered", color: "#0e0e0e" },
];

function daysSince(ts) {
  return Math.floor((Date.now() - ts) / 86400000);
}

function InvitesKanban({ invites, db, userId, onReview }) {
  async function updateStatus(invite, newStatus) {
    if (!db || !userId) return;
    const now = Date.now();
    const patch = { status: newStatus };
    if (newStatus === "approved")  patch.approvedAt = now;
    if (newStatus === "delivered") patch.deliveredAt = now;
    await db.collection("users").doc(userId).collection("invites").doc(invite.id).update(patch);
  }

  async function handleResend(invite) {
    try {
      await sendInviteEmail({
        toEmail: invite.toEmail,
        clientName: invite.clientName,
        campaign: { id: invite.campaignId, name: invite.campaignName, companyName: invite.companyName, prompts: [] },
        inviteId: invite.id,
      });
      alert(`Re-sent to ${invite.toEmail}`);
    } catch (e) {
      alert("Resend failed: " + e.message);
    }
  }

  // ── Stats ──
  const total = invites.length;
  const delivered = invites.filter(i => i.status === "delivered");
  const completionRate = total > 0 ? Math.round((delivered.length / total) * 100) : 0;
  const avgDays = delivered.length > 0
    ? Math.round(delivered.reduce((sum, i) => sum + ((i.deliveredAt || Date.now()) - i.invitedAt), 0) / delivered.length / 86400000)
    : null;
  const atRisk = invites.filter(i => i.status === "invited" || i.status === "opened")
    .reduce((sum, i) => sum + (i.planValue || 497), 0);
  const inPipeline = invites.filter(i => i.status !== "delivered").length;

  return (
    <div>
      {/* Summary stats */}
      <div className="pipeline-stats">
        <div className="pipeline-stat">
          <div className="pipeline-stat-num serif">{inPipeline}</div>
          <div className="pipeline-stat-label">In Pipeline</div>
        </div>
        <div className="pipeline-stat">
          <div className="pipeline-stat-num serif">{avgDays !== null ? `${avgDays}d` : "—"}</div>
          <div className="pipeline-stat-label">Avg Completion</div>
        </div>
        <div className="pipeline-stat">
          <div className="pipeline-stat-num serif">{completionRate}%</div>
          <div className="pipeline-stat-label">Completion Rate</div>
        </div>
        <div className="pipeline-stat">
          <div className="pipeline-stat-num serif" style={{ color: atRisk > 0 ? "#e05c5c" : "var(--ink)" }}>
            £{atRisk.toLocaleString()}
          </div>
          <div className="pipeline-stat-label">Revenue at Risk</div>
        </div>
      </div>

      {/* Kanban board */}
      {total === 0 ? (
        <div style={{ textAlign: "center", padding: "60px 20px", color: "var(--muted)", background: "var(--cream)", borderRadius: 14 }}>
          <div style={{ fontSize: "2rem", marginBottom: 12 }}>📬</div>
          <div style={{ fontFamily: "Instrument Serif, serif", fontSize: "1.3rem", marginBottom: 8 }}>No invites yet</div>
          <div style={{ fontSize: "0.88rem" }}>Send your first invite from the Campaigns tab to start tracking your pipeline.</div>
        </div>
      ) : (
        <div className="kanban-board">
          {PIPELINE_STAGES.map(stage => {
            const cards = invites.filter(i => i.status === stage.key);
            return (
              <div key={stage.key} className="kanban-col">
                <div className="kanban-col-header">
                  <div className="kanban-col-label" style={{ color: stage.color }}>{stage.label}</div>
                  <div className="kanban-col-count">{cards.length}</div>
                </div>
                {cards.length === 0 && (
                  <div style={{ fontSize: "0.78rem", color: "var(--border)", textAlign: "center", padding: "20px 0" }}>—</div>
                )}
                {cards.map(invite => {
                  const days = daysSince(invite.invitedAt);
                  const stale = stage.key === "invited" && days >= 3;
                  return (
                    <div key={invite.id} className={`kanban-card ${stage.key}`}>
                      <div className="kc-name">{invite.clientName}</div>
                      {invite.companyName && <div className="kc-company">{invite.companyName}</div>}
                      <div className="kc-campaign">{invite.campaignName}</div>
                      <div className="kc-days">{days === 0 ? "Today" : `${days}d ago`}</div>
                      <div className="kc-actions">
                        {stage.key === "delivered" && (
                          <span className="kc-badge-done">✓ Done</span>
                        )}
                        {stage.key === "invited" && stale && (
                          <button className="btn btn-outline btn-sm" style={{ fontSize: "0.75rem", padding: "4px 10px" }}
                            onClick={() => handleResend(invite)}>
                            ↩ Resend
                          </button>
                        )}
                        {stage.key === "recorded" && (
                          <button className="btn btn-gold btn-sm" style={{ fontSize: "0.75rem", padding: "4px 10px" }}
                            onClick={() => onReview(invite)}>
                            Review
                          </button>
                        )}
                        {(stage.key === "recorded" || stage.key === "opened") && (
                          <button className="btn btn-outline btn-sm" style={{ fontSize: "0.75rem", padding: "4px 10px" }}
                            onClick={() => updateStatus(invite, "approved")}>
                            Approve
                          </button>
                        )}
                        {stage.key === "approved" && (
                          <button className="btn btn-primary btn-sm" style={{ fontSize: "0.75rem", padding: "4px 10px" }}
                            onClick={() => updateStatus(invite, "delivered")}>
                            Mark Delivered
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Dashboard({ onPreview, userId, db, onUpgrade }) {

  const planKey = "starter"; // default everyone to Starter for now
  const plan = PLANS[planKey];

  const [editTarget, setEditTarget] = useState(null);

  const [campaigns, setCampaigns] = useState([]);
  const [testimonials, setTestimonials] = useState([]);
  const [invites, setInvites] = useState([]);
  const [dbError, setDbError] = useState(null);

  useEffect(() => {
    if (!db || !userId) return;
    const unsubCampaigns = db.collection("users").doc(userId).collection("campaigns")
      .orderBy("createdAt", "desc")
      .onSnapshot(
        snap => { setDbError(null); setCampaigns(snap.docs.map(d => d.data())); },
        err => { console.error("[campaigns] Firestore error:", err); setDbError(err.message); }
      );
    const unsubTestimonials = db.collection("users").doc(userId).collection("testimonials")
      .orderBy("createdAt", "desc")
      .onSnapshot(
        snap => setTestimonials(snap.docs.map(d => d.data())),
        err => console.error("[testimonials] Firestore error:", err)
      );
    const unsubInvites = db.collection("users").doc(userId).collection("invites")
      .orderBy("invitedAt", "desc")
      .onSnapshot(
        snap => setInvites(snap.docs.map(d => d.data())),
        err => console.error("[invites] Firestore error:", err)
      );
    return () => { unsubCampaigns(); unsubTestimonials(); unsubInvites(); };
  }, [db, userId]);
  const [showCreate, setShowCreate] = useState(false);

  // New campaign form
  const [form, setForm] = useState({ name: "", companyName: "", industry: "", context: "" });
  const [prompts, setPrompts] = useState([]);
  const [generating, setGenerating] = useState(false);
  const [copiedId, setCopiedId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [saveError, setSaveError] = useState(null);

  async function handleGenerate() {
    if (!form.companyName || !form.industry) return;
    setGenerating(true);
    try {
      const p = await generatePrompts(form.companyName, form.industry, form.context);
      setPrompts(p);
    } catch (e) {
      alert("Failed to generate prompts: " + e.message);
    }
    setGenerating(false);
  }

  async function saveCampaign() {
    setSaveError(null);
    if (!db) { setSaveError("Database not ready — please wait a moment and try again."); return; }
    if (!userId) { setSaveError("Not signed in."); return; }
    setSaving(true);
    try {
      const id = Date.now().toString();
      const c = { id, ownerId: userId, ...form, prompts, createdAt: Date.now() };
      console.log("[saveCampaign] writing to Firestore:", c);
      await db.collection("users").doc(userId).collection("campaigns").doc(id).set(c);
      console.log("[saveCampaign] write succeeded");
      setForm({ name: "", companyName: "", industry: "", context: "" });
      setPrompts([]);
      setShowCreate(false);
    } catch (e) {
      console.error("[saveCampaign] write failed:", e);
      setSaveError(e.message || "Failed to save campaign. Check the console for details.");
    } finally {
      setSaving(false);
    }
  }

  function copyLink(id) {
    setCopiedId(id);
    setTimeout(() => setCopiedId(null), 2000);

    <div className="dashboard">
      {inviteTarget && <InviteModal campaign={inviteTarget} db={db} userId={userId} onClose={() => setInviteTarget(null)} />}
      {playbackTarget && <VideoPlaybackModal testimonial={playbackTarget} onClose={() => setPlaybackTarget(null)} />}
      {editTarget && <VideoEditor testimonial={editTarget} onClose={() => setEditTarget(null)} />}
      {dbError && (
        <div style={{ margin: "0 0 20px", color: "#e05c5c", fontSize: "0.85rem", background: "#2a1010", border: "1px solid #5c2020", borderRadius: 8, padding: "12px 16px" }}>
          <strong>Firestore error:</strong> {dbError}
          {dbError.includes("index") && <span> — open the Firebase Console link in the browser console to create the required index.</span>}
        </div>
      )}
      <div className="dash-header">
        <div className="dash-title serif">Your Dashboard</div>
        <div className="dash-subtitle">Manage campaigns and review incoming testimonials</div>
      </div>

      <div className="stats-row">
        <div className="stat-card">
          <div className="stat-num serif">{campaigns.length}</div>
          <div className="stat-label">Active Campaigns</div>
        </div>
        <div className="stat-card">
          <div className="stat-num serif">{testimonials.length}</div>
          <div className="stat-label">Testimonials Received</div>
        </div>
        <div className="stat-card">
          <div className="stat-num serif">{testimonials.filter(t => t.status === "approved").length}</div>
          <div className="stat-label">Approved & Ready</div>
        </div>
      </div>

      <div className="tabs-inner">
        {[["campaigns","📋 Campaigns"],["testimonials","⭐ Testimonials"],["invites","📬 Invites"],["billing","💳 Plan & Billing"]].map(([key, label]) => (
          <button key={key} className={`tab-inner ${innerTab === key ? "active" : ""}`} onClick={() => setInnerTab(key)}>

// ── Auth Screen ───────────────────────────────────────────────────────────────
function AuthScreen({ auth }) {
  const [mode, setMode] = useState("login"); // "login" | "signup" | "reset"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [resetSent, setResetSent] = useState(false);

  async function handleSubmit() {
    setError(""); setLoading(true);
    try {
      if (mode === "login") await signIn(auth, email, password);
      else if (mode === "signup") await signUp(auth, email, password);
      else {
        await sendPasswordReset(auth, email);
        setResetSent(true);
      }
    } catch (e) {
      setError(friendlyAuthError(e.code));
    }
    setLoading(false);
  }

  function switchMode(m) {
    setMode(m); setError(""); setResetSent(false);
  }

  const isReset = mode === "reset";
  const isSignup = mode === "signup";

  return (
    <div className="auth-page">
      {/* Left panel — brand / testimonial */}
      <div className="auth-panel">
        <div className="auth-panel-bg" />
        <div className="auth-panel-logo">Vouch✦</div>
        <div className="auth-panel-quote">
          <div className="auth-panel-stars">★★★★★</div>
          <div className="auth-panel-q">
            "We went from chasing testimonials to having a consistent stream of polished video proof — in weeks."
          </div>
          <div className="auth-panel-attr">— James R., Founder at Clearpath Agency</div>
        </div>
      </div>

      {/* Right panel — form */}
      <div className="auth-form-side">
        <div className="auth-form-box">
          <div className="auth-title">
            {isReset ? "Reset password" : isSignup ? "Create account" : "Welcome back"}
          </div>
          <div className="auth-sub">
            {isReset
              ? "We'll email you a link to reset your password."
              : isSignup
              ? "Start collecting video testimonials that actually convert."
              : "Sign in to your Vouch dashboard."}
          </div>

          {error && <div className="auth-error">⚠ {error}</div>}
          {resetSent && <div className="auth-success">✓ Reset link sent — check your inbox.</div>}

          <div className="field" style={{ marginBottom: 14 }}>
            <label>Email</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)}
              placeholder="you@company.com"
              onKeyDown={e => e.key === "Enter" && !isReset && handleSubmit()} />
          </div>

          {!isReset && (
            <div className="field" style={{ marginBottom: isSignup ? 20 : 8 }}>
              <label>Password</label>
              <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                placeholder={isSignup ? "Min. 6 characters" : "••••••••"}
                onKeyDown={e => e.key === "Enter" && handleSubmit()} />
            </div>
          )}

          {mode === "login" && (
            <div className="auth-forgot">
              <button onClick={() => switchMode("reset")}>Forgot password?</button>
            </div>
          )}

          <button className="btn btn-primary" style={{ width: "100%", justifyContent: "center", marginBottom: 8 }}
            disabled={loading || (!email) || (!isReset && !password)}
            onClick={handleSubmit}>
            {loading ? "Please wait…" : isReset ? "Send reset link" : isSignup ? "Create account" : "Sign in"}
          </button>

          <div className="auth-switch">
            {isReset ? (
              <><span>Remembered it? </span><button onClick={() => switchMode("login")}>Back to sign in</button></>
            ) : isSignup ? (
              <><span>Already have an account? </span><button onClick={() => switchMode("login")}>Sign in</button></>
            ) : (
              <><span>Don't have an account? </span><button onClick={() => switchMode("signup")}>Sign up free</button></>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── User Menu (nav dropdown) ──────────────────────────────────────────────────
function UserMenu({ user, auth }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const initials = user.email ? user.email[0].toUpperCase() : "?";

  useEffect(() => {
    function handler(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  return (
    <div className="user-menu" ref={ref}>
      <button className="user-btn" onClick={() => setOpen(v => !v)}>
        <div className="user-avatar">{initials}</div>
        <span style={{ maxWidth: 140, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
          {user.email}
        </span>
        <span style={{ color: "var(--muted)", fontSize: "0.7rem" }}>{open ? "▲" : "▼"}</span>
      </button>
      {open && (
        <div className="user-dropdown">
          <div className="user-dropdown-email">{user.email}</div>
          <button className="user-dropdown-item danger" onClick={() => { setOpen(false); signOut(auth); }}>
            Sign out
          </button>
        </div>
      )}
    </div>
  );
}

function fmtPrice(base, cur) {
  const raw = base * cur.rate * (cur.discount || 1);
  return cur.symbol + (Math.ceil(raw / 10) * 10 - 3);
}
