    const { useState, useRef, useEffect } = React;


const ANTHROPIC_API_URL = "https://api.anthropic.com/v1/messages";

// ── Firebase config ───────────────────────────────────────────────────────────
// Replace these values with your own from Firebase Console →
// Project Settings → General → Your apps → Firebase SDK snippet → Config
const FIREBASE_CONFIG = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_PROJECT.firebaseapp.com",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId:             "YOUR_APP_ID",
};

// ── Lazy Firebase loader ──────────────────────────────────────────────────────
// Loads Firebase from CDN so no bundler/npm needed in this artifact context.
let _auth = null;
let _storage = null;
let _fbReady = false;
let _fbCallbacks = [];

function onFirebaseReady(cb) {
  if (_fbReady) { cb(_auth, _storage); return; }
  _fbCallbacks.push(cb);
}

function initFirebase() {
  if (typeof window.__firebaseLoading !== "undefined") return;
  window.__firebaseLoading = true;

  function load(src) {
    return new Promise(res => {
      const s = document.createElement("script");
      s.src = src; s.onload = res;
      document.head.appendChild(s);
    });
  }

  Promise.all([
    load("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"),
    load("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"),
    load("https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"),
  ]).then(() => {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    _auth = firebase.auth();
    _storage = firebase.storage();
    _fbReady = true;
    _fbCallbacks.forEach(cb => cb(_auth, _storage));
    _fbCallbacks = [];
  });
}

// ── Auth helpers ──────────────────────────────────────────────────────────────
function useAuth() {
  const [user, setUser] = useState(undefined); // undefined = loading
  const [auth, setAuth] = useState(null);
  const [storage, setStorage] = useState(null);

  useEffect(() => {
    initFirebase();
    onFirebaseReady((a, s) => {
      setAuth(a);
      setStorage(s);
      a.onAuthStateChanged(u => setUser(u || null));
    });
  }, []);

  return { user, auth, storage, loading: user === undefined };
}

async function signUp(auth, email, password) {
  return auth.createUserWithEmailAndPassword(email, password);
}

async function signIn(auth, email, password) {
  return auth.signInWithEmailAndPassword(email, password);
}

async function sendPasswordReset(auth, email) {
  return auth.sendPasswordResetEmail(email);
}

async function signOut(auth) {
  return auth.signOut();
}

// ── Firebase error → human message ───────────────────────────────────────────
function friendlyAuthError(code) {
  const map = {
    "auth/email-already-in-use": "An account with this email already exists.",
    "auth/invalid-email": "Please enter a valid email address.",
    "auth/weak-password": "Password must be at least 6 characters.",
    "auth/user-not-found": "No account found with this email.",
    "auth/wrong-password": "Incorrect password. Try again.",
    "auth/too-many-requests": "Too many attempts. Please wait a moment and try again.",
    "auth/invalid-credential": "Email or password is incorrect.",
  };
  return map[code] || "Something went wrong. Please try again.";
}

// ── Firebase Storage — upload video blobs ────────────────────────────────────
// videoBlobs: { [promptIndex]: Blob }
// onProgress: (promptIndex, pct) => void
// Returns: { [promptIndex]: downloadURL }
async function uploadVideos({ storage, userId, campaignId, videoBlobs, onProgress }) {
  if (!storage) throw new Error("Firebase Storage not initialised");
  const timestamp = Date.now();
  const entries = Object.entries(videoBlobs);

  const urls = {};
  await Promise.all(
    entries.map(([idx, blob]) =>
      new Promise((resolve, reject) => {
        const path = `testimonials/${userId}/${campaignId}/${timestamp}/q${idx}.webm`;
        const ref = storage.ref(path);
        const task = ref.put(blob, { contentType: "video/webm" });

        task.on(
          "state_changed",
          snap => {
            const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
            onProgress(Number(idx), pct);
          },
          reject,
          async () => {
            urls[idx] = await task.snapshot.ref.getDownloadURL();
            resolve();
          }
        );
      })
    )
  );
  return urls;
}

async function generatePrompts(businessName, industry, context) {
  const response = await fetch(ANTHROPIC_API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: `You are helping generate video testimonial prompts for a business.

Business: ${businessName}
Industry: ${industry}
Extra context: ${context || "None"}

Generate exactly 4 short, conversational video testimonial questions that will help customers share genuine, compelling stories. Each question should be easy to answer naturally on camera — not corporate or stiff.

Respond ONLY with a JSON array of 4 strings, no markdown, no explanation. Example format:
["Question 1?","Question 2?","Question 3?","Question 4?"]`
      }]
    })
  });
  const data = await response.json();
  const text = data.content.map(b => b.text || "").join("");
  return JSON.parse(text.replace(/```json|```/g, "").trim());
}

async function analyzeTestimonial(answers, prompts) {
  const combined = prompts.map((p, i) => `Q: ${p}\nA: ${answers[i] || "(no answer)"}`).join("\n\n");
  const response = await fetch(ANTHROPIC_API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 400,
      messages: [{
        role: "user",
        content: `Based on these testimonial answers, write a single compelling 2-3 sentence testimonial quote in the customer's voice. Make it sound natural, genuine, and specific — not generic marketing speak.

${combined}

Respond with ONLY the quote text, no quotation marks, no explanation.`
      }]
    })
  });
  const data = await response.json();
  return data.content.map(b => b.text || "").join("").trim();
}

// ── Send invite via Resend ────────────────────────────────────────────────────
async function sendInviteEmail({ toEmail, clientName, campaign, resendApiKey }) {
  const recordingLink = `https://vouch.app/record/${campaign.id}`;
  const html = buildEmailHTML({
    clientName,
    companyName: campaign.companyName,
    campaignName: campaign.name,
    prompts: campaign.prompts,
    recordingLink,
  });
  const res = await fetch("https://api.resend.com/emails", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${resendApiKey}`,
    },
    body: JSON.stringify({
      from: `${campaign.companyName} via Vouch <onboarding@resend.dev>`,
      to: [toEmail],
      subject: `${clientName}, share your experience with ${campaign.companyName}`,
      html,
    }),
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || "Failed to send email");
  }
  return res.json();
}

// ── Client Recording Page ──────────────────────────────────────────────────
function ClientPage({ campaign, onBack, storage, userId }) {
  const [step, setStep] = useState(0);
  const [selectedPrompt, setSelectedPrompt] = useState(0);
  const [answers, setAnswers] = useState({});
  const [rating, setRating] = useState(0);
  const [name, setName] = useState("");
  const [company, setCompany] = useState("");
  const [recording, setRecording] = useState(false);
  const [videoURLs, setVideoURLs] = useState({});     // local blob URLs for preview
  const [videoBlobs, setVideoBlobs] = useState({});   // raw Blobs for upload
  const [uploadProgress, setUploadProgress] = useState({}); // { [idx]: 0-100 }
  const [uploadedURLs, setUploadedURLs] = useState({}); // Firebase download URLs
  const [submitting, setSubmitting] = useState(false);
  const [submitPhase, setSubmitPhase] = useState(""); // "uploading" | "analyzing" | ""
  const [generatedQuote, setGeneratedQuote] = useState("");
  const videoRef = useRef(null);
  const mediaRecorderRef = useRef(null);
  const chunksRef = useRef([]);
  const streamRef = useRef(null);

  const prompts = campaign?.prompts || [];
  const hasVideos = Object.keys(videoBlobs).length > 0;

  // Check camera availability on mount
  const [cameraAvailable, setCameraAvailable] = useState(null); // null=unknown, true, false
  useEffect(() => {
    if (!navigator.mediaDevices?.getUserMedia) { setCameraAvailable(false); return; }
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then(s => { s.getTracks().forEach(t => t.stop()); setCameraAvailable(true); })
      .catch(() => setCameraAvailable(false));
  }, []);

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      streamRef.current = stream;
      if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.play(); }
      const mr = new MediaRecorder(stream);
      mediaRecorderRef.current = mr;
      chunksRef.current = [];
      mr.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      mr.onstop = () => {
        const blob = new Blob(chunksRef.current, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        setVideoURLs(prev => ({ ...prev, [selectedPrompt]: url }));
        setVideoBlobs(prev => ({ ...prev, [selectedPrompt]: blob }));
        if (videoRef.current) { videoRef.current.srcObject = null; videoRef.current.src = url; }
        stream.getTracks().forEach(t => t.stop());
      };
      mr.start();
      setRecording(true);
      setCameraAvailable(true);
    } catch {
      setCameraAvailable(false);
    }
  }

  function stopRecording() {
    mediaRecorderRef.current?.stop();
    setRecording(false);
  }

  async function handleSubmit() {
    setSubmitting(true);

    // Phase 1: upload videos to Firebase Storage
    let firebaseURLs = {};
    if (hasVideos && storage && userId) {
      setSubmitPhase("uploading");
      try {
        firebaseURLs = await uploadVideos({
          storage,
          userId,
          campaignId: campaign?.id || "demo",
          videoBlobs,
          onProgress: (idx, pct) =>
            setUploadProgress(prev => ({ ...prev, [idx]: pct })),
        });
        setUploadedURLs(firebaseURLs);
      } catch (e) {
        console.error("Upload failed:", e);
        // Continue anyway — we still have text answers
      }
    }

    // Phase 2: generate AI testimonial quote from text answers
    setSubmitPhase("analyzing");
    const quote = await analyzeTestimonial(answers, prompts);
    setGeneratedQuote(quote);

    setSubmitting(false);
    setSubmitPhase("");
    setStep(3);
  }

  return (

              <textarea
                style={{ width: "100%", background: "#1a1a1a", border: "1.5px solid #2a2a2a", color: "#fff", borderRadius: 9, padding: "12px 14px", fontFamily: "DM Sans, sans-serif", fontSize: "0.9rem", resize: "vertical", minHeight: 80, outline: "none" }}
                placeholder="Type your answer here..."
                value={answers[selectedPrompt] || ""}
                onChange={e => setAnswers(prev => ({ ...prev, [selectedPrompt]: e.target.value }))}
              />
            </div>

            <button className="btn btn-gold" style={{ width: "100%", justifyContent: "center" }}
              onClick={() => setStep(2)}>
              Continue to Rating →

          </>
        )}

        {/* Step 2: Rating */}
        {step === 2 && (
          <>
            <div className="client-step">Step 3 of 3 — Rating</div>
            <div className="client-title" style={{ textAlign: "center" }}>How would you rate your experience?</div>
            <div className="client-sub" style={{ textAlign: "center", marginBottom: 28 }}>
              Your honest feedback means a lot.
            </div>
            <StarRating value={rating} onChange={setRating} />

            {submitting ? (
              <div>
                {submitPhase === "uploading" && hasVideos && (
                  <div className="upload-progress">
                    <div style={{ color: "#888", fontSize: "0.78rem", marginBottom: 12, textAlign: "center", textTransform: "uppercase", letterSpacing: "0.06em" }}>
                      Uploading videos…
                    </div>
                    {Object.keys(videoBlobs).map(idx => (
                      <div key={idx} className="upload-row">
                        <div className="upload-label">Q{Number(idx)+1}</div>
                        <div className="progress-track">
                          <div className="progress-fill" style={{ width: `${uploadProgress[idx] || 0}%` }} />
                        </div>
                        <div className="progress-pct">{uploadProgress[idx] || 0}%</div>
                      </div>
                    ))}
                  </div>
                )}
                {submitPhase === "analyzing" && (
                  <div className="ai-generating" style={{ justifyContent: "center", color: "#888" }}>
                    <div className="ai-spinner" style={{ borderTopColor: "var(--gold)", borderColor: "#333" }} />
                    Crafting your testimonial…
                  </div>
                )}
              </div>
            ) : (
              <button className="btn btn-gold" style={{ width: "100%", justifyContent: "center", marginTop: 8 }}
                disabled={!rating} onClick={handleSubmit}>
                Submit Testimonial ✦
              </button>
            )}
          </>
        )}

        {/* Step 3: Done */}
        {step === 3 && (
          <div className="success-screen">
            <div className="success-icon">🌟</div>
            <div className="success-title">Thank you, {name}!</div>
            <div className="success-sub" style={{ marginBottom: 24 }}>Your testimonial has been submitted and is being reviewed.</div>
            {generatedQuote && (
              <div style={{ background: "#111", border: "1px solid #2a2a2a", borderRadius: 12, padding: 20, textAlign: "left", marginBottom: 20 }}>

                <div style={{ fontFamily: "Instrument Serif, serif", fontSize: "1.05rem", fontStyle: "italic", color: "#ddd", lineHeight: 1.6 }}>
                  "{generatedQuote}"
                </div>

            )}
            <button className="btn btn-outline" style={{ color: "#888", borderColor: "#333" }} onClick={onBack}>
              ← Back to app
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ── AI: suggest clip ranges from quote ───────────────────────────────────────
async function suggestClips(quote, prompts) {
  const response = await fetch(ANTHROPIC_API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 600,
      messages: [{
        role: "user",
        content: `You are a video editor assistant. Given this testimonial quote and the questions asked, suggest 3 short social media clip titles with a one-sentence description of what moment to highlight.

Quote: "${quote}"
Questions: ${prompts.join(" | ")}

Respond ONLY with a JSON array of exactly 3 objects like:
[{"title":"Clip title","desc":"What to highlight","emoji":"🎯"}]
Use relevant emojis. No markdown, no explanation.`
      }]
    })
  });
  const data = await response.json();
  const text = data.content.map(b => b.text || "").join("");
  return JSON.parse(text.replace(/```json|```/g, "").trim());
}

// ── Video Editor ──────────────────────────────────────────────────────────────
const BRAND_COLORS = ["#c8a96e", "#e05c5c", "#5c9be0", "#5cb87a", "#9b5ce0", "#e08c5c"];

function VideoEditor({ testimonial, onClose }) {
  const quote = testimonial.quote || "";
  const prompts = testimonial.prompts || [];
  const videoURLs = testimonial.videoURLs || {};
  const firstVideoKey = Object.keys(videoURLs)[0];

  // ── State ──
  const [brand, setBrand] = useState({
    name: testimonial.name || "",
    company: testimonial.company || "",
    color: "#c8a96e",
    showLogo: true,
  });

  // Captions: split quote into ~5-word chunks with fake timestamps
  const [captions, setCaptions] = useState(() => {
    const words = quote.split(" ");
    const chunks = [];
    for (let i = 0; i < words.length; i += 6) {
      chunks.push({
        id: i,
        text: words.slice(i, i + 6).join(" "),
        start: i * 0.6,
      });
    }
    return chunks;
  });
  const [activeCaption, setActiveCaption] = useState(null);

  const [clips, setClips] = useState(null);
  const [loadingClips, setLoadingClips] = useState(false);
  const [activeClip, setActiveClip] = useState(null);
  const [exporting, setExporting] = useState(false);
  const [exportDone, setExportDone] = useState(false);

  // Canvas / video refs
  const canvasRef = useRef(null);
  const videoRef = useRef(null);
  const rafRef = useRef(null);
  const [playing, setPlaying] = useState(false);

  // ── Canvas renderer ──
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    canvas.width = 1080; canvas.height = 1920;

    function draw() {
      const video = videoRef.current;
      ctx.clearRect(0, 0, 1080, 1920);

      // Background
      ctx.fillStyle = "#0e0e0e";
      ctx.fillRect(0, 0, 1080, 1920);

      // Video frame (centre, letterboxed)
      if (video && video.readyState >= 2) {
        const vw = video.videoWidth || 1920;
        const vh = video.videoHeight || 1080;
        const scale = Math.min(1080 / vw, 1350 / vh);
        const dw = vw * scale; const dh = vh * scale;
        const dx = (1080 - dw) / 2; const dy = (1920 - dh) / 2 - 100;
        ctx.drawImage(video, dx, dy, dw, dh);
      } else {
        // Placeholder gradient
        const grad = ctx.createLinearGradient(0, 0, 0, 1350);
        grad.addColorStop(0, "#1a1a1a");
        grad.addColorStop(1, "#0e0e0e");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1080, 1350);
        ctx.fillStyle = "#2a2a2a";
        ctx.font = "bold 48px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🎥 Video Preview", 540, 660);
        ctx.font = "32px sans-serif";
        ctx.fillStyle = "#444";
        ctx.fillText("Connect Firebase Storage to see live video", 540, 720);
      }

      // Bottom branding bar
      const barY = 1480;
      ctx.fillStyle = "rgba(0,0,0,0.75)";
      ctx.fillRect(0, barY, 1080, 440);

      // Accent line
      ctx.fillStyle = brand.color;
      ctx.fillRect(0, barY, 1080, 6);

      // Active caption text
      const currentTime = video ? video.currentTime : 0;
      const activeCap = captions.find((c, i) => {
        const next = captions[i + 1];
        return currentTime >= c.start && (!next || currentTime < next.start);
      }) || captions[0];

      if (activeCap) {
        ctx.font = "bold 72px 'DM Sans', sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.8)";
        ctx.shadowBlur = 20;
        // Word wrap
        const words = activeCap.text.split(" ");
        let line = ""; const lines = []; const maxW = 900;
        for (const w of words) {
          const test = line ? line + " " + w : w;
          if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
          else line = test;
        }
        if (line) lines.push(line);
        lines.forEach((l, i) => ctx.fillText(l, 540, barY + 90 + i * 90));
        ctx.shadowBlur = 0;
      }

      // Name + company
      ctx.font = "bold 44px 'DM Sans', sans-serif";
      ctx.fillStyle = brand.color;
      ctx.textAlign = "left";
      ctx.fillText(brand.name, 60, barY + 300);
      ctx.font = "36px 'DM Sans', sans-serif";
      ctx.fillStyle = "#aaa";
      ctx.fillText(brand.company, 60, barY + 355);

      // Vouch watermark
      if (brand.showLogo) {
        ctx.font = "italic bold 34px serif";
        ctx.fillStyle = brand.color;
        ctx.textAlign = "right";
        ctx.fillText("Vouch✦", 1020, barY + 340);
      }

      rafRef.current = requestAnimationFrame(draw);
    }

    rafRef.current = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(rafRef.current);
  }, [brand, captions]);

  // ── Playback ──
  function togglePlay() {
    const v = videoRef.current;
    if (!v || !v.src) return;
    if (v.paused) { v.play(); setPlaying(true); }
    else { v.pause(); setPlaying(false); }
  }

  // ── Load AI clips ──
  async function loadClips() {
    setLoadingClips(true);
    try {
      const c = await suggestClips(quote, prompts);
      setClips(c);
      setActiveClip(0);
    } catch {
      setClips([
        { title: "The Key Result", desc: "Highlight the strongest outcome they mentioned", emoji: "🎯" },
        { title: "Before & After", desc: "Capture the contrast between their challenge and solution", emoji: "✨" },
        { title: "The Recommendation", desc: "Their direct endorsement for the camera", emoji: "🌟" },
      ]);
      setActiveClip(0);
    }
    setLoadingClips(false);
  }

  useEffect(() => { loadClips(); }, []);

  // ── Export (MediaRecorder on canvas) ──
  async function handleExport() {
    setExporting(true);
    const canvas = canvasRef.current;
    const video = videoRef.current;
    try {
      const stream = canvas.captureStream(30);
      const chunks = [];
      const mr = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp9" });
      mr.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      mr.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `${testimonial.name || "testimonial"}-vouch.webm`;
        a.click();
        URL.revokeObjectURL(url);
        setExporting(false);
        setExportDone(true);
        setTimeout(() => setExportDone(false), 3000);
      };
      mr.start();
      if (video && video.src) { video.currentTime = 0; video.play(); }
      // Record for video duration or 10s max
      const duration = (video && video.duration && isFinite(video.duration)) ? Math.min(video.duration * 1000, 30000) : 8000;
      setTimeout(() => { mr.stop(); if (video) { video.pause(); } }, duration);
    } catch {
      setExporting(false);
      alert("Export failed — your browser may not support canvas recording.");
    }
  }

  return (
    <div className="editor-overlay">
      {/* Hidden video element for canvas rendering */}
      {firstVideoKey && videoURLs[firstVideoKey] && (
        <video ref={videoRef} src={videoURLs[firstVideoKey]} crossOrigin="anonymous"
          style={{ display: "none" }} onEnded={() => setPlaying(false)} />
      )}

      {/* Nav */}
      <div className="editor-nav">
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <button className="btn btn-outline btn-sm" style={{ color: "#888", borderColor: "#333" }} onClick={onClose}>← Back</button>
          <div className="editor-title">Editing — {testimonial.name}</div>
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <button className="btn btn-outline btn-sm" style={{ color: "#888", borderColor: "#333" }} onClick={togglePlay}>
            {playing ? "⏸ Pause" : "▶ Play"}
          </button>
        </div>
      </div>

      <div className="editor-body">
        {/* Main column */}
        <div className="editor-main">

          {/* Canvas preview */}
          <div style={{ display: "flex", justifyContent: "center" }}>
            <div className="canvas-wrap" style={{ width: "min(100%, 240px)" }}>
              <canvas ref={canvasRef} />
            </div>
          </div>

          {/* Social clips */}
          <div>
            <div style={{ color: "#555", fontSize: "0.72rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 12 }}>
              AI Social Clips
            </div>
            {loadingClips ? (
              <div className="ai-generating" style={{ color: "#555" }}>
                <div className="ai-spinner" style={{ borderColor: "#2a2a2a", borderTopColor: "#c8a96e" }} />
                Analysing best moments…
              </div>
            ) : (
              <div className="clip-strip">
                {(clips || []).map((c, i) => (
                  <button key={i} className={`clip-pill ${activeClip === i ? "active" : ""}`}
                    onClick={() => setActiveClip(i)}>
                    {c.emoji} {c.title}
                  </button>
                ))}
              </div>
            )}
            {clips && activeClip !== null && clips[activeClip] && (
              <div style={{ marginTop: 12, padding: "12px 16px", background: "#111", border: "1px solid #1e1e1e", borderRadius: 8, color: "#888", fontSize: "0.85rem", lineHeight: 1.5 }}>
                {clips[activeClip].desc}
              </div>
            )}
          </div>

          {/* Captions */}
          <div>
            <div style={{ color: "#555", fontSize: "0.72rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 12 }}>
              Captions — click to edit
            </div>
            <div className="caption-list">
              {captions.map((cap, i) => (
                <div key={cap.id} className={`caption-row ${activeCaption === i ? "active" : ""}`}
                  onClick={() => setActiveCaption(i)}>
                  <div className="caption-time">{String(Math.floor(cap.start / 60)).padStart(2,"0")}:{String(Math.floor(cap.start % 60)).padStart(2,"0")}</div>
                  <textarea className="caption-text-input" rows={1}
                    value={cap.text}
                    onChange={e => setCaptions(prev => prev.map((c, j) => j === i ? { ...c, text: e.target.value } : c))}
                    onClick={e => e.stopPropagation()}
                  />
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Sidebar */}
        <div className="editor-sidebar">
          <div className="editor-sidebar-section">
            <div className="editor-sidebar-label">Branding</div>

            <div className="brand-row">
              <div className="brand-label">Name overlay</div>
              <input className="brand-input" value={brand.name}
                onChange={e => setBrand(b => ({ ...b, name: e.target.value }))}
                placeholder="Jane Smith" />
            </div>
            <div className="brand-row">
              <div className="brand-label">Company / title</div>
              <input className="brand-input" value={brand.company}
                onChange={e => setBrand(b => ({ ...b, company: e.target.value }))}
                placeholder="Acme Corp" />
            </div>
            <div className="brand-row">
              <div className="brand-label">Accent colour</div>
              <div className="color-row">
                {BRAND_COLORS.map(c => (
                  <div key={c} className={`color-swatch ${brand.color === c ? "active" : ""}`}
                    style={{ background: c }}
                    onClick={() => setBrand(b => ({ ...b, color: c }))} />
                ))}
                <input type="color" value={brand.color}
                  onChange={e => setBrand(b => ({ ...b, color: e.target.value }))}
                  style={{ width: 28, height: 28, border: "none", borderRadius: "50%", cursor: "pointer", padding: 0, background: "none" }} />
              </div>
            </div>
            <div className="brand-row" style={{ flexDirection: "row", alignItems: "center", justifyContent: "space-between", marginBottom: 0 }}>
              <div className="brand-label">Show Vouch watermark</div>
              <div style={{ position: "relative", width: 36, height: 20, cursor: "pointer" }}
                onClick={() => setBrand(b => ({ ...b, showLogo: !b.showLogo }))}>
                <div style={{ position: "absolute", inset: 0, background: brand.showLogo ? brand.color : "#2a2a2a", borderRadius: 99, transition: "background 0.2s" }} />
                <div style={{ position: "absolute", top: 3, left: brand.showLogo ? 18 : 3, width: 14, height: 14, background: "#fff", borderRadius: "50%", transition: "left 0.2s" }} />
              </div>
            </div>
          </div>

          <div className="editor-sidebar-section" style={{ flex: 1 }}>
            <div className="editor-sidebar-label">Testimonial Quote</div>
            <div style={{ color: "#888", fontSize: "0.85rem", lineHeight: 1.6, fontStyle: "italic", fontFamily: "Instrument Serif, serif" }}>
              "{quote}"
            </div>
            <div style={{ marginTop: 16, color: "#555", fontSize: "0.8rem" }}>
              ★★★★★ · {testimonial.campaign || "Campaign"}
            </div>
          </div>

          <button className="export-btn" onClick={handleExport} disabled={exporting}>
            {exporting ? "⏳ Exporting…" : exportDone ? "✓ Downloaded!" : "⬇ Export Video"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Video Playback Modal ──────────────────────────────────────────────────────

  const videoURLs = testimonial.videoURLs || {};
  const keys = Object.keys(videoURLs);
  const [activeIdx, setActiveIdx] = useState(keys[0] || null);
  const prompts = testimonial.prompts || [];

  if (keys.length === 0) return null;

  return (
    <div className="video-modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="video-modal">
        <div className="video-modal-header">
          <div className="video-modal-title">
            {testimonial.name} — Video Responses
          </div>
          <button className="btn btn-outline btn-sm" onClick={onClose} style={{ border: "1px solid #333", color: "#888" }}>✕</button>
        </div>

        {keys.length > 1 && (
          <div className="video-clip-tabs">
            {keys.map(idx => (
              <button key={idx} className={`video-clip-tab ${activeIdx === idx ? "active" : ""}`}
                onClick={() => setActiveIdx(idx)}>
                Q{Number(idx)+1}
                {prompts[idx] && <span style={{ display: "block", fontSize: "0.72rem", opacity: 0.7, maxWidth: 120, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{prompts[idx]}</span>}
              </button>
            ))}
          </div>
        )}

        {activeIdx !== null && videoURLs[activeIdx] && (
          <video key={activeIdx} src={videoURLs[activeIdx]} controls autoPlay
            style={{ width: "100%", borderRadius: 10, background: "#000" }} />
        )}

        {prompts[activeIdx] && (
          <div style={{ marginTop: 14, color: "#888", fontSize: "0.85rem", lineHeight: 1.5 }}>
            <span style={{ color: "var(--gold)", fontWeight: 600 }}>Q: </span>{prompts[activeIdx]}
          </div>
        )}
      </div>
    </div>
  );
}

function Dashboard({ onPreview, userId }) {
  const [innerTab, setInnerTab] = useState("campaigns");
  const [inviteTarget, setInviteTarget] = useState(null);
  const [playbackTarget, setPlaybackTarget] = useState(null);
  const [editTarget, setEditTarget] = useState(null);
  // In production these would be fetched from Firestore filtered by userId.
  // For now we seed per-user state from localStorage so data persists across sessions.
  const storageKey = `vouch_campaigns_${userId}`;
  const testimonialsKey = `vouch_testimonials_${userId}`;

  const [campaigns, setCampaigns] = useState(() => {
    try { return JSON.parse(localStorage.getItem(storageKey)) || []; } catch { return []; }
  });
  const [testimonials, setTestimonials] = useState(() => {
    try { return JSON.parse(localStorage.getItem(testimonialsKey)) || MOCK_TESTIMONIALS; } catch { return MOCK_TESTIMONIALS; }
  });

  useEffect(() => {
    try { localStorage.setItem(storageKey, JSON.stringify(campaigns)); } catch {}
  }, [campaigns, storageKey]);

  useEffect(() => {
    try { localStorage.setItem(testimonialsKey, JSON.stringify(testimonials)); } catch {}
  }, [testimonials, testimonialsKey]);
  const [showCreate, setShowCreate] = useState(false);

  // New campaign form
  const [form, setForm] = useState({ name: "", companyName: "", industry: "", context: "" });
  const [prompts, setPrompts] = useState([]);
  const [generating, setGenerating] = useState(false);
  const [copiedId, setCopiedId] = useState(null);

  async function handleGenerate() {
    if (!form.companyName || !form.industry) return;
    setGenerating(true);
    try {
      const p = await generatePrompts(form.companyName, form.industry, form.context);
      setPrompts(p);
    } catch {
      setPrompts([
        "What challenge brought you to us, and what made you decide to reach out?",
        "What results or changes have you noticed since working with us?",
        "Was there a specific moment that stood out to you during our work together?",
        "What would you tell a friend or colleague who was considering working with us?"
      ]);
    }
    setGenerating(false);
  }

  function saveCampaign() {
    const c = { id: Date.now(), ...form, prompts };
    setCampaigns(prev => [...prev, c]);
    setForm({ name: "", companyName: "", industry: "", context: "" });
    setPrompts([]);
    setShowCreate(false);
  }

  function copyLink(id) {
    setCopiedId(id);
    setTimeout(() => setCopiedId(null), 2000);
  }

  return (
    <div className="dashboard">
      {inviteTarget && <InviteModal campaign={inviteTarget} onClose={() => setInviteTarget(null)} />}
      {playbackTarget && <VideoPlaybackModal testimonial={playbackTarget} onClose={() => setPlaybackTarget(null)} />}
      {editTarget && <VideoEditor testimonial={editTarget} onClose={() => setEditTarget(null)} />}
      <div className="dash-header">
        <div className="dash-title serif">Your Dashboard</div>
        <div className="dash-subtitle">Manage campaigns and review incoming testimonials</div>
      </div>

      <div className="stats-row">
        <div className="stat-card">
          <div className="stat-num serif">{campaigns.length}</div>
          <div className="stat-label">Active Campaigns</div>
        </div>
        <div className="stat-card">
          <div className="stat-num serif">{testimonials.length}</div>
          <div className="stat-label">Testimonials Received</div>
        </div>
        <div className="stat-card">
          <div className="stat-num serif">{testimonials.filter(t => t.status === "approved").length}</div>
          <div className="stat-label">Approved & Ready</div>
        </div>
      </div>

      <div className="tabs-inner">
        {["campaigns", "testimonials"].map(t => (
          <button key={t} className={`tab-inner ${innerTab === t ? "active" : ""}`} onClick={() => setInnerTab(t)}>
            {t === "campaigns" ? "📋 Campaigns" : "⭐ Testimonials"}
          </button>
        ))}
      </div>

      {/* Campaigns tab */}
      {innerTab === "campaigns" && (
        <>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
            <div className="section-title serif" style={{ margin: 0 }}>Campaigns</div>
            <button className="btn btn-primary" onClick={() => setShowCreate(!showCreate)}>
              {showCreate ? "✕ Cancel" : "+ New Campaign"}
            </button>
          </div>

          {showCreate && (
            <div className="campaign-card" style={{ border: "1.5px solid var(--gold)" }}>
              <div style={{ fontWeight: 600, marginBottom: 20, fontSize: "1.05rem" }}>Create New Campaign</div>
              <div className="form-row">
                <div className="field">
                  <label>Campaign Name</label>
                  <input value={form.name} onChange={e => setForm(p => ({ ...p, name: e.target.value }))} placeholder="e.g. Q1 Social Proof" />
                </div>
                <div className="field">
                  <label>Your Business Name</label>
                  <input value={form.companyName} onChange={e => setForm(p => ({ ...p, companyName: e.target.value }))} placeholder="e.g. Acme Agency" />
                </div>
              </div>
              <div className="field" style={{ marginBottom: 16 }}>
                <label>Industry / Niche</label>
                <input value={form.industry} onChange={e => setForm(p => ({ ...p, industry: e.target.value }))} placeholder="e.g. Digital Marketing Agency" />
              </div>
              <div className="field" style={{ marginBottom: 20 }}>
                <label>Extra context (optional)</label>
                <textarea rows={2} value={form.context} onChange={e => setForm(p => ({ ...p, context: e.target.value }))}
                  placeholder="What service did customers use? What results do you want them to talk about?" />
              </div>

              {/* Template picker */}
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: "0.82rem", fontWeight: 600, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>
                  Start with a template
                </div>
                <div className="template-grid">
                  {PROMPT_TEMPLATES.map((t, i) => (
                    <button key={i} className={`template-chip ${prompts.length > 0 && JSON.stringify(prompts) === JSON.stringify(t.prompts) ? "active" : ""}`}
                      onClick={() => setPrompts(t.prompts)}>
                      {t.emoji} {t.label}
                    </button>
                  ))}
                </div>
              </div>

              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 4 }}>
                <button className="btn btn-gold" onClick={handleGenerate}
                  disabled={generating || !form.companyName || !form.industry}>
                  {generating ? <><span className="loading-dots">✦ Generating</span></> : "✦ Generate with AI"}
                </button>
                <span style={{ color: "var(--muted)", fontSize: "0.8rem" }}>or pick a template above</span>
              </div>

              {generating && (
                <div className="ai-generating"><div className="ai-spinner" /> AI is crafting questions for your business…</div>
              )}

              {prompts.length > 0 && (
                <>
                  <div style={{ marginTop: 20, marginBottom: 8, fontWeight: 600, fontSize: "0.88rem" }}>Generated Questions — click to edit</div>
                  <div className="prompts-box">
                    {prompts.map((p, i) => (
                      <div key={i} className="prompt-item">
                        <div className="prompt-num">{i + 1}</div>
                        <div className="prompt-text">
                          <input value={p} onChange={e => setPrompts(prev => prev.map((q, j) => j === i ? e.target.value : q))} />
                        </div>
                      </div>
                    ))}
                  </div>
                  <button className="btn btn-primary" style={{ marginTop: 20 }}
                    disabled={!form.name} onClick={saveCampaign}>
                    Save Campaign →
                  </button>
                  {!form.name && <span style={{ color: "var(--muted)", fontSize: "0.82rem", marginLeft: 12 }}>Add a campaign name to save</span>}
                </>
              )}
            </div>
          )}

          <div className="testimonials-grid">
            {campaigns.map(c => (
              <div key={c.id} className="campaign-card" style={{ display: "block" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                  <div>
                    <div style={{ fontWeight: 600, marginBottom: 3 }}>{c.name}</div>
                    <div style={{ color: "var(--muted)", fontSize: "0.82rem" }}>{c.companyName} · {c.industry}</div>
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button className="btn btn-outline btn-sm" onClick={() => onPreview(c)}>Preview</button>
                    <button className="btn btn-gold btn-sm" onClick={() => setInviteTarget(c)}>✉ Invite Client</button>
                    <button className="btn btn-primary btn-sm" onClick={() => copyLink(c.id)}>
                      {copiedId === c.id ? "✓ Copied!" : "Copy Link"}

                  </div>
                </div>
                <div style={{ color: "var(--muted)", fontSize: "0.8rem", marginBottom: 10 }}>{c.prompts.length} questions</div>
                <div className="link-box">
                  <span className="link-url">vouch.app/record/{c.id}</span>
                </div>

            ))}

        </>
      )}

      {/* Testimonials tab */}
      {innerTab === "testimonials" && (
        <>
          <div className="section-title serif">Received Testimonials</div>
          {testimonials.length === 0 ? (
            <div className="empty-state">
              <div className="empty-icon">💬</div>
              <div className="empty-title">No testimonials yet</div>

            <div className="testimonials-grid">
              {testimonials.map(t => (
                <div key={t.id} className="testimonial-card">
                  <div>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
                      <div className="t-name">{t.name}</div>
                      <span className={`badge badge-${t.status}`}>{t.status}</span>
                    </div>
                    <div className="t-company">{t.company} · {t.campaign}</div>
                    <div className="t-stars">{"★".repeat(t.rating)}{"☆".repeat(5 - t.rating)}</div>
                    <div className="t-quote">"{t.quote}"</div>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {t.status === "new" && (

                      <button className="btn btn-sm btn-gold" onClick={() => setEditTarget(t)}>
                        ✂ Edit

                    {t.videoURLs && Object.keys(t.videoURLs).length > 0 && (
                      <button className="btn btn-sm btn-primary" onClick={() => setPlaybackTarget(t)}>
                        ▶ Watch
                      </button>
                    )}
                    <button className="btn btn-sm btn-outline">Export</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── Auth Screen ───────────────────────────────────────────────────────────────
function AuthScreen({ auth }) {
  const [mode, setMode] = useState("login"); // "login" | "signup" | "reset"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [resetSent, setResetSent] = useState(false);

  async function handleSubmit() {
    setError(""); setLoading(true);
    try {
      if (mode === "login") await signIn(auth, email, password);
      else if (mode === "signup") await signUp(auth, email, password);
      else {
        await sendPasswordReset(auth, email);
        setResetSent(true);
      }
    } catch (e) {
      setError(friendlyAuthError(e.code));
    }
    setLoading(false);
  }

  function switchMode(m) {
    setMode(m); setError(""); setResetSent(false);
  }

  const isReset = mode === "reset";
  const isSignup = mode === "signup";

  return (
    <div className="auth-page">
      {/* Left panel — brand / testimonial */}
      <div className="auth-panel">
        <div className="auth-panel-bg" />
        <div className="auth-panel-logo">Vouch✦</div>
        <div className="auth-panel-quote">
          <div className="auth-panel-stars">★★★★★</div>
          <div className="auth-panel-q">
            "We went from chasing testimonials to having a consistent stream of polished video proof — in weeks."
          </div>
          <div className="auth-panel-attr">— James R., Founder at Clearpath Agency</div>
        </div>
      </div>

      {/* Right panel — form */}
      <div className="auth-form-side">
        <div className="auth-form-box">
          <div className="auth-title">
            {isReset ? "Reset password" : isSignup ? "Create account" : "Welcome back"}
          </div>
          <div className="auth-sub">
            {isReset
              ? "We'll email you a link to reset your password."
              : isSignup
              ? "Start collecting video testimonials that actually convert."
              : "Sign in to your Vouch dashboard."}
          </div>

          {error && <div className="auth-error">⚠ {error}</div>}
          {resetSent && <div className="auth-success">✓ Reset link sent — check your inbox.</div>}

          <div className="field" style={{ marginBottom: 14 }}>
            <label>Email</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)}
              placeholder="you@company.com"
              onKeyDown={e => e.key === "Enter" && !isReset && handleSubmit()} />
          </div>

          {!isReset && (
            <div className="field" style={{ marginBottom: isSignup ? 20 : 8 }}>
              <label>Password</label>
              <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                placeholder={isSignup ? "Min. 6 characters" : "••••••••"}
                onKeyDown={e => e.key === "Enter" && handleSubmit()} />
            </div>
          )}

          {mode === "login" && (
            <div className="auth-forgot">
              <button onClick={() => switchMode("reset")}>Forgot password?</button>
            </div>
          )}

          <button className="btn btn-primary" style={{ width: "100%", justifyContent: "center", marginBottom: 8 }}
            disabled={loading || (!email) || (!isReset && !password)}
            onClick={handleSubmit}>
            {loading ? "Please wait…" : isReset ? "Send reset link" : isSignup ? "Create account" : "Sign in"}
          </button>

          <div className="auth-switch">
            {isReset ? (
              <><span>Remembered it? </span><button onClick={() => switchMode("login")}>Back to sign in</button></>
            ) : isSignup ? (
              <><span>Already have an account? </span><button onClick={() => switchMode("login")}>Sign in</button></>
            ) : (
              <><span>Don't have an account? </span><button onClick={() => switchMode("signup")}>Sign up free</button></>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── User Menu (nav dropdown) ──────────────────────────────────────────────────
function UserMenu({ user, auth }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const initials = user.email ? user.email[0].toUpperCase() : "?";

  useEffect(() => {
    function handler(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  return (
    <div className="user-menu" ref={ref}>
      <button className="user-btn" onClick={() => setOpen(v => !v)}>
        <div className="user-avatar">{initials}</div>
        <span style={{ maxWidth: 140, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
          {user.email}
        </span>
        <span style={{ color: "var(--muted)", fontSize: "0.7rem" }}>{open ? "▲" : "▼"}</span>
      </button>
      {open && (
        <div className="user-dropdown">
          <div className="user-dropdown-email">{user.email}</div>
          <button className="user-dropdown-item danger" onClick={() => { setOpen(false); signOut(auth); }}>
            Sign out
          </button>
        </div>
      )}
    </div>
  );
}

                {p.features.map((f, fi) => (
                  <div key={fi} style={{ display: "flex", gap: 10, alignItems: "flex-start", fontSize: "0.88rem", color: p.popular ? "#ccc" : "#333" }}>
                    <span style={{ width: 18, height: 18, borderRadius: "50%", background: p.popular ? "#1e1e1e" : "var(--gold-pale, #fdf6e8)", color: "var(--gold)", fontSize: "0.62rem", fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 1 }}>✓</span>
                    {f}
                  </div>
                ))}
              </div>
              <button className="btn" style={{
                width: "100%", justifyContent: "center",
                background: p.popular ? "var(--gold)" : "transparent",
                color: p.popular ? "#fff" : "var(--ink)",
                border: p.popular ? "none" : "1.5px solid var(--border)",
              }} onClick={onGetStarted}>
                {p.id === "agency" ? "Talk to Us" : "Get Started"}
              </button>
            </div>
          </div>
        ))}
      </div>

      {/* Guarantee */}
      <div style={{ textAlign: "center", padding: "20px 24px 60px", color: "var(--muted)", fontSize: "0.85rem" }}>
        🛡 30-day money-back guarantee · No contracts · Cancel anytime
      </div>
    </div>
  );
}

function App() {
  const { user, auth, storage, loading } = useAuth();
  const [demoMode, setDemoMode] = useState(false);
  const [view, setView] = useState("pricing"); // start on pricing
  const [previewCampaign, setPreviewCampaign] = useState(null);

  const activeUser = demoMode ? DEMO_USER : user;

  function handlePreview(campaign) {
    setPreviewCampaign(campaign);
    setView("client");
  }

  // Loading state
  if (loading && !demoMode) {
    return (
      <>
        <style>{style}</style>
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "var(--paper)" }}>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontFamily: "Instrument Serif, serif", fontSize: "1.8rem", color: "var(--gold)", fontStyle: "italic", marginBottom: 24 }}>Vouch✦</div>
            <div className="ai-spinner" style={{ margin: "0 auto 24px", borderTopColor: "#c8a96e", borderColor: "#ddd8cc" }} />
            <div style={{ color: "var(--muted)", fontSize: "0.85rem", marginBottom: 20 }}>Connecting…</div>
            <button className="btn btn-gold" onClick={() => setDemoMode(true)}>Try Demo Instead →</button>
          </div>
        </div>
      </>
    );
  }

  // Pricing page (unauthenticated landing)
  if (!activeUser && view === "pricing") {
    return (
      <>
        <style>{style}</style>
        <InAppPricing onGetStarted={() => setView("auth")} />
        <div style={{ position: "fixed", bottom: 20, right: 20, zIndex: 50 }}>
          <button className="btn btn-gold btn-sm" onClick={() => setDemoMode(true)}>✦ Try Demo</button>
        </div>
      </>
    );
  }

  // Auth screen
  if (!activeUser) {
    return (
      <>
        <style>{style}</style>
        <div style={{ position: "relative" }}>
          <AuthScreen auth={auth} />
          <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", zIndex: 50, display: "flex", gap: 10 }}>
            <button className="btn btn-outline" style={{ background: "var(--paper)", fontSize: "0.82rem" }} onClick={() => setView("pricing")}>← Pricing</button>
            <button className="btn btn-outline" style={{ background: "var(--paper)", fontSize: "0.82rem" }} onClick={() => setDemoMode(true)}>✦ Skip — try demo</button>
          </div>
        </div>
      </>
    );
  }

  // Signed in — show app
  return (
    <>
      <style>{style}</style>
      <div className="app">
        {view === "client" ? (
          <ClientPage campaign={previewCampaign} onBack={() => { setView("dashboard"); setPreviewCampaign(null); }} storage={storage} userId={activeUser.uid} />
        ) : (
          <>
            <nav className="nav">
              <div className="nav-logo serif">Vouch<span>✦</span></div>
              <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                <div className="nav-tabs">
                  <button className={`nav-tab ${view === "dashboard" ? "active" : ""}`} onClick={() => setView("dashboard")}>Dashboard</button>
                  <button className="nav-tab" onClick={() => handlePreview(null)}>Client View</button>
                </div>
                {demoMode ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: "0.75rem", color: "var(--muted)", background: "var(--cream)", padding: "4px 10px", borderRadius: 20 }}>Demo mode</span>
                    <button className="btn btn-outline btn-sm" onClick={() => { setDemoMode(false); setView("auth"); }}>Sign in</button>
                  </div>
                ) : (
                  <UserMenu user={activeUser} auth={auth} />
                )}
              </div>
            </nav>
            <Dashboard onPreview={handlePreview} userId={activeUser.uid} />
          </>
        )}
      </div>
    </>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
