        </div>

        <span className="hiw-divider" data-reveal />

        {/* Step 3 */}
        <div className="hiw-step" data-reveal>
          <div className="hiw-step-num-col">
            <div className="hiw-num" data-num="03" aria-hidden="true">03</div>
          </div>
          <div className="hiw-step-content">
            <div className="hiw-icon">✨</div>
            <div className="hiw-step-title">You get polished clips</div>
            <div className="hiw-step-desc">
              We edit, caption, and brand the raw footage. You receive multiple ready-to-use clips formatted for your website, LinkedIn, Instagram, and paid ads.
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 4 }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--gold)", display: "inline-block", flexShrink: 0 }} />
              <span style={{ fontSize: "0.82rem", color: "var(--muted)" }}>Delivered within 5 business days</span>
            </div>
          </div>
        </div>
      </div>

      {/* ── Demo Video Placeholder ── */}
      <div className="demo-section" data-reveal>
        <div className="demo-card">
          <div className="demo-badge">60-second walkthrough</div>
          <div className="demo-play">
            <button className="demo-play-btn" aria-label="Watch demo">
              <div className="demo-play-triangle" />
            </button>
            <div>
              <div className="demo-label">Watch a 60-second walkthrough</div>
              <div className="demo-sub">See how Vouch works from invite to polished clip</div>
            </div>
          </div>
        </div>
      </div>

      {/* ── Pricing heading ── */}
      <div style={{ textAlign: "center", padding: "0 24px 32px" }} data-reveal>
        <div style={{ fontFamily: "Instrument Serif, serif", fontSize: "clamp(1.6rem, 4vw, 2.4rem)", lineHeight: 1.15, letterSpacing: "-0.02em", marginBottom: 8 }}>
          Simple, transparent <em style={{ color: "var(--gold)", fontStyle: "italic" }}>pricing</em>
        </div>
        <div style={{ color: "var(--muted)", fontSize: "0.95rem" }}>No hidden fees. Cancel anytime.</div>
      </div>

      {/* Plans */}
      <div style={{ maxWidth: 960, margin: "0 auto", padding: "0 20px 60px", display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 16, alignItems: "start" }}>
        {plans.map((p, i) => (
          <div key={p.id} style={{
            background: p.popular ? "var(--ink)" : "var(--card)",
            border: p.popular ? "2px solid var(--gold)" : "1px solid var(--border)",
            borderRadius: 18, overflow: "hidden",
            transform: p.popular ? "scale(1.03)" : "none",
            boxShadow: p.popular ? "0 12px 40px rgba(0,0,0,0.18)" : "none",
          }}>
            {p.popular && (
              <div style={{ background: "var(--gold)", color: "#fff", textAlign: "center", padding: "7px", fontSize: "0.72rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em" }}>
                ✦ Most Popular
              </div>
            )}
            <div style={{ padding: "28px 24px" }}>
              <div style={{ fontSize: "0.72rem", fontWeight: 700, color: p.popular ? "#888" : "var(--muted)", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 8 }}>{p.name}</div>
              <div style={{ fontFamily: "Instrument Serif, serif", fontSize: "2.8rem", fontWeight: 600, color: p.popular ? "#fff" : "var(--ink)", lineHeight: 1, marginBottom: 4 }}>
                {fmtPrice(p.base, cur)}
              </div>
              <div style={{ fontSize: "0.8rem", color: p.popular ? "#666" : "var(--muted)", marginBottom: 20, paddingBottom: 20, borderBottom: `1px solid ${p.popular ? "#2a2a2a" : "var(--border)"}` }}>
                per month
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 24 }}>
                {p.features.map((f, fi) => (
                  <div key={fi} style={{ display: "flex", gap: 10, alignItems: "flex-start", fontSize: "0.88rem", color: p.popular ? "#ccc" : "#333" }}>
                    <span style={{ width: 18, height: 18, borderRadius: "50%", background: p.popular ? "#1e1e1e" : "var(--gold-pale, #fdf6e8)", color: "var(--gold)", fontSize: "0.62rem", fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 1 }}>✓</span>
                    {f}
                  </div>
                ))}
              </div>
              <button className="btn" style={{
                width: "100%", justifyContent: "center",
                background: p.popular ? "var(--gold)" : "transparent",
                color: p.popular ? "#fff" : "var(--ink)",
                border: p.popular ? "none" : "1.5px solid var(--border)",
              }} onClick={onGetStarted}>
                {p.id === "agency" ? "Talk to Us" : "Get Started"}
              </button>
            </div>
          </div>
        ))}
      </div>

      {/* Guarantee */}
      <div style={{ textAlign: "center", padding: "20px 24px 60px", color: "var(--muted)", fontSize: "0.85rem" }}>
        🛡 30-day money-back guarantee · No contracts · Cancel anytime
      </div>
    </div>
  );
}

function App() {
  const { user, auth, storage, db, loading } = useAuth();
  const [demoMode, setDemoMode] = useState(false);
  const [view, setView] = useState("pricing"); // start on pricing
  const [previewCampaign, setPreviewCampaign] = useState(null);

  // Public recording route — must be declared before any conditional returns
  const recordCampaignId = window.location.pathname.match(/^\/record\/([^/]+)/)?.[1] || null;
  const [recordCampaign, setRecordCampaign] = useState(undefined); // undefined = loading

  useEffect(() => {
    if (!recordCampaignId || !db) return;
    db.collectionGroup("campaigns")
      .where("id", "==", recordCampaignId)
      .limit(1)
      .get()
      .then(snap => {
        if (snap.empty) {
          setRecordCampaign({ id: recordCampaignId, name: "Testimonial", prompts: [] });
          return;
        }
        const doc = snap.docs[0];
        const data = doc.data();
        // Derive ownerId from the Firestore path users/{ownerId}/campaigns/{campaignId}
        // This is authoritative — works even if the ownerId field was never stored
        const pathOwnerId = doc.ref.parent?.parent?.id;
        setRecordCampaign({ ...data, ownerId: data.ownerId || pathOwnerId || null });
      })
      .catch(() => setRecordCampaign({ id: recordCampaignId, name: "Testimonial", prompts: [] }));
  }, [recordCampaignId, db]);

  if (recordCampaignId) {
    if (recordCampaign === undefined) {
      return (
        <>
          <style>{style}</style>
          <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#0a0a0a" }}>
            <div className="ai-spinner" style={{ borderTopColor: "#c8a96e", borderColor: "#333" }} />
          </div>
        </>
      );
    }
    return (
      <>
        <style>{style}</style>
        <ClientPage campaign={recordCampaign} onBack={null} storage={storage} userId={null} db={db} />
      </>
    );
  }

  const activeUser = demoMode ? DEMO_USER : user;

  function handlePreview(campaign) {
    setPreviewCampaign(campaign);
    setView("client");
  }

  // Loading state
  if (loading && !demoMode) {
    return (
      <>
        <style>{style}</style>
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "var(--paper)" }}>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontFamily: "Instrument Serif, serif", fontSize: "1.8rem", color: "var(--gold)", fontStyle: "italic", marginBottom: 24 }}>Vouch✦</div>
            <div className="ai-spinner" style={{ margin: "0 auto 24px", borderTopColor: "#c8a96e", borderColor: "#ddd8cc" }} />
            <div style={{ color: "var(--muted)", fontSize: "0.85rem", marginBottom: 20 }}>Connecting…</div>
            <button className="btn btn-gold" onClick={() => setDemoMode(true)}>Try Demo Instead →</button>
          </div>
        </div>
      </>
    );
  }

  // Pricing page (unauthenticated landing)
  if (!activeUser && view === "pricing") {
    return (
      <>
        <style>{style}</style>
        <InAppPricing onGetStarted={() => setView("auth")} />
        <div style={{ position: "fixed", bottom: 20, right: 20, zIndex: 50 }}>
          <button className="btn btn-gold btn-sm" onClick={() => setDemoMode(true)}>✦ Try Demo</button>
        </div>
      </>
    );
  }

  // Auth screen
  if (!activeUser) {
    return (
      <>
        <style>{style}</style>
        <div style={{ position: "relative" }}>
          <AuthScreen auth={auth} />
          <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", zIndex: 50, display: "flex", gap: 10 }}>
            <button className="btn btn-outline" style={{ background: "var(--paper)", fontSize: "0.82rem" }} onClick={() => setView("pricing")}>← Pricing</button>
            <button className="btn btn-outline" style={{ background: "var(--paper)", fontSize: "0.82rem" }} onClick={() => setDemoMode(true)}>✦ Skip — try demo</button>
          </div>
        </div>
      </>
    );
  }

  // Signed in — show app
  return (
    <>
      <style>{style}</style>
      <div className="app">
        {view === "pricing" ? (
          <>
            <div style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 100, background: "var(--paper)", borderBottom: "1px solid var(--border)", padding: "12px 20px" }}>
              <button className="btn btn-outline btn-sm" onClick={() => setView("dashboard")}>← Back to Dashboard</button>
            </div>
            <div style={{ paddingTop: 56 }}>
              <InAppPricing onGetStarted={() => setView("dashboard")} />
            </div>
          </>
        ) : view === "client" ? (
          <ClientPage campaign={previewCampaign} onBack={() => { setView("dashboard"); setPreviewCampaign(null); }} storage={storage} userId={activeUser.uid} db={db} />
        ) : (
          <>
            <nav className="nav">
              <div className="nav-logo serif">Vouch<span>✦</span></div>
              <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                <div className="nav-tabs">
                  <button className={`nav-tab ${view === "dashboard" ? "active" : ""}`} onClick={() => setView("dashboard")}>Dashboard</button>
                  <button className="nav-tab" onClick={() => handlePreview(null)}>Client View</button>
                </div>
                {demoMode ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: "0.75rem", color: "var(--muted)", background: "var(--cream)", padding: "4px 10px", borderRadius: 20 }}>Demo mode</span>
                    <button className="btn btn-outline btn-sm" onClick={() => { setDemoMode(false); setView("auth"); }}>Sign in</button>
                  </div>
                ) : (
                  <UserMenu user={activeUser} auth={auth} />
                )}
              </div>
            </nav>
            <Dashboard onPreview={handlePreview} userId={activeUser.uid} db={db} onUpgrade={() => setView("pricing")} />
          </>
        )}
      </div>
    </>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
