<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vouch Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #c8a96e;
      --bg: #0e0e0e;
      --card: #141414;
      --border: #222;
      --ink: #f0ece4;
      --muted: #888;
    }
    body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

    /* ── Header ── */
    .profile-hero { max-width: 860px; margin: 0 auto; padding: 56px 24px 36px; text-align: center; }
    .profile-wordmark {
      font-family: 'Instrument Serif', serif; font-size: 1.1rem; color: var(--gold);
      letter-spacing: 0.04em; margin-bottom: 44px; display: block;
    }
    .profile-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, #c8a96e 0%, #a07040 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 700; color: #fff;
      margin: 0 auto 20px; font-family: 'Instrument Serif', serif;
    }
    .profile-company { font-family: 'Instrument Serif', serif; font-size: 2rem; margin-bottom: 10px; }
    .verified-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: #0d2e1a; border: 1px solid #2a6a3a; color: #6dbf8a;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em;
      padding: 4px 12px; border-radius: 20px; text-transform: uppercase; margin-bottom: 32px;
    }

    /* ── Score block ── */
    .score-hero {
      display: flex; align-items: center; justify-content: center; gap: 32px; flex-wrap: wrap;
      background: linear-gradient(135deg, #1a1710 0%, #141414 100%);
      border: 1px solid #c8a96e44; border-radius: 20px;
      padding: 32px 40px; margin: 0 24px 48px;
      max-width: 860px; margin-left: auto; margin-right: auto;
      position: relative; overflow: hidden;
    }
    .score-hero::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at top right, #c8a96e12 0%, transparent 65%);
      pointer-events: none;
    }
    .score-big { font-family: 'Instrument Serif', serif; font-size: 5rem; line-height: 1; color: var(--gold); }
    .score-star { font-size: 2.5rem; line-height: 1; }
    .score-meta-title { font-size: 0.7rem; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 6px; }
    .score-meta-count { font-size: 1rem; color: var(--muted); margin-bottom: 16px; }
    .rating-bars { width: 200px; }
    .rating-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .rating-row-label { font-size: 0.78rem; color: var(--muted); width: 18px; text-align: right; flex-shrink: 0; }
    .rating-track { flex: 1; height: 7px; background: #222; border-radius: 4px; overflow: hidden; }
    .rating-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.6s ease; }
    .rating-row-count { font-size: 0.72rem; color: var(--muted); width: 16px; flex-shrink: 0; }

    /* ── Sections ── */
    .section-wrap { max-width: 860px; margin: 0 auto; padding: 0 24px 56px; }
    .section-heading { font-family: 'Instrument Serif', serif; font-size: 1.5rem; margin-bottom: 20px; }

    /* ── Featured video ── */
    .featured-video-wrap {
      border-radius: 16px; overflow: hidden; background: #000;
      position: relative; margin-bottom: 12px;
      aspect-ratio: 16/9;
    }
    .featured-video-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .featured-caption {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px; margin-bottom: 48px;
    }
    .featured-name { font-weight: 700; font-size: 0.95rem; }
    .featured-company { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .featured-stars { color: var(--gold); font-size: 1rem; letter-spacing: 1px; }

    /* ── Testimonial grid ── */
    .t-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (max-width: 620px) { .t-grid { grid-template-columns: 1fr; } }

    .t-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
      transition: border-color 0.18s, transform 0.18s;
    }
    .t-card:hover { border-color: #c8a96e55; transform: translateY(-2px); }

    /* Video thumbnail */
    .t-thumb {
      position: relative; background: #0a0a0a; aspect-ratio: 16/9;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .t-thumb-video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .t-thumb-placeholder {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #141414 0%, #0e0e0e 100%);
    }
    .play-btn {
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(200,169,110,0.18); border: 2px solid rgba(200,169,110,0.5);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.18s, transform 0.18s;
    }
    .t-card:hover .play-btn { background: rgba(200,169,110,0.35); transform: scale(1.08); }
    .play-icon { color: var(--gold); font-size: 1.3rem; margin-left: 3px; line-height: 1; }

    /* Card body */
    .t-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .t-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .t-name { font-weight: 700; font-size: 0.92rem; line-height: 1.2; }
    .t-company { font-size: 0.77rem; color: var(--muted); margin-top: 2px; }
    .t-stars { color: var(--gold); font-size: 0.85rem; letter-spacing: 0.5px; flex-shrink: 0; }
    .t-quote {
      font-family: 'Instrument Serif', serif; font-size: 0.97rem; font-style: italic;
      color: #bbb; line-height: 1.6;
    }
    .t-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 4px; }
    .t-verified {
      font-size: 0.7rem; font-weight: 700; color: #6dbf8a;
      display: flex; align-items: center; gap: 3px; letter-spacing: 0.04em;
    }
    .t-campaign { font-size: 0.72rem; color: #444; }

    /* ── Video modal ── */
    .vmodal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 16px;
      animation: fadeIn 0.18s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .vmodal {
      background: #111; border: 1px solid #2a2a2a; border-radius: 18px;
      width: 100%; max-width: 720px; overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.8);
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .vmodal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid #1e1e1e;
    }
    .vmodal-name { font-weight: 700; font-size: 1rem; }
    .vmodal-company { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .vmodal-close {
      width: 34px; height: 34px; border-radius: 50%; background: #1e1e1e; border: none;
      color: #888; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0; transition: background 0.15s, color 0.15s;
    }
    .vmodal-close:hover { background: #2a2a2a; color: #fff; }
    .vmodal-video { width: 100%; background: #000; display: block; max-height: 60vh; }
    .vmodal-footer { padding: 18px 20px; }
    .vmodal-stars { color: var(--gold); font-size: 1.1rem; letter-spacing: 1px; margin-bottom: 8px; }
    .vmodal-quote {
      font-family: 'Instrument Serif', serif; font-size: 1.05rem; font-style: italic;
      color: #ccc; line-height: 1.65;
    }

    /* ── Loading skeleton ── */
    .skeleton { background: #1e1e1e; border-radius: 8px; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Header stats row ── */
    .profile-stats {
      display: flex; align-items: stretch; justify-content: center;
      margin: 24px auto 20px; background: #141414; border: 1px solid #2a2a2a;
      border-radius: 16px; overflow: hidden; max-width: 380px;
    }
    .profile-stat { flex: 1; padding: 15px 18px; text-align: center; position: relative; }
    .profile-stat + .profile-stat::before {
      content: ''; position: absolute; left: 0; top: 20%; height: 60%; width: 1px; background: #2a2a2a;
    }
    .profile-stat-val {
      font-family: 'Instrument Serif', serif; font-size: 1.35rem; color: #f0ece4;
      line-height: 1; margin-bottom: 5px;
    }
    .profile-stat-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #555; }
    .profile-stat.stat-verified .profile-stat-val { color: #6dbf8a; }

    /* ── Profile logo ── */
    .profile-logo {
      width: 80px; height: 80px; border-radius: 16px; object-fit: cover;
      margin: 0 auto 20px; display: block; border: 2px solid #2a2a2a;
    }

    /* ── Industry / location tags ── */
    .profile-tags { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
    .profile-tag {
      font-size: 0.75rem; font-weight: 600; padding: 3px 11px; border-radius: 20px;
      background: #1e1e1e; border: 1px solid #2a2a2a; color: #888;
    }

    /* ── Website + social links ── */
    .profile-links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
    .profile-link {
      font-size: 0.78rem; font-weight: 600; color: #666; text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px;
      background: #141414; border: 1px solid #2a2a2a; border-radius: 20px;
      transition: border-color 0.15s, color 0.15s;
    }
    .profile-link:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Pending / empty states ── */
    .pending-hero { max-width: 500px; margin: 80px auto; text-align: center; padding: 0 24px; }
    .pending-pip { height: 5px; flex: 1; border-radius: 3px; }
    .profile-footer { text-align: center; padding: 32px 24px 48px; color: #999; font-size: 0.78rem; border-top: 1px solid #1e1e1e; margin-top: 48px; }
    .profile-footer a { color: #777; text-decoration: none; }
    .profile-footer a:hover { color: var(--gold); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.4/babel.min.js"></script>

  <script>
    const FIREBASE_CONFIG = {
      apiKey:            "AIzaSyCB4cRZeklNwb6ShKVynKiQHHKeUcnk51E",
      authDomain:        "vouch-cdf1c.firebaseapp.com",
      projectId:         "vouch-cdf1c",
      storageBucket:     "vouch-cdf1c.firebasestorage.app",
      messagingSenderId: "455089585165",
      appId:             "1:455089585165:web:3952731c6780fee4f76944",
    };
    firebase.initializeApp(FIREBASE_CONFIG);
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── Helpers ──────────────────────────────────────────────────────────────────
    function calcScore(approved) {
      if (approved.length < 3) return null;
      const sum = approved.reduce((s, t) => s + (Number(t.rating) || 0), 0);
      return Math.round((sum / approved.length) * 10) / 10;
    }

    function firstVideoUrl(t) {
      const urls = t.videoURLs || {};
      const keys = Object.keys(urls).sort();
      return keys.length > 0 ? urls[keys[0]] : null;
    }

    function Stars({ rating, size = "0.9rem" }) {
      const r = Math.round(Number(rating) || 0);
      return (
        <span style={{ color: "var(--gold)", fontSize: size, letterSpacing: "1px" }}>
          {"★".repeat(r)}{"☆".repeat(Math.max(0, 5 - r))}
        </span>
      );
    }

    // ── Rating bar chart ─────────────────────────────────────────────────────────
    function RatingBars({ approved }) {
      const total = approved.length || 1;
      return (
        <div className="rating-bars">
          {[5, 4, 3, 2, 1].map(star => {
            const count = approved.filter(t => Math.round(Number(t.rating)) === star).length;
            return (
              <div key={star} className="rating-row">
                <div className="rating-row-label">{star}</div>
                <div className="rating-track">
                  <div className="rating-fill" style={{ width: `${(count / total) * 100}%` }} />
                </div>
                <div className="rating-row-count">{count}</div>
              </div>
            );
          })}
        </div>
      );
    }

    // ── Video modal ──────────────────────────────────────────────────────────────
    function VideoModal({ testimonial, onClose }) {
      const rawUrl = firstVideoUrl(testimonial);
      const [tapToPlay, setTapToPlay] = useState(false);
      const [loading, setLoading]     = useState(!!rawUrl);
      const [errored, setErrored]     = useState(false);
      const videoRef          = useRef(null);
      const canPlayHandlerRef = useRef(null);

      useEffect(() => {
        if (!rawUrl) return;
        const video = videoRef.current;
        if (!video) return;

        setLoading(true); setErrored(false); setTapToPlay(false);
        let cancelled = false;

        async function loadAndPlay() {
          let url = rawUrl;
          try {
            url = await firebase.storage().refFromURL(rawUrl).getDownloadURL();
          } catch (e) {
            console.warn("[vouch/profile/modal] URL refresh failed:", e.message);
          }
          if (cancelled) return;
          setLoading(false);
          video.src = url;
          video.load();
          const handler = () => {
            canPlayHandlerRef.current = null;
            video.play().catch(err => {
              console.warn("[vouch/profile/modal] play() blocked:", err.name);
              setTapToPlay(true);
            });
          };
          canPlayHandlerRef.current = handler;
          video.addEventListener("canplay", handler, { once: true });
        }
        loadAndPlay();
        return () => {
          cancelled = true;
          if (canPlayHandlerRef.current) {
            video.removeEventListener("canplay", canPlayHandlerRef.current);
            canPlayHandlerRef.current = null;
          }
        };
      }, [rawUrl]);

      useEffect(() => {
        function onKey(e) { if (e.key === "Escape") onClose(); }
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [onClose]);

      function handleTap() {
        const video = videoRef.current;
        if (!video) return;
        setTapToPlay(false);
        video.play().catch(err => {
          console.warn("[vouch/profile/modal] tap play() failed:", err.name);
          setTapToPlay(true);
        });
      }

      return (
        <div className="vmodal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="vmodal">
            <div className="vmodal-header">
              <div>
                <div className="vmodal-name">{testimonial.clientName}</div>
                {testimonial.clientCompany && (
                  <div className="vmodal-company">{testimonial.clientCompany}</div>
                )}
              </div>
              <button className="vmodal-close" onClick={onClose} aria-label="Close">✕</button>
            </div>

            {rawUrl ? (
              <div style={{ position: "relative", background: "#000" }}>
                <video
                  ref={videoRef}
                  className="vmodal-video"
                  controls
                  playsInline
                  preload="auto"
                  onPlaying={() => setTapToPlay(false)}
                  onError={() => { setErrored(true); setLoading(false); }}
                />
                {loading && (
                  <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "#000", minHeight: 180 }}>
                    <div style={{ width: 32, height: 32, border: "3px solid #333", borderTopColor: "var(--gold)", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />
                  </div>
                )}
                {tapToPlay && !errored && (
                  <div onClick={handleTap} style={{
                    position: "absolute", inset: 0, display: "flex", flexDirection: "column",
                    alignItems: "center", justifyContent: "center",
                    background: "rgba(0,0,0,0.55)", cursor: "pointer", gap: 10,
                  }}>
                    <div style={{ width: 56, height: 56, borderRadius: "50%", background: "rgba(200,169,110,0.9)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <span style={{ color: "#fff", fontSize: "0.85rem", fontWeight: 600 }}>Tap to play</span>
                  </div>
                )}
              </div>
            ) : (
              <div style={{ background: "#0a0a0a", aspectRatio: "16/9", display: "flex", alignItems: "center", justifyContent: "center", color: "#444" }}>
                No video available
              </div>
            )}

            <div className="vmodal-footer">
              <div className="vmodal-stars"><Stars rating={testimonial.rating} size="1.2rem" /></div>
              {testimonial.quote && (
                <div className="vmodal-quote">"{testimonial.quote}"</div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ── Featured video (largest, most recent) ────────────────────────────────────
    function FeaturedVideo({ testimonial }) {
      const rawUrl = firstVideoUrl(testimonial);
      const [tapToPlay, setTapToPlay] = useState(false);
      const [loading, setLoading]     = useState(!!rawUrl);
      const [errored, setErrored]     = useState(false);
      const videoRef          = useRef(null);
      const canPlayHandlerRef = useRef(null);

      useEffect(() => {
        if (!rawUrl) return;
        const video = videoRef.current;
        if (!video) return;

        setLoading(true); setErrored(false); setTapToPlay(false);

        if (canPlayHandlerRef.current) {
          video.removeEventListener("canplay", canPlayHandlerRef.current);
          canPlayHandlerRef.current = null;
        }

        let cancelled = false;
        async function loadAndPlay() {
          let url = rawUrl;
          try {
            url = await firebase.storage().refFromURL(rawUrl).getDownloadURL();
            console.log("[vouch/profile/featured] refreshed URL:", url.slice(0, 80) + "…");
          } catch (e) {
            console.warn("[vouch/profile/featured] URL refresh failed:", e.message);
          }
          if (cancelled) return;
          setLoading(false);
          video.src = url;
          video.load();
          const handler = () => {
            canPlayHandlerRef.current = null;
            video.play().catch(err => {
              console.warn("[vouch/profile/featured] play() blocked:", err.name);
              setTapToPlay(true);
            });
          };
          canPlayHandlerRef.current = handler;
          video.addEventListener("canplay", handler, { once: true });
        }
        loadAndPlay();
        return () => {
          cancelled = true;
          if (canPlayHandlerRef.current) {
            video.removeEventListener("canplay", canPlayHandlerRef.current);
            canPlayHandlerRef.current = null;
          }
        };
      }, [rawUrl]);

      function handleTap() {
        const video = videoRef.current;
        if (!video) return;
        setTapToPlay(false);
        video.play().catch(err => {
          console.warn("[vouch/profile/featured] tap play() failed:", err.name);
          setTapToPlay(true);
        });
      }

      return (
        <div className="section-wrap" style={{ paddingBottom: 0 }}>
          <div className="section-heading">Featured testimonial</div>
          <div className="featured-video-wrap">
            {rawUrl ? (
              <>
                <video
                  ref={videoRef}
                  controls
                  playsInline
                  preload="auto"
                  style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }}
                  onPlaying={() => setTapToPlay(false)}
                  onError={() => { setErrored(true); setLoading(false); }}
                />
                {loading && (
                  <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "#000" }}>
                    <div style={{ width: 36, height: 36, border: "3px solid #333", borderTopColor: "var(--gold)", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />
                  </div>
                )}
                {tapToPlay && !errored && (
                  <div onClick={handleTap} style={{
                    position: "absolute", inset: 0, display: "flex", flexDirection: "column",
                    alignItems: "center", justifyContent: "center",
                    background: "rgba(0,0,0,0.55)", cursor: "pointer", gap: 10,
                  }}>
                    <div style={{ width: 72, height: 72, borderRadius: "50%", background: "rgba(200,169,110,0.9)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <svg width="32" height="32" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <span style={{ color: "#fff", fontSize: "0.9rem", fontWeight: 600 }}>Tap to play</span>
                  </div>
                )}
                {errored && (
                  <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.7)", color: "#e07a7a", fontSize: "0.88rem" }}>
                    Video could not be loaded
                  </div>
                )}
              </>
            ) : (
              <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "#0a0a0a", color: "#333", fontSize: "0.9rem" }}>
                No video recorded
              </div>
            )}
          </div>
          <div className="featured-caption">
            <div>
              <div className="featured-name">{testimonial.clientName}</div>
              {testimonial.clientCompany && <div className="featured-company">{testimonial.clientCompany}</div>}
            </div>
            <Stars rating={testimonial.rating} size="1.1rem" />
          </div>
        </div>
      );
    }

    // ── Testimonial card ─────────────────────────────────────────────────────────
    function TestimonialCard({ testimonial, onClick }) {
      const url = firstVideoUrl(testimonial);

      return (
        <div className="t-card" onClick={onClick} role="button" tabIndex={0}
          onKeyDown={e => e.key === "Enter" && onClick()}>
          {/* Thumbnail */}
          <div className="t-thumb">
            {url ? (
              <>
                <video
                  src={url}
                  className="t-thumb-video"
                  preload="metadata"
                  playsInline
                  muted
                  // Seek to 1s to show a frame rather than a black first frame
                  onLoadedMetadata={e => { try { e.target.currentTime = 1; } catch {} }}
                />
                <div style={{
                  position: "absolute", inset: 0, display: "flex",
                  alignItems: "center", justifyContent: "center",
                  background: "rgba(0,0,0,0.3)",
                }}>
                  <div className="play-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--gold)"><path d="M8 5v14l11-7z"/></svg>
                  </div>
                </div>
              </>
            ) : (
              <div className="t-thumb-placeholder">
                <div className="play-btn">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--gold)" style={{ opacity: 0.4 }}><path d="M8 5v14l11-7z"/></svg>
                </div>
              </div>
            )}
          </div>

          {/* Body */}
          <div className="t-body">
            <div className="t-header">
              <div>
                <div className="t-name">{testimonial.clientName}</div>
                {testimonial.clientCompany && <div className="t-company">{testimonial.clientCompany}</div>}
              </div>
              <Stars rating={testimonial.rating} />
            </div>
            {testimonial.quote && (
              <div className="t-quote">"{testimonial.quote.length > 120 ? testimonial.quote.substring(0, 118) + "…" : testimonial.quote}"</div>
            )}
            <div className="t-foot">
              <div className="t-verified">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="#6dbf8a"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                Verified
              </div>
              {testimonial.campaignName && (
                <div className="t-campaign">{testimonial.campaignName}</div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ── Profile page ─────────────────────────────────────────────────────────────
    function ProfilePage() {
      const userId = window.location.pathname.split("/").filter(Boolean).pop() || null;
      console.log("[vouch/profile] pathname:", window.location.pathname, "| userId:", userId);

      const [loading, setLoading]           = useState(true);
      const [notFound, setNotFound]         = useState(false);
      const [companyName, setCompanyName]   = useState("");
      const [profileData, setProfileData]   = useState({});
      const [testimonials, setTestimonials] = useState([]);
      const [modalTarget, setModalTarget]   = useState(null);

      useEffect(() => {
        if (!userId) {
          console.warn("[vouch/profile] no userId in URL — showing not found");
          setNotFound(true); setLoading(false); return;
        }
        console.log("[vouch/profile] loading Firestore data for userId:", userId);

        const db   = firebase.firestore();
        const auth = firebase.auth();
        let unsub  = () => {};

        auth.signInAnonymously()
          .then(cred => { console.log("[vouch/profile] anon auth uid:", cred.user.uid); startListeners(); })
          .catch(e  => { console.warn("[vouch/profile] anon auth failed:", e.message, "— trying anyway"); startListeners(); });

        function startListeners() {
          unsub = db.collection("users").doc(userId)
            .collection("testimonials")
            .where("status", "==", "approved")
            .onSnapshot(snap => {
              const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
              console.log("[vouch/profile] snapshot — approved:", all.length);
              setTestimonials(all);
              setLoading(false);
            }, err => {
              console.error("[vouch/profile] snapshot error:", err.code, err.message);
              setNotFound(true); setLoading(false);
            });

          // Try the user doc first, then fall back to campaigns collection for company name
          db.collection("users").doc(userId).get()
            .then(snap => {
              if (snap.exists) {
                const d = snap.data();
                const p = d.profile || {};
                const name = p.businessName || d.companyName || d.displayName || "";
                console.log("[vouch/profile] user doc — profile.businessName:", p.businessName, "| companyName:", d.companyName, "| resolved:", name || "(empty)");
                if (name) setCompanyName(name);
                setProfileData(p);
                if (p.isPublic === false) { setNotFound(true); setLoading(false); return; }
                if (!name) {
                  // No name on user doc — look in campaigns for companyName
                  return db.collection("users").doc(userId).collection("campaigns").limit(1).get()
                    .then(cSnap => {
                      if (!cSnap.empty) {
                        const cn = cSnap.docs[0].data().companyName;
                        if (cn) { console.log("[vouch/profile] name from campaigns:", cn); setCompanyName(cn); }
                      }
                    });
                }
              } else {
                console.log("[vouch/profile] user doc not found — checking campaigns for name");
                return db.collection("users").doc(userId).collection("campaigns").limit(1).get()
                  .then(cSnap => {
                    if (!cSnap.empty) {
                      const cn = cSnap.docs[0].data().companyName;
                      if (cn) { console.log("[vouch/profile] name from campaigns:", cn); setCompanyName(cn); }
                    }
                  });
              }
            })
            .catch(e => console.warn("[vouch/profile] user doc read:", e.code, e.message));
        }

        return () => unsub();
      }, []);

      // campaignName on testimonials is the campaign title, not the business name —
      // company name is resolved via user doc / campaigns in startListeners instead.

      // Dynamic document title
      useEffect(() => {
        const name = companyName || "Vouch Verified Business";
        const app = testimonials.filter(t => t.rating > 0);
        const sc = calcScore(app);
        if (sc !== null) {
          document.title = `${name} — ${sc.toFixed(1)} Vouch Score · ${app.length} verified testimonial${app.length !== 1 ? "s" : ""}`;
        } else {
          document.title = `${name} — Vouch Profile`;
        }
      }, [companyName, testimonials]);

      // Sort by most recent; separate featured from grid
      const approved = testimonials
        .filter(t => t.rating > 0)
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      const featured  = approved[0] || null;
      const gridItems = approved.slice(1);
      const score     = calcScore(approved);
      const initials  = (companyName || "V").substring(0, 2).toUpperCase();

      // ── Loading ──
      if (loading) return (
        <div style={{ maxWidth: 860, margin: "80px auto", padding: "0 24px" }}>
          <div className="skeleton" style={{ height: 24, width: 100, margin: "0 auto 48px" }} />
          <div className="skeleton" style={{ height: 200, borderRadius: 20, marginBottom: 40 }} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            {[1,2,3,4].map(i => <div key={i} className="skeleton" style={{ height: 220, borderRadius: 14 }} />)}
          </div>
        </div>
      );

      // ── Not found ──
      if (notFound || !userId) return (
        <div className="pending-hero">
          <div style={{ fontSize: "3rem", marginBottom: 20 }}>🔍</div>
          <div style={{ fontFamily: "'Instrument Serif',serif", fontSize: "1.8rem", marginBottom: 12 }}>Profile not found</div>
          <div style={{ color: "var(--muted)", fontSize: "0.95rem", lineHeight: 1.6 }}>
            This Vouch profile doesn't exist or has been removed.
          </div>
        </div>
      );

      return (
        <>
          {/* Header */}
          <div className="profile-hero">
            <span className="profile-wordmark">✦ Vouch</span>
            {profileData.logoUrl ? (
              <img src={profileData.logoUrl} alt={companyName || "Logo"} className="profile-logo" />
            ) : (
              <div className="profile-avatar">{initials}</div>
            )}
            <div className="profile-company">{companyName || "Vouch Verified Business"}</div>
            {(profileData.industry || profileData.location) && (
              <div className="profile-tags">
                {profileData.industry && <span className="profile-tag">{profileData.industry}</span>}
                {profileData.location && <span className="profile-tag">📍 {profileData.location}</span>}
              </div>
            )}
            {approved.length > 0 && (
              <div className="profile-stats">
                <div className="profile-stat">
                  <div className="profile-stat-val">{approved.length}</div>
                  <div className="profile-stat-label">Vouches</div>
                </div>
                <div className="profile-stat">
                  <div className="profile-stat-val">{score !== null ? score.toFixed(1) + " ★" : "—"}</div>
                  <div className="profile-stat-label">Score</div>
                </div>
                <div className={`profile-stat${score !== null ? " stat-verified" : ""}`}>
                  <div className="profile-stat-val">{score !== null ? "✓" : "—"}</div>
                  <div className="profile-stat-label">Verified</div>
                </div>
              </div>
            )}
            {(profileData.website || profileData.linkedin || profileData.twitter || profileData.instagram) && (
              <div className="profile-links">
                {profileData.website && (
                  <a href={profileData.website} target="_blank" rel="noopener" className="profile-link">🌐 Website</a>
                )}
                {profileData.linkedin && (
                  <a href={profileData.linkedin} target="_blank" rel="noopener" className="profile-link">in LinkedIn</a>
                )}
                {profileData.twitter && (
                  <a href={profileData.twitter} target="_blank" rel="noopener" className="profile-link">𝕏 Twitter</a>
                )}
                {profileData.instagram && (
                  <a href={profileData.instagram} target="_blank" rel="noopener" className="profile-link">📸 Instagram</a>
                )}
              </div>
            )}
          </div>

          {/* Score block */}
          {score !== null ? (
            <div className="score-hero">
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div className="score-big">{score.toFixed(1)}</div>
                <div className="score-star">⭐</div>
              </div>
              <div>
                <div className="score-meta-title">✦ Vouch Score</div>
                <div className="score-meta-count">
                  {approved.length} people have Vouched for {companyName || "this business"}
                </div>
                <RatingBars approved={approved} />
              </div>
            </div>
          ) : approved.length > 0 && (
            <div style={{ maxWidth: 860, margin: "0 auto 40px", padding: "0 24px" }}>
              <div style={{ background: "#141414", border: "1px solid #222", borderRadius: 14, padding: "24px 28px", textAlign: "center" }}>
                <div style={{ color: "#555", fontSize: "0.72rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 8 }}>✦ Vouch Score</div>
                <div style={{ fontFamily: "'Instrument Serif',serif", fontSize: "1.2rem", color: "#888", marginBottom: 10 }}>
                  Score pending — {Math.max(0, 3 - approved.length)} more verified testimonial{3 - approved.length !== 1 ? "s" : ""} needed
                </div>
                <div style={{ display: "flex", gap: 6, width: 120, margin: "0 auto" }}>
                  {[0,1,2].map(i => <div key={i} className="pending-pip" style={{ background: i < approved.length ? "#c8a96e" : "#2a2a2a" }} />)}
                </div>
              </div>
            </div>
          )}

          {/* Bio section */}
          {profileData.bio && (
            <div style={{ maxWidth: 860, margin: "0 auto 32px", padding: "0 24px" }}>
              <div style={{ background: "#141414", border: "1px solid #222", borderRadius: 14, padding: "20px 24px" }}>
                <div style={{ fontSize: "0.68rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", color: "#555", marginBottom: 8 }}>About</div>
                <p style={{ fontSize: "0.95rem", color: "#aaa", lineHeight: 1.65, margin: 0 }}>{profileData.bio}</p>
              </div>
            </div>
          )}

          {/* Featured video */}
          {featured && <FeaturedVideo testimonial={featured} />}

          {/* Testimonial grid */}
          {gridItems.length > 0 && (
            <div className="section-wrap" style={{ paddingTop: 48 }}>
              <div className="section-heading">What clients say</div>
              <div className="t-grid">
                {gridItems.map(t => (
                  <TestimonialCard key={t.id} testimonial={t} onClick={() => setModalTarget(t)} />
                ))}
              </div>
            </div>
          )}

          {/* Empty state */}
          {approved.length === 0 && (
            <div style={{ textAlign: "center", padding: "60px 24px", color: "#555" }}>
              <div style={{ fontSize: "2.5rem", marginBottom: 16 }}>💬</div>
              <div style={{ fontFamily: "'Instrument Serif',serif", fontSize: "1.3rem", color: "#888" }}>
                No approved testimonials yet
              </div>
            </div>
          )}

          {/* Video modal */}
          {modalTarget && (
            <VideoModal testimonial={modalTarget} onClose={() => setModalTarget(null)} />
          )}

          <div className="profile-footer">
            Powered by <a href="https://vouchbusiness.com">Vouch</a> &nbsp;&middot;&nbsp;
            <a href="/terms">Terms</a> &nbsp;&middot;&nbsp;
            <a href="/privacy">Privacy</a> &nbsp;&middot;&nbsp;
            <a href="/gdpr">GDPR</a> &nbsp;&middot;&nbsp;
            <a href="mailto:hello@vouchbusiness.com">Contact</a>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ProfilePage />);
  </script>
</body>
</html>
