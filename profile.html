<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vouch Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #c8a96e;
      --bg: #0e0e0e;
      --card: #141414;
      --border: #222;
      --ink: #f0ece4;
      --muted: #888;
    }
    body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    .serif { font-family: 'Instrument Serif', serif; }

    /* ── Header / hero ── */
    .profile-hero {
      max-width: 780px; margin: 0 auto; padding: 64px 24px 40px;
      text-align: center;
    }
    .profile-wordmark {
      font-family: 'Instrument Serif', serif;
      font-size: 1.1rem; color: var(--gold); letter-spacing: 0.04em;
      margin-bottom: 48px; display: block;
    }
    .profile-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, #c8a96e 0%, #a07040 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 700; color: #fff;
      margin: 0 auto 20px; font-family: 'Instrument Serif', serif;
    }
    .profile-company { font-family: 'Instrument Serif', serif; font-size: 2rem; margin-bottom: 8px; }
    .verified-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: #0d2e1a; border: 1px solid #2a6a3a; color: #6dbf8a;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em;
      padding: 4px 12px; border-radius: 20px; text-transform: uppercase; margin-bottom: 32px;
    }

    /* ── Score hero block ── */
    .score-hero {
      display: flex; align-items: center; justify-content: center; gap: 32px;
      flex-wrap: wrap;
      background: linear-gradient(135deg, #1a1710 0%, #141414 100%);
      border: 1px solid #c8a96e44; border-radius: 20px;
      padding: 36px 40px; margin: 0 24px 48px; max-width: 780px;
      margin-left: auto; margin-right: auto;
      position: relative; overflow: hidden;
    }
    .score-hero::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at top right, #c8a96e12 0%, transparent 65%);
      pointer-events: none;
    }
    .score-big {
      font-family: 'Instrument Serif', serif; font-size: 5rem; line-height: 1;
      color: var(--gold);
    }
    .score-star { font-size: 2.5rem; line-height: 1; }
    .score-meta { text-align: left; }
    .score-meta-title {
      font-size: 0.7rem; font-weight: 700; color: var(--gold);
      text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 6px;
    }
    .score-meta-count { font-size: 1rem; color: var(--muted); margin-bottom: 16px; }

    /* ── Rating bar chart ── */
    .rating-bars { width: 200px; }
    .rating-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .rating-row-label { font-size: 0.78rem; color: var(--muted); width: 18px; text-align: right; flex-shrink: 0; }
    .rating-track { flex: 1; height: 7px; background: #222; border-radius: 4px; overflow: hidden; }
    .rating-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.6s ease; }
    .rating-row-count { font-size: 0.72rem; color: var(--muted); width: 16px; flex-shrink: 0; }

    /* ── Testimonial grid ── */
    .testimonials-section { max-width: 780px; margin: 0 auto; padding: 0 24px 64px; }
    .section-heading {
      font-family: 'Instrument Serif', serif; font-size: 1.5rem; margin-bottom: 24px;
    }
    .t-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (max-width: 600px) { .t-grid { grid-template-columns: 1fr; } }
    .t-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 22px 24px; display: flex; flex-direction: column; gap: 12px;
    }
    .t-card-header { display: flex; align-items: center; justify-content: space-between; }
    .t-card-name { font-weight: 700; font-size: 0.95rem; }
    .t-card-company { font-size: 0.8rem; color: var(--muted); margin-top: 1px; }
    .t-card-stars { color: var(--gold); font-size: 0.95rem; letter-spacing: 1px; }
    .t-card-quote {
      font-family: 'Instrument Serif', serif; font-size: 1.05rem; font-style: italic;
      color: #ccc; line-height: 1.65;
    }
    .t-card-campaign { font-size: 0.75rem; color: #555; margin-top: 4px; }

    /* ── Pending state ── */
    .pending-hero {
      max-width: 500px; margin: 80px auto; text-align: center; padding: 0 24px;
    }
    .pending-hero-icon { font-size: 3rem; margin-bottom: 20px; }
    .pending-hero-title { font-family: 'Instrument Serif', serif; font-size: 1.8rem; margin-bottom: 12px; }
    .pending-hero-sub { color: var(--muted); font-size: 0.95rem; line-height: 1.6; }
    .pending-progress { display: flex; gap: 6px; margin: 24px auto 0; width: 120px; }
    .pending-pip { height: 5px; flex: 1; border-radius: 3px; }

    /* ── Footer ── */
    .profile-footer { text-align: center; padding: 32px 24px; color: #444; font-size: 0.8rem; }
    .profile-footer a { color: var(--gold); text-decoration: none; }

    /* ── Loading skeleton ── */
    .skeleton { background: #1e1e1e; border-radius: 8px; animation: shimmer 1.4s infinite; }
    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.4/babel.min.js"></script>

  <script>
    const FIREBASE_CONFIG = {
      apiKey:            "AIzaSyCB4cRZeklNwb6ShKVynKiQHHKeUcnk51E",
      authDomain:        "vouch-cdf1c.firebaseapp.com",
      projectId:         "vouch-cdf1c",
      storageBucket:     "vouch-cdf1c.firebasestorage.app",
      messagingSenderId: "455089585165",
      appId:             "1:455089585165:web:3952731c6780fee4f76944",
    };
    firebase.initializeApp(FIREBASE_CONFIG);
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── Vouch Score ────────────────────────────────────────────────────────────
    function calcScore(approved) {
      if (approved.length < 3) return null;
      const sum = approved.reduce((s, t) => s + (Number(t.rating) || 0), 0);
      return Math.round((sum / approved.length) * 10) / 10;
    }

    // ── Rating breakdown ───────────────────────────────────────────────────────
    function RatingBars({ approved }) {
      const total = approved.length || 1;
      return (
        <div className="rating-bars">
          {[5, 4, 3, 2, 1].map(star => {
            const count = approved.filter(t => Math.round(Number(t.rating)) === star).length;
            return (
              <div key={star} className="rating-row">
                <div className="rating-row-label">{star}</div>
                <div className="rating-track">
                  <div className="rating-fill" style={{ width: `${(count / total) * 100}%` }} />
                </div>
                <div className="rating-row-count">{count}</div>
              </div>
            );
          })}
        </div>
      );
    }

    // ── Profile page ───────────────────────────────────────────────────────────
    function ProfilePage() {
      // Extract userId from the last path segment: /profile/{userId}
      const userId = window.location.pathname.split("/").filter(Boolean).pop() || null;
      console.log("[vouch/profile] pathname:", window.location.pathname, "| userId:", userId);

      const [loading, setLoading]           = useState(true);
      const [notFound, setNotFound]         = useState(false);
      const [companyName, setCompanyName]   = useState("");
      const [testimonials, setTestimonials] = useState([]);

      useEffect(() => {
        if (!userId) {
          console.warn("[vouch/profile] no userId in URL — showing not found");
          setNotFound(true); setLoading(false); return;
        }
        console.log("[vouch/profile] loading Firestore data for userId:", userId);

        const db   = firebase.firestore();
        const auth = firebase.auth();

        // Sign in anonymously so Firestore rules (request.auth != null) pass
        auth.signInAnonymously()
          .then(cred => console.log("[vouch/profile] anon auth uid:", cred.user.uid))
          .catch(e => console.warn("[vouch/profile] anon auth failed:", e.message));

        // Watch approved testimonials in real time
        const unsub = db
          .collection("users").doc(userId)
          .collection("testimonials")
          .onSnapshot(snap => {
            const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            console.log("[vouch/profile] testimonials snapshot — count:", all.length,
              "| approved:", all.filter(t => t.status === "approved").length);
            setTestimonials(all);
            setLoading(false);
          }, err => {
            console.error("[vouch/profile] snapshot error:", err.code, err.message);
            setNotFound(true); setLoading(false);
          });

        // Fetch company name from user doc (stored when campaigns are saved)
        db.collection("users").doc(userId).get().then(snap => {
          if (snap.exists) {
            const data = snap.data();
            setCompanyName(data.companyName || data.displayName || "");
          }
        }).catch(() => {});

        return () => unsub();
      }, []);

      // Derive company name from campaigns if not on user doc
      useEffect(() => {
        if (companyName || testimonials.length === 0) return;
        const t = testimonials.find(t => t.companyName);
        if (t) setCompanyName(t.companyName);
      }, [testimonials, companyName]);

      const approved  = testimonials.filter(t => t.status === "approved" && t.rating > 0);
      const score     = calcScore(approved);
      const initials  = (companyName || "V").substring(0, 2).toUpperCase();

      if (loading) return (
        <div style={{ maxWidth: 780, margin: "80px auto", padding: "0 24px" }}>
          <div className="skeleton" style={{ height: 28, width: 120, margin: "0 auto 48px" }} />
          <div className="skeleton" style={{ height: 220, borderRadius: 20, marginBottom: 40 }} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            {[1,2,3,4].map(i => <div key={i} className="skeleton" style={{ height: 160, borderRadius: 14 }} />)}
          </div>
        </div>
      );

      if (notFound || !userId) return (
        <div className="pending-hero">
          <div className="pending-hero-icon">🔍</div>
          <div className="pending-hero-title">Profile not found</div>
          <div className="pending-hero-sub">This Vouch profile doesn't exist or has been removed.</div>
        </div>
      );

      return (
        <>
          {/* Header */}
          <div className="profile-hero">
            <span className="profile-wordmark">✦ Vouch</span>
            <div className="profile-avatar">{initials}</div>
            <div className="profile-company">{companyName || "Business Profile"}</div>
            {score !== null && (
              <div className="verified-badge">
                <span>✓</span> Vouch Verified
              </div>
            )}
          </div>

          {/* Score hero block */}
          {score !== null ? (
            <div className="score-hero">
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div className="score-big">{score.toFixed(1)}</div>
                <div className="score-star">⭐</div>
              </div>
              <div className="score-meta">
                <div className="score-meta-title">✦ Vouch Score</div>
                <div className="score-meta-count">
                  Based on {approved.length} verified testimonial{approved.length !== 1 ? "s" : ""}
                </div>
                <RatingBars approved={approved} />
              </div>
            </div>
          ) : (
            <div style={{ maxWidth: 780, margin: "0 auto 48px", padding: "0 24px" }}>
              <div style={{
                background: "#141414", border: "1px solid #222", borderRadius: 16,
                padding: "32px 36px", textAlign: "center",
              }}>
                <div style={{ color: "#555", fontSize: "0.75rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 10 }}>✦ Vouch Score</div>
                <div style={{ fontFamily: "'Instrument Serif', serif", fontSize: "1.3rem", color: "#888", marginBottom: 10 }}>
                  Score pending — need {Math.max(0, 3 - approved.length)} more verified testimonial{3 - approved.length !== 1 ? "s" : ""}
                </div>
                <div className="pending-progress" style={{ margin: "0 auto" }}>
                  {[0,1,2].map(i => (
                    <div key={i} className="pending-pip" style={{ background: i < approved.length ? "#c8a96e" : "#2a2a2a" }} />
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Testimonials */}
          <div className="testimonials-section">
            {approved.length > 0 && (
              <>
                <div className="section-heading">What clients say</div>
                <div className="t-grid">
                  {approved.map(t => (
                    <div key={t.id} className="t-card">
                      <div>
                        <div className="t-card-header">
                          <div>
                            <div className="t-card-name">{t.clientName}</div>
                            {t.clientCompany && <div className="t-card-company">{t.clientCompany}</div>}
                          </div>
                          <div className="t-card-stars">
                            {"★".repeat(Math.round(Number(t.rating) || 0))}
                            {"☆".repeat(Math.max(0, 5 - Math.round(Number(t.rating) || 0)))}
                          </div>
                        </div>
                      </div>
                      {t.quote && <div className="t-card-quote">"{t.quote}"</div>}
                      {t.campaignName && <div className="t-card-campaign">{t.campaignName}</div>}
                    </div>
                  ))}
                </div>
              </>
            )}

            {approved.length === 0 && (
              <div style={{ textAlign: "center", padding: "60px 0", color: "#555" }}>
                <div style={{ fontSize: "2.5rem", marginBottom: 16 }}>💬</div>
                <div style={{ fontFamily: "'Instrument Serif', serif", fontSize: "1.3rem", color: "#888" }}>
                  No approved testimonials yet
                </div>
              </div>
            )}
          </div>

          <div className="profile-footer">
            Powered by <a href="https://vouchbusiness.com">Vouch</a>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ProfilePage />);
  </script>
</body>
</html>
